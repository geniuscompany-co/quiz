<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brainrush! — Live Spectator</title>
<style>
:root{
  --bg1:#6422cf;
  --bg2:#3f1382;
  --bg3:#1c073e;
  --gold:#ffdf5d;
  --ink:#2b0d57;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at 50% -15%,var(--bg1) 0%,var(--bg2) 54%,var(--bg3) 100%) fixed;
  color:#fff;
  display:flex;
  flex-direction:column;
  font-variant-numeric:tabular-nums;
}
body.hc{background:#000!important}
body.hc .panel-card,body.hc .row{background:#111!important;border:2px solid #fff!important}

/* --- Broadcast Header --- */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  padding:14px 26px;
  background:rgba(16,4,38,.78);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.15);
  box-shadow:0 6px 24px rgba(0,0,0,.28);
}
.brand-grp{
  display:flex;
  align-items:center;
  gap:12px;
}
.brand-logo{
  font-size:1.38em;
  font-weight:900;
  letter-spacing:-.01em;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.live-dot{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:.74em;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.07em;
  padding:4px 11px;
  border-radius:99px;
  background:rgba(105,240,174,.18);
  border:1px solid rgba(105,240,174,.45);
  color:#9cffbe;
}
.hd-right{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
#hd{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  font-weight:800;
  font-size:1.08em;
}
.join-banner{
  display:inline-flex;
  align-items:center;
  gap:9px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  padding:5px 12px;
}
.pin-badge{
  background:var(--gold);
  color:var(--ink);
  font-weight:900;
  font-size:1.14em;
  padding:3px 13px;
  border-radius:8px;
  letter-spacing:2px;
  box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.mini-qr{
  width:38px;
  height:38px;
  border-radius:6px;
  background:#fff;
  padding:2px;
  object-fit:contain;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#fff;
  color:#46178f;
  font-weight:900;
  font-size:.92em;
  padding:5px 14px;
  border-radius:99px;
}
.pill.subtle{
  background:rgba(255,255,255,.13);
  color:#fff;
  border:1px solid rgba(255,255,255,.2);
}
.util-btn{
  border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.1);
  color:#fff;
  font-weight:800;
  font-size:.82em;
  padding:6px 11px;
  border-radius:99px;
  cursor:pointer;
}
.util-btn.on{
  background:rgba(105,240,174,.18);
  border-color:rgba(105,240,174,.5);
  color:#b9f6ca;
}

/* --- Main Stage --- */
main{
  flex:1;
  display:grid;
  gap:24px;
  padding:24px 28px;
  max-width:1560px;
  width:100%;
  margin:0 auto;
  align-content:start;
}
main.both{grid-template-columns:1.08fr .92fr}
@media (max-width:960px){
  main.both{grid-template-columns:1fr}
  header{padding:12px 16px}
  main{padding:16px}
}

.panel-card{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.18);
  border-radius:20px;
  padding:20px 22px;
  box-shadow:0 12px 34px rgba(0,0,0,.28);
  backdrop-filter:blur(8px);
}
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
  padding-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,.14);
}
.panel-head h2{
  margin:0;
  font-size:1.45em;
  font-weight:900;
  letter-spacing:-.01em;
}

/* --- Leaderboard Rows --- */
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:rgba(0,0,0,.26);
  border:1px solid rgba(255,255,255,.12);
  border-radius:13px;
  padding:11px 18px;
  margin:8px 0;
  font-size:1.3em;
  font-weight:800;
  transition:transform .15s;
}
.row.top1{
  background:linear-gradient(90deg,rgba(255,215,0,.34),rgba(255,255,255,.12));
  border-color:rgba(255,223,93,.65);
  box-shadow:0 4px 18px rgba(255,215,0,.18);
}
.row.top2{
  background:linear-gradient(90deg,rgba(224,224,224,.24),rgba(255,255,255,.09));
  border-color:rgba(224,224,224,.45);
}
.row.top3{
  background:linear-gradient(90deg,rgba(205,127,50,.28),rgba(255,255,255,.09));
  border-color:rgba(255,171,145,.45);
}
.row-left{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.row .rk{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:1.9em;
  height:1.9em;
  border-radius:9px;
  background:rgba(255,255,255,.12);
  font-weight:900;
  font-size:.9em;
  color:var(--gold);
}
.row.top1 .rk{background:var(--gold);color:var(--ink)}
.av-wrap{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:1.78em;
  height:1.78em;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  flex-shrink:0;
  vertical-align:middle;
  margin-right:3px;
}
.av-wrap.ringed{
  border:2.5px solid var(--rc,#ffd54f);
  box-shadow:0 0 12px var(--rc,#ffd54f);
}
.av-wrap.rainbow{
  border:2.5px solid #ffdf5d;
  box-shadow:0 0 12px #ff6eb4,0 0 20px #40c4ff;
}
.av-hat{
  position:absolute;
  top:-.5em;
  right:-.22em;
  font-size:.66em;
  line-height:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.65));
  pointer-events:none;
}
.sc-grp{display:inline-flex;align-items:center;gap:8px;flex-shrink:0}
.pct-sub{
  font-size:.76em;
  font-weight:850;
  color:#b9f6ca;
  background:rgba(105,240,174,.14);
  border:1px solid rgba(105,240,174,.35);
  padding:3px 10px;
  border-radius:99px;
  white-space:nowrap;
}
.row b.sc{
  font-size:1.14em;
  color:var(--gold);
  background:rgba(0,0,0,.28);
  padding:3px 12px;
  border-radius:99px;
  white-space:nowrap;
}
.ttl{
  font-size:.62em;
  background:rgba(255,255,255,.18);
  color:var(--gold);
  padding:3px 9px;
  border-radius:99px;
  font-weight:800;
}
.fire{animation:fl .6s infinite alternate}
@keyframes fl{from{filter:brightness(1)}to{filter:brightness(1.55) drop-shadow(0 0 6px #ff9800)}}

/* --- Word Cloud Stage --- */
.cloud{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  justify-content:center;
  align-items:center;
  align-content:center;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  padding:26px;
  min-height:310px;
}
.tag{
  padding:8px 18px;
  border-radius:99px;
  font-weight:850;
  box-shadow:0 5px 14px rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.22);
  line-height:1.2;
}

/* --- Lobby & Empty States --- */
.center{
  text-align:center;
  padding:52px 24px;
  font-size:1.45em;
}
.lobby-qr{
  width:150px;
  height:150px;
  border-radius:16px;
  background:#fff;
  padding:8px;
  margin:14px auto;
  display:block;
  box-shadow:0 8px 26px rgba(0,0,0,.35);
}
.names{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:18px;
}
.names span{
  display:inline-flex;
  align-items:center;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.24);
  border-radius:99px;
  padding:8px 16px;
  font-size:.82em;
  font-weight:800;
}
</style></head><body>

<header>
  <div class="brand-grp">
    <span class="brand-logo">🧠 Brainrush!</span>
    <span class="live-dot" id="phaseBadge">LIVE STANDINGS</span>
  </div>
  <div class="hd-right">
    <div id="hd"></div>
    <button id="a11y" class="util-btn" onclick="cycleA11y()" title="Colorblind / High-contrast">👁️</button>
    <button id="awakeBtn" class="util-btn" onclick="toggleAwake()" title="Keep display awake">☀️ <span id="awakeState">ON</span></button>
  </div>
</header>

<main id="m"><div class="panel-card center">📡 Looking for a live Brainrush session…</div></main>

<script>
const q = new URLSearchParams(location.search), mode = q.get('mode') || 'both';
let pin = q.get('pin') || '', lastKey = '';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function applyA11y(){
  let a = 'off';
  try{ a = localStorage.getItem('brainrush_a11y') || 'off'; }catch(e){}
  document.body.classList.toggle('cb', a === 'cb');
  document.body.classList.toggle('hc', a === 'hc');
  const b = document.getElementById('a11y');
  if(b) b.textContent = a === 'cb' ? '👁️ CB' : a === 'hc' ? '👁️ HC' : '👁️';
}
function cycleA11y(){
  const o = ['off','cb','hc'];
  let a = 'off';
  try{ a = localStorage.getItem('brainrush_a11y') || 'off'; }catch(e){}
  const nx = o[(o.indexOf(a) + 1) % 3];
  try{ localStorage.setItem('brainrush_a11y', nx); }catch(e){}
  applyA11y();
}
applyA11y();

const cols = ['#e21b3c','#1368ce','#d89e00','#26890c','#8e24aa','#00897b'];
const cbCols = ['#D55E00','#0072B2','#CC79A7','#009E73','#56B4E9','#E69F00'];

const RING_MAP = {gold:'#ffd54f', neon:'#7dff6b', ice:'#40c4ff', fire:'#ff6d00', violet:'#b388ff', pink:'#ff6eb4', ruby:'#ff5252'};
function avHtml(r){
  if(!r.avatar && !r.av_hat && !r.av_ring) return '';
  const rawRing = String(r.av_ring || '');
  const isRainbow = rawRing === 'rainbow';
  const rc = rawRing.startsWith('#') ? rawRing : (RING_MAP[rawRing] || '');
  const cls = isRainbow ? 'av-wrap rainbow' : (rc ? 'av-wrap ringed' : 'av-wrap');
  const st = rc ? ` style="--rc:${esc(rc)}"` : '';
  return `<span class="${cls}"${st}><span>${esc(r.avatar || '🎮')}</span>${r.av_hat ? `<span class="av-hat">${esc(r.av_hat)}</span>` : ''}</span>`;
}

function board(S){
  if(S.hide_board && S.phase !== 'final'){
    return `<div class="center" style="font-size:1.2em;padding:42px 18px">
      <div style="font-size:2.2em;line-height:1;margin-bottom:8px">🙈</div>
      <div style="font-weight:900">🙈 Live Standings Hidden Until Final Podium</div>
      <div style="font-size:.78em;opacity:.82;margin-top:8px">Focus on every question — full standings reveal at the end!</div>
    </div>`;
  }
  if(!S.board || !S.board.length){
    return `<div class="center" style="font-size:1.15em;opacity:.82;padding:36px 16px">⏳ Standings appear right after Question 1!</div>`;
  }
  const medals = {1:'🥇', 2:'🥈', 3:'🥉'};
  const isPctMode = S.scoring_mode === 'percent';
  const isSurvey = S.scoring_mode === 'survey';
  return S.board.map(r => {
    const topCls = r.rank === 1 ? 'top1' : r.rank === 2 ? 'top2' : r.rank === 3 ? 'top3' : '';
    const rkLbl = medals[r.rank] || r.rank;
    const colStyle = r.color ? ` style="color:${esc(r.color)};text-shadow:0 1px 3px rgba(0,0,0,.6)"` : '';
    const hasPct = (r.graded_n || 0) > 0 || isPctMode;
    let scHtml;
    if(isPctMode){
      scHtml = `<span class="sc-grp">${r.score ? `<span class="pct-sub">${r.score} pts</span>` : ''}<b class="sc">${r.pct ?? 0}%</b></span>`;
    } else if(isSurvey){
      scHtml = `<span class="sc-grp"><span class="pct-sub">📋 Survey</span></span>`;
    } else {
      scHtml = `<span class="sc-grp">${hasPct ? `<span class="pct-sub">${r.pct ?? 0}%</span>` : ''}<b class="sc">${r.score}</b></span>`;
    }
    return `<div class="row ${topCls}">
      <span class="row-left">
        <span class="rk">${rkLbl}</span>
        ${avHtml(r)}
        <span>${esc(r.team_emoji ? r.team_emoji + ' ' : '')}<span${colStyle}>${esc(r.name)}</span></span>
        ${r.ctag ? `<span class="ttl">${esc(r.ctag)}</span>` : ''}
        ${r.title ? `<span class="ttl">${esc(r.title)}</span>` : ''}
        ${r.streak >= 5 ? '<span class="fire">🔥🔥</span>' : r.streak >= 2 ? `<span class="fire">🔥${r.streak}</span>` : ''}
      </span>
      ${scHtml}
    </div>`;
  }).join('');
}

function cloud(S){
  const w = S.words || [];
  const palette = document.body.classList.contains('cb') ? cbCols : cols;
  return `<div class="cloud">${w.length
    ? w.map((x, i) => `<span class="tag" style="font-size:${Math.min(2.6, 1.08 + (x.count - 1) * .38)}em;background:${palette[i % palette.length]}">${esc(x.text)}${x.count > 1 ? ` <small style="opacity:.88">(${x.count})</small>` : ''}</span>`).join('')
    : '<span style="opacity:.72;font-size:1.22em;font-weight:700">💭 Waiting for responses…</span>'
  }</div>`;
}

function render(S){
  const joinUrl = `${location.host || 'plw.me'}/play`;
  const joinFull = `${location.origin && location.origin !== 'null' ? location.origin : 'https://plw.me'}/play?pin=${encodeURIComponent(S.pin)}`;
  const qrSrc = `/api/qr?text=${encodeURIComponent(joinFull)}`;

  const pb = document.getElementById('phaseBadge');
  if(pb){
    const phMap = {lobby:'🟢 Lobby Open', icebreaker:'💭 Warm-Up', intro:'🎬 Round Intro', question:'⚡ Live Question', results:'📊 Round Results', board:'🏆 Leaderboard', final:'🏁 Final Podium'};
    pb.textContent = phMap[S.phase] || 'LIVE';
  }

  document.getElementById('hd').innerHTML = `
    <span class="join-banner">
      <img class="mini-qr" src="${qrSrc}" alt="" onerror="this.style.display='none'">
      <span>Join: <b>${esc(joinUrl)}</b></span>
      <span class="pin-badge">PIN ${esc(S.pin)}</span>
    </span>
    <span class="pill subtle">👥 ${S.n} player${S.n === 1 ? '' : 's'}</span>
    ${S.scoring_mode === 'percent' ? `<span class="pill subtle">📊 % Grade</span>` : ''}
    ${S.index >= 0 && S.phase !== 'final' ? `<span class="pill">Q ${S.index + 1}/${S.total}</span>` : ''}
  `;

  const m = document.getElementById('m');
  m.className = (mode === 'both' && S.words && S.word_total > 0 && S.phase !== 'final') ? 'both' : '';

  if(S.phase === 'lobby'){
    m.innerHTML = `
      <div class="panel-card center">
        <img class="lobby-qr" src="${qrSrc}" alt="" onerror="this.style.display='none'">
        <div style="font-weight:900;font-size:1.25em">Scan or visit <span style="color:var(--gold)">${esc(joinUrl)}</span> &middot; PIN <span style="color:var(--gold)">${esc(S.pin)}</span></div>
        <div style="opacity:.82;font-size:.82em;margin-top:6px">${S.n ? `${S.n} player${S.n === 1 ? '' : 's'} ready — waiting for host to launch!` : 'Waiting for first player to join…'}</div>
        <div class="names">${(S.names || []).map(n => `<span>🎮 ${esc(n)}</span>`).join('')}</div>
      </div>`;
    return;
  }

  if(S.phase === 'icebreaker'){
    m.innerHTML = `
      <div class="panel-card">
        <div class="panel-head"><h2>💭 ${esc(S.prompt || 'Warm-Up Word Cloud')}</h2><span class="pill subtle">${S.word_total || 0} words</span></div>
        ${cloud(S)}
      </div>`;
    return;
  }

  const showCloud = (mode === 'cloud') || (mode === 'both' && S.word_total > 0 && S.phase !== 'final');
  const showBoard = (mode === 'board') || mode === 'both';
  const boardTitle = S.phase === 'final' ? '🏆 Final Podium & Standings' : S.phase === 'question' ? '🏆 Live Standings' : '🏆 Leaderboard';
  const boardBadge = (S.hide_board && S.phase !== 'final') ? '🙈 Hidden' : `Top ${(S.board || []).length}`;

  m.innerHTML =
    (showBoard ? `<div class="panel-card"><div class="panel-head"><h2>${boardTitle}</h2><span class="pill subtle">${boardBadge}</span></div>${board(S)}</div>` : '') +
    (showCloud ? `<div class="panel-card"><div class="panel-head"><h2>💭 ${esc(S.prompt || 'Word Cloud')}</h2><span class="pill subtle">${S.word_total || 0} words</span></div>${cloud(S)}</div>` : '');
}

async function poll(){
  try{
    const r = await fetch('/api/spectator' + (pin ? '?pin=' + encodeURIComponent(pin) : ''));
    if(!r.ok){
      if(lastKey !== 'none'){
        lastKey = 'none';
        document.getElementById('hd').innerHTML = '';
        document.getElementById('m').className = '';
        document.getElementById('m').innerHTML = '<div class="panel-card center">📡 Looking for a live Brainrush session…</div>';
      }
      return;
    }
    const S = await r.json();
    pin = S.pin;
    const k = JSON.stringify(S);
    if(k !== lastKey){ lastKey = k; render(S); }
  }catch(e){}
}
poll();
setInterval(poll, 1200);

// ===== Keep screen awake (Screen Wake Lock API) =====
let wakeLock = null;
function setAwakeLabel(txt){
 const el = document.getElementById('awakeState'), b = document.getElementById('awakeBtn');
 const off = localStorage.getItem('brainrush_awake') === '0';
 if(el) el.textContent = txt || (off ? 'Off' : 'ON');
 if(b) b.classList.toggle('on', !off);
}
async function acquireWake(){
 if(localStorage.getItem('brainrush_awake') === '0') return;
 if(!('wakeLock' in navigator)){ setAwakeLabel('N/A'); return; }
 if(wakeLock || document.visibilityState !== 'visible') return;
 try{
  wakeLock = await navigator.wakeLock.request('screen');
  wakeLock.addEventListener('release', ()=>{ wakeLock = null; setAwakeLabel(); });
  setAwakeLabel();
 }catch(e){ wakeLock = null; setAwakeLabel(); }
}
function toggleAwake(){
 const on = localStorage.getItem('brainrush_awake') !== '0';
 localStorage.setItem('brainrush_awake', on ? '0' : '1');
 if(on){ if(wakeLock){ wakeLock.release(); wakeLock = null; } } else acquireWake();
 setAwakeLabel();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') acquireWake(); });
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev, ()=>{ if(!wakeLock) acquireWake(); }, {passive:true}));
acquireWake();
</script></body></html>
