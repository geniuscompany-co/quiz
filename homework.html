<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brainrush! — Homework</title>
<style>
:root{
  --bg1:#6827d6;
  --bg2:#46178f;
  --bg3:#23094d;
  --surface:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.20);
  --gold:#ffdf5d;
  --green:#26890c;
  --ink:#2b0d57;
  --radius:16px;
  --radius-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100vh;min-height:100dvh}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at 50% -12%,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%) fixed;
  color:#fff;
  text-align:center;
  display:flex;
  flex-direction:column;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
body.hc{background:#000!important}
body.hc .card-panel,body.hc .q-card{background:#111;border:2px solid #fff}

/* --- Sticky Top HUD --- */
#topHud{
  position:sticky;
  top:0;
  z-index:55;
  width:100%;
  background:rgba(22,7,50,.80);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.14);
}
.hud-inner{
  max-width:560px;
  margin:0 auto;
  padding:7px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:46px;
}
.hud-left,.hud-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hud-btn{
  padding:5px 10px;
  font-size:.82em;
  font-weight:800;
  border-radius:99px;
  border:1px solid rgba(255,255,255,.26);
  background:rgba(255,255,255,.12);
  color:#fff;
  cursor:pointer;
  line-height:1.2;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.hud-btn:active{transform:scale(.95)}
.hud-pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.16);
  border-radius:99px;
  padding:4px 11px;
  font-size:.82em;
  font-weight:800;
  max-width:240px;
}
.hud-pill .hp-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-pill .hp-score{color:var(--gold);white-space:nowrap}

.prog-wrap{
  max-width:560px;
  width:100%;
  margin:0 auto;
  padding:0 12px 7px;
  display:none;
  align-items:center;
  gap:8px;
}
.bar{
  flex:1;
  height:7px;
  background:rgba(255,255,255,.18);
  border-radius:99px;
  overflow:hidden;
}
.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#69f0ae,#ffdf5d);
  border-radius:99px;
  transition:width .3s ease;
}
.prog-lbl{
  font-size:.76em;
  font-weight:900;
  color:var(--gold);
  white-space:nowrap;
}

/* --- Main Stage --- */
#app{
  flex:1;
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
}

.card-panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 16px;
  box-shadow:0 10px 28px rgba(0,0,0,.25);
  backdrop-filter:blur(6px);
}
.logo{
  max-width:185px;
  max-height:82px;
  width:auto;
  border-radius:14px;
  margin:0 auto 8px;
  display:block;
  box-shadow:0 6px 18px rgba(0,0,0,.32);
  object-fit:contain;
}
h1{font-size:1.45em;font-weight:900;margin:.18em 0;letter-spacing:-.01em}

.meta-row{
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
  margin:8px 0 12px;
}
.meta-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.18);
  border-radius:99px;
  padding:4px 11px;
  font-size:.84em;
  font-weight:800;
}
.meta-pill.due{color:var(--gold)}
.meta-pill.closed{background:rgba(226,27,60,.32);border-color:rgba(255,138,128,.55);color:#ffcdd2}

.field-lbl{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:.76em;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  opacity:.85;
  margin:8px 2px 4px;
}
select,input[type=text]{
  display:block;
  width:100%;
  box-sizing:border-box;
  font-size:1.15em;
  padding:12px 14px;
  margin:0 0 8px;
  border-radius:var(--radius-sm);
  border:2px solid transparent;
  text-align:center;
  color:var(--ink);
  font-weight:800;
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
  font-family:inherit;
}
select:focus,input:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,223,93,.35);
}
input::placeholder{font-weight:650;opacity:.52}

button.go{
  width:100%;
  font-size:1.22em;
  padding:14px 18px;
  border:0;
  border-radius:13px;
  background:linear-gradient(180deg,#2fa80f,#217a0a);
  color:#fff;
  font-weight:900;
  cursor:pointer;
  margin-top:6px;
  box-shadow:0 5px 0 #145205,0 8px 20px rgba(0,0,0,.28);
  transition:transform .08s,filter .15s;
}
button.go:hover{filter:brightness(1.05)}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #145205,0 4px 10px rgba(0,0,0,.24)}
button.go:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
button.sec{
  background:rgba(255,255,255,.14);
  color:#fff;
  border:1px solid rgba(255,255,255,.24);
  border-radius:11px;
  padding:10px 16px;
  font-size:.95em;
  font-weight:800;
  cursor:pointer;
  margin:6px 4px 0;
}

.err{
  background:rgba(226,27,60,.24);
  border:1px solid rgba(255,138,128,.5);
  color:#ffcdd2;
  border-radius:10px;
  padding:8px 12px;
  font-weight:800;
  font-size:.9em;
  margin:8px 0 4px;
}
.save-note{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  background:rgba(0,0,0,.22);
  border-radius:11px;
  padding:9px 12px;
  margin-top:12px;
  font-size:.84em;
  line-height:1.38;
  opacity:.88;
}

/* --- Question Card & Tactile 2x2 Grid --- */
.q-card{
  background:rgba(20,6,46,.52);
  border:1px solid rgba(255,255,255,.18);
  border-radius:15px;
  padding:13px 14px;
  margin-bottom:10px;
  box-shadow:0 6px 20px rgba(0,0,0,.22);
}
.qnum{
  display:inline-block;
  background:#fff;
  color:#46178f;
  font-weight:900;
  font-size:.8em;
  padding:3px 12px;
  border-radius:99px;
  margin-bottom:6px;
}
.q{
  font-size:clamp(1.08rem,3.8vw,1.35rem);
  font-weight:850;
  line-height:1.32;
  margin:2px 0;
}
.q-img{
  max-height:200px;
  max-width:100%;
  border-radius:11px;
  margin:8px auto 2px;
  display:block;
  background:#fff;
  object-fit:contain;
  cursor:zoom-in;
  box-shadow:0 4px 12px rgba(0,0,0,.28);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:2px;
}
.grid button{
  min-height:122px;
  padding:12px 10px;
  border:0;
  border-radius:14px;
  color:#fff;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:850;
  font-size:1.05em;
  line-height:1.22;
  word-break:break-word;
  transition:transform .08s,opacity .2s,box-shadow .2s;
  text-shadow:0 1px 2px rgba(0,0,0,.28);
}
.grid button:active:not(:disabled){transform:translateY(3px)}
.grid button .sh{
  font-size:1.45em;
  line-height:1;
  background:rgba(0,0,0,.18);
  width:34px;
  height:34px;
  border-radius:9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.grid button img{max-height:84px;max-width:100%;border-radius:8px;background:#fff}

.c0{background:linear-gradient(180deg,#ef2346,#d01637);box-shadow:0 5px 0 #940d24,0 6px 14px rgba(0,0,0,.24)}
.c1{background:linear-gradient(180deg,#1b75e0,#115bb5);box-shadow:0 5px 0 #0a3c7a,0 6px 14px rgba(0,0,0,.24)}
.c2{background:linear-gradient(180deg,#e5a900,#c68f00);box-shadow:0 5px 0 #8c6400,0 6px 14px rgba(0,0,0,.24)}
.c3{background:linear-gradient(180deg,#2d9e0f,#217c09);box-shadow:0 5px 0 #145004,0 6px 14px rgba(0,0,0,.24)}
.c4{background:linear-gradient(180deg,#8e24aa,#6a1b9a);box-shadow:0 5px 0 #4a148c,0 6px 14px rgba(0,0,0,.24)}
.c5{background:linear-gradient(180deg,#00897b,#00695c);box-shadow:0 5px 0 #004d40,0 6px 14px rgba(0,0,0,.24)}

body.cb .c0{background:#D55E00;box-shadow:0 5px 0 #8f3e00}
body.cb .c1{background:#0072B2;box-shadow:0 5px 0 #004973}
body.cb .c2{background:#F0E442;color:#1b1b1b!important;text-shadow:none;box-shadow:0 5px 0 #a89e14}
body.cb .c2 .sh{background:rgba(0,0,0,.12)}
body.cb .c3{background:#009E73;box-shadow:0 5px 0 #00664a}
body.cb .c4{background:#CC79A7;box-shadow:0 5px 0 #8a4b6e}
body.cb .c5{background:#56B4E9;color:#1b1b1b!important;text-shadow:none;box-shadow:0 5px 0 #2e7aa6}
body.hc .grid button{border:3px solid #fff}

.grid button.right{
  outline:4px solid #fff;
  box-shadow:0 0 0 3px #69f0ae,0 0 24px rgba(105,240,174,.75)!important;
  transform:scale(1.02);
}
.grid button.picked:not(.right){outline:3px solid rgba(255,255,255,.85)}
.grid button.dim{opacity:.28;filter:grayscale(.25)}
.grid button.msel{outline:3.5px solid var(--gold);transform:translateY(-2px);box-shadow:0 0 16px rgba(255,223,93,.55)!important}

.q-top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.q-top-row .qnum{margin-bottom:0}
.tts-btn{
  padding:4px 11px;
  border-radius:99px;
  border:1px solid rgba(255,255,255,.32);
  background:rgba(255,255,255,.14);
  color:#fff;
  font-size:.78em;
  font-weight:850;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.tts-btn.on{background:var(--gold);color:var(--ink);border-color:#fff}
.q-img.zoom-go{animation:zoomrev 14s linear forwards}
@keyframes zoomrev{from{filter:blur(24px)}to{filter:blur(0)}}

/* --- Match Tap-to-Pair --- */
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px;text-align:left}
.match-col{display:flex;flex-direction:column;gap:7px}
.match-hdr{font-size:.75em;font-weight:900;text-transform:uppercase;letter-spacing:.06em;opacity:.82;text-align:center}
.m-item{
  padding:10px 11px;
  border-radius:11px;
  border:2px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.12);
  color:#fff;
  font-weight:800;
  font-size:.92em;
  line-height:1.25;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  text-align:left;
  word-break:break-word;
}
.m-item.active{border-color:var(--gold);background:rgba(255,223,93,.22);box-shadow:0 0 12px rgba(255,223,93,.4)}
.m-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:24px;padding:0 6px;border-radius:99px;
  font-size:.78em;font-weight:900;color:#fff;flex-shrink:0;
}
.pc0{background:#e21b3c}.pc1{background:#1368ce}.pc2{background:#d89e00}.pc3{background:#26890c}.pc4{background:#8e24aa}.pc5{background:#00897b}

/* --- Slider & Pin --- */
.slider-box{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:16px 14px;margin-bottom:8px}
.slider-val{font-size:2em;font-weight:900;color:var(--gold);margin-bottom:8px}
.slider-box input[type=range]{width:100%;accent-color:var(--gold);height:8px;cursor:pointer;margin:6px 0}
.slider-ends{display:flex;justify-content:space-between;font-size:.8em;opacity:.8;font-weight:800;margin-bottom:10px}
.slider-num{width:130px!important;display:inline-block!important;padding:8px 10px!important;font-size:1.05em!important;margin:0!important;border-radius:9px!important;border:2px solid transparent;text-align:center;font-weight:850;color:var(--ink);background:#fff}

.pin-wrap{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px;margin-bottom:8px}
.pin-stage{position:relative;display:inline-block;max-width:100%;border-radius:10px;overflow:hidden;cursor:crosshair;line-height:0;background:#fff;touch-action:manipulation}
.pin-stage img{display:block;max-width:100%;max-height:300px;width:auto;height:auto;user-select:none;-webkit-user-drag:none}
.pin-marker{
  position:absolute;width:26px;height:26px;border-radius:50%;
  border:3px solid #fff;background:rgba(226,27,60,.9);
  box-shadow:0 0 0 2px #000,0 3px 10px rgba(0,0,0,.55);
  transform:translate(-50%,-50%);pointer-events:none;z-index:3;
}
.pin-marker::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
.pin-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* --- Order Slots --- */
.slot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.26);
  border-radius:10px;
  padding:8px 12px;
  margin:4px 0;
  font-weight:800;
  text-align:left;
  cursor:pointer;
}
.slot b{color:var(--gold);margin-right:6px}

/* --- Feedback & Summary --- */
.fb{
  margin-top:12px;
  padding:13px 15px;
  border-radius:13px;
  font-weight:850;
  font-size:1.14em;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.fb.ok{background:linear-gradient(135deg,#2e9e10,#1e7308);border:1px solid rgba(105,240,174,.5)}
.fb.partial{background:linear-gradient(135deg,#f57c00,#e65100);border:1px solid rgba(255,223,93,.6)}
.fb.no{background:linear-gradient(135deg,#d32f2f,#9a1b1b);border:1px solid rgba(255,138,128,.45)}
blockquote{
  background:#fff;
  color:var(--ink);
  border-left:5px solid var(--gold);
  border-radius:11px;
  padding:11px 14px;
  margin:10px 0 4px;
  font-style:italic;
  text-align:left;
  font-weight:600;
  line-height:1.4;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}
.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:14px 0;
}
.stat{
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  padding:12px 10px;
  font-weight:750;
  font-size:.9em;
}
.stat b{
  display:block;
  font-size:1.55em;
  font-weight:900;
  color:var(--gold);
  margin-bottom:2px;
}
.plink{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:12px;
  padding:8px 16px;
  border-radius:99px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);
  color:#fff;
  text-decoration:none;
  font-size:.9em;
  font-weight:800;
}

#imgOv{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:90;
  align-items:center;
  justify-content:center;
  padding:16px;
}
#imgOv img{max-width:96vw;max-height:90vh;border-radius:12px;background:#fff}
#fx{position:fixed;inset:0;pointer-events:none;z-index:85}
</style></head><body>

<div id="topHud">
  <div class="hud-inner">
    <div class="hud-left">
      <button id="sfxBtn" class="hud-btn" onclick="toggleSfx()" title="Sound effects">🔊</button>
      <button id="a11y" class="hud-btn" onclick="cycleA11y()" title="Colorblind / High-contrast">👁️</button>
    </div>
    <div class="hud-right" id="hudMe">
      <span class="hud-pill">📚 Homework</span>
    </div>
  </div>
  <div class="prog-wrap" id="progWrap">
    <div class="bar"><i id="progFill" style="width:0%"></i></div>
    <span class="prog-lbl" id="progLbl">0%</span>
  </div>
</div>

<div id="app"></div>
<div id="imgOv" onclick="this.style.display='none'"><img id="imgBig" alt=""></div>
<canvas id="fx"></canvas>

<script>
const $ = document.getElementById('app'), sh = ["▲","◆","●","■","★","⬟"];
const hid = new URLSearchParams(location.search).get('id') || '';
let info = null, me = null, cur = null, sel = [], multiSel = [], matchSelLeft = 0, matchMap = [], sliderVal = 50, pinXY = null, busy = false, answeredDone = false;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function zoomImg(src){ document.getElementById('imgBig').src = src; document.getElementById('imgOv').style.display = 'flex'; }
async function post(u,b){
  const r = await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
  let d = {};
  try{ d = await r.json(); }catch(e){}
  return {_httpOk: r.ok, ok: r.ok, ...d};
}

function stopSpeech(){
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  const b = document.getElementById('ttsBtn');
  if(b){ b.classList.remove('on'); b.textContent = '🔊 Read Aloud'; }
}
function readAloud(){
  if(!cur || !window.speechSynthesis) return;
  if(window.speechSynthesis.speaking){ stopSpeech(); return; }
  const t = cur.qtype || cur.type || 'mc';
  let txt = cur.q || '';
  if((t === 'mc' || t === 'tf' || t === 'multi' || t === 'order') && cur.a && cur.a.length){
    txt += '. Options: ' + cur.a.join(', ');
  } else if(t === 'match' && cur.match_left && cur.match_right){
    txt += '. Match: ' + cur.match_left.join(', ') + ' with ' + cur.match_right.join(', ');
  } else if(t === 'slider' && cur.slider_cfg){
    txt += `. Choose a value from ${cur.slider_cfg.min} to ${cur.slider_cfg.max}${cur.slider_cfg.unit ? ' ' + cur.slider_cfg.unit : ''}.`;
  }
  const u = new SpeechSynthesisUtterance(txt);
  const b = document.getElementById('ttsBtn');
  if(b){ b.classList.add('on'); b.textContent = '⏹️ Stop'; }
  u.onend = u.onerror = () => stopSpeech();
  window.speechSynthesis.speak(u);
}

/* --- Accessibility & Sound --- */
function applyA11y(){
  let a = 'off';
  try{ a = localStorage.getItem('brainrush_a11y') || 'off'; }catch(e){}
  document.body.classList.toggle('cb', a === 'cb');
  document.body.classList.toggle('hc', a === 'hc');
  const b = document.getElementById('a11y');
  if(b) b.textContent = a === 'cb' ? '👁️ CB' : a === 'hc' ? '👁️ HC' : '👁️';
}
function cycleA11y(){
  const o = ['off','cb','hc'];
  let a = 'off';
  try{ a = localStorage.getItem('brainrush_a11y') || 'off'; }catch(e){}
  const nx = o[(o.indexOf(a) + 1) % 3];
  try{ localStorage.setItem('brainrush_a11y', nx); }catch(e){}
  applyA11y();
}
applyA11y();

let ac = null, sfxOn = true;
try{ sfxOn = localStorage.getItem('brainrush_sfx') !== '0'; }catch(e){}
function unlockAudio(){
  try{
    if(!ac){ const C = window.AudioContext || window.webkitAudioContext; if(C) ac = new C(); }
    if(ac && ac.state === 'suspended') ac.resume();
  }catch(e){}
}
window.addEventListener('pointerdown', unlockAudio, {passive:true});
function beep(f, d, type, v, delay){
  if(!sfxOn || !ac) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(v || .22, t + .015);
  g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
function sfxCorrect(){ [523.25,659.25,783.99].forEach((f,i)=>beep(f,.15,'triangle',.25,i*.08)); }
function sfxWrong(){ beep(196,.24,'sawtooth',.16,0); beep(147,.3,'sawtooth',.16,.11); }
function updSfx(){ const b = document.getElementById('sfxBtn'); if(b) b.textContent = sfxOn ? '🔊' : '🔇'; }
function toggleSfx(){
  sfxOn = !sfxOn;
  try{ localStorage.setItem('brainrush_sfx', sfxOn ? '1' : '0'); }catch(e){}
  updSfx();
  if(sfxOn){ unlockAudio(); sfxCorrect(); }
}
updSfx();

function confettiBurst(){
  const c = document.getElementById('fx'); c.width = innerWidth; c.height = innerHeight;
  const ctx = c.getContext('2d'), cols = ['#ff2e63','#08d9d6','#ffde7d','#7dff6b','#fff','#ff9800'];
  const ps = Array.from({length:75}, ()=>({x:innerWidth/2, y:innerHeight*.28, vx:(Math.random()-.5)*11, vy:-4-Math.random()*8, s:5+Math.random()*6, col:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, va:(Math.random()-.5)*.3}));
  const t0 = performance.now();
  (function loop(now){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.vy += .34; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
    if(now - t0 < 1700) requestAnimationFrame(loop); else ctx.clearRect(0,0,c.width,c.height);
  })(t0);
}

function syncHud(qIdx, qTot){
  const hm = document.getElementById('hudMe');
  const pw = document.getElementById('progWrap');
  const pf = document.getElementById('progFill');
  const pl = document.getElementById('progLbl');
  if(me && me.name){
    const ansCnt = me.answered || 0;
    const pctTxt = ansCnt > 0 ? ` · ${Math.round(100 * (me.correct || 0) / ansCnt)}%` : '';
    hm.innerHTML = `<span class="hud-pill"><span class="hp-name">👤 ${esc(me.name)}</span><span class="hp-score">⭐ ${me.score || 0}${pctTxt}</span></span>`;
  } else {
    hm.innerHTML = `<span class="hud-pill">📚 Homework</span>`;
  }
  if(qIdx != null && qTot > 0){
    pw.style.display = 'flex';
    const pct = Math.min(100, Math.round(qIdx / qTot * 100));
    pf.style.width = pct + '%';
    pl.textContent = `Q ${Math.min(qIdx + 1, qTot)}/${qTot}`;
  } else {
    pw.style.display = 'none';
  }
}

async function init(){
  const r = await fetch('/api/hw_info?id=' + encodeURIComponent(hid));
  if(!r.ok){
    $.innerHTML = `
      <div class="card-panel" style="margin-top:16px">
        <div style="font-size:2.8em">😕</div>
        <h1>Assignment Not Found</h1>
        <p style="opacity:.85;line-height:1.4">Double-check the homework link your instructor shared with you.</p>
        <a class="plink" href="/play">🎮 Go to Live Game</a>
      </div>`;
    return;
  }
  info = await r.json();
  const saved = localStorage.getItem('hw_name_' + hid);
  if(saved) return begin(saved);
  welcome();
}

function welcome(err){
  syncHud(null, 0);
  const dl = info.deadline ? new Date(info.deadline * 1000).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '';
  $.innerHTML = `
    <div class="card-panel">
      <img class="logo" src="/logo.jpg" alt="" onerror="this.style.display='none'">
      <h1>📚 ${esc(info.title)}</h1>
      <div class="meta-row">
        <span class="meta-pill">📝 ${info.n} Question${info.n === 1 ? '' : 's'}</span>
        ${dl ? `<span class="meta-pill due">⏰ Due ${esc(dl)}</span>` : ''}
        ${!info.open ? `<span class="meta-pill closed">🔒 Assignment Closed</span>` : ''}
      </div>

      <div class="field-lbl"><span>${info.roster.length ? 'Select Your Name' : 'Your Name'}</span></div>
      ${info.roster.length
        ? `<select id="nm"><option value="">— Pick your name —</option>${info.roster.map(x => `<option>${esc(x)}</option>`).join('')}</select>`
        : `<input type="text" id="nm" placeholder="Enter your full name…" maxlength="24" onkeydown="if(event.key==='Enter')begin(this.value)">`
      }
      ${err ? `<div class="err">${esc(err)}</div>` : ''}
      <button class="go" onclick="begin(document.getElementById('nm').value)">▶️ Start Assignment</button>

      <div class="save-note">
        <span>💾</span>
        <span>Progress auto-saves after every question — you can close this tab anytime and resume later.</span>
      </div>
    </div>
  `;
}

async function begin(name){
  const r = await post('/api/hw_start', {id: hid, name});
  if(!r._httpOk){
    localStorage.removeItem('hw_name_' + hid);
    return welcome(r.error);
  }
  me = r;
  localStorage.setItem('hw_name_' + hid, r.name);
  if(r.done) return finish(r);
  cur = r.question;
  show();
}

function show(){
  stopSpeech();
  sel = [];
  multiSel = [];
  answeredDone = false;
  pinXY = null;
  const q = cur, t = q.qtype || q.type || 'mc';
  syncHud(q.i, q.n);

  if(t === 'match'){
    const n = (q.match_left || []).length;
    matchMap = Array(n).fill(-1);
    matchSelLeft = 0;
  } else if(t === 'slider'){
    const sc = q.slider_cfg || {min: 0, max: 100, step: 1, unit: ''};
    const mid = (sc.min + sc.max) / 2;
    const st = sc.step || 1;
    sliderVal = Number((Math.round((mid - sc.min) / st) * st + sc.min).toFixed(4));
  }

  let body = '';
  if(t === 'text'){
    body = `<div class="card-panel" style="padding:14px"><input type="text" id="txt" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')submitText()"><button class="go" id="subBtn" onclick="submitText()">✅ Submit Answer</button></div>`;
  } else if(t === 'order'){
    body = `<div style="font-size:.9em;opacity:.86;margin:2px 0 8px;font-weight:750">Tap items in the correct sequence (tap a placed slot to remove):</div><div id="ord"></div>`;
  } else if(t === 'multi'){
    body = `<div style="font-size:.9em;opacity:.88;margin:2px 0 8px;font-weight:750">☑️ Select <b>all</b> correct options, then tap Submit:</div><div id="multiWrap"></div>`;
  } else if(t === 'match'){
    body = `<div style="font-size:.9em;opacity:.88;margin:2px 0 6px;font-weight:750">🔗 Tap a prompt on the left, then tap its match on the right:</div><div id="matchWrap"></div>`;
  } else if(t === 'slider'){
    const sc = q.slider_cfg || {min: 0, max: 100, step: 1, unit: ''};
    const u = sc.unit ? ' ' + esc(sc.unit) : '';
    body = `<div class="slider-box">
      <div class="slider-val"><span id="slDisp">${sliderVal}</span>${u}</div>
      <input type="range" id="slRange" min="${sc.min}" max="${sc.max}" step="${sc.step}" value="${sliderVal}" oninput="syncSlider(this.value)">
      <div class="slider-ends"><span>${sc.min}${u}</span><span>${sc.max}${u}</span></div>
      <div><input type="number" id="slNum" class="slider-num" min="${sc.min}" max="${sc.max}" step="${sc.step}" value="${sliderVal}" oninput="syncSlider(this.value)"></div>
      <button class="go" id="subBtn" style="margin-top:12px" onclick="submitSlider()">🎯 Lock In Estimate</button>
    </div>`;
  } else if(t === 'pin'){
    body = `<div class="pin-wrap">
      <div style="font-size:.88em;font-weight:800;margin-bottom:6px;opacity:.9" id="pinReadout">📍 Tap anywhere on the image to place your pin</div>
      <div class="pin-stage" id="pinStage" onclick="tapPin(event)">
        <img id="pinImg" src="${esc(q.img || '')}" alt="">
        <svg class="pin-svg" id="pinSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div class="pin-marker" id="pinMark" style="display:none"></div>
      </div>
      <button class="go" id="subBtn" style="margin-top:10px" disabled onclick="submitPin()">📍 Lock In Pin</button>
    </div>`;
  } else {
    body = `<div class="grid">${(q.a || []).map((a,i)=>`<button class="c${i%6}" onclick="pick(${i})">${q.aimg && q.aimg[i] ? `<img src="${esc(q.aimg[i])}" alt="">` : ''}<span class="sh">${sh[i]||''}</span><span>${esc(a)}</span></button>`).join('')}</div>`;
  }

  const showCardImg = q.img && t !== 'pin';
  const imgCls = t === 'zoom' ? 'q-img zoom-go' : 'q-img';
  $.innerHTML = `
    <div class="q-card">
      <div class="q-top-row">
        <span class="qnum">Question ${q.i+1} of ${q.n}</span>
        <button type="button" class="tts-btn" id="ttsBtn" onclick="readAloud()">🔊 Read Aloud</button>
      </div>
      <div class="q">${esc(q.q)}</div>
      ${showCardImg ? `<img class="${imgCls}" id="qMainImg" src="${esc(q.img)}" alt="" ${t === 'zoom' ? '' : 'onclick="zoomImg(this.src)"'}>` : ''}
    </div>
    ${body}
    <div id="fb"></div>
  `;
  if(t === 'order') drawOrd();
  if(t === 'multi') drawMulti();
  if(t === 'match') drawMatch();
  if(t === 'text'){ const e = document.getElementById('txt'); if(e) e.focus(); }
}

function drawMulti(){
  const el = document.getElementById('multiWrap');
  if(!el) return;
  const d = cur.a || [];
  const compact = d.length > 4 ? ' style="min-height:86px"' : '';
  el.innerHTML = `<div class="grid">${d.map((a, i) => {
    const on = multiSel.includes(i);
    return `<button class="c${i%6} ${on ? 'msel' : ''}"${compact} ${answeredDone ? 'disabled' : ''} onclick="toggleMulti(${i})">${cur.aimg && cur.aimg[i] ? `<img src="${esc(cur.aimg[i])}" alt="">` : ''}<span class="sh">${on ? '☑️' : '⬜'}</span><span>${esc(a)}</span></button>`;
  }).join('')}</div>` +
  (!answeredDone ? `<button class="go" id="subBtn" style="margin-top:10px" ${multiSel.length ? '' : 'disabled'} onclick="submitMulti()">✅ Submit Selection (${multiSel.length})</button>` : '');
}
function toggleMulti(i){
  if(busy || answeredDone) return;
  const k = multiSel.indexOf(i);
  if(k >= 0) multiSel.splice(k, 1); else multiSel.push(i);
  drawMulti();
}
function submitMulti(){
  if(!multiSel.length) return;
  send({choices: multiSel.slice().sort((a, b) => a - b)});
}

function drawMatch(){
  const el = document.getElementById('matchWrap');
  if(!el) return;
  const L = cur.match_left || [], R = cur.match_right || [];
  const rightOwner = Array(R.length).fill(-1);
  matchMap.forEach((ri, li) => { if(ri >= 0 && ri < R.length) rightOwner[ri] = li; });
  const allLinked = L.length > 0 && matchMap.every(v => v >= 0);
  el.innerHTML = `<div class="match-cols">
    <div class="match-col">
      <div class="match-hdr">Prompts</div>
      ${L.map((txt, li) => {
        const paired = matchMap[li] >= 0;
        const act = !answeredDone && matchSelLeft === li && !paired;
        return `<button type="button" class="m-item ${act ? 'active' : ''}" ${answeredDone ? 'disabled' : ''} onclick="tapMatchLeft(${li})"><span>${esc(txt)}</span>${paired ? `<span class="m-badge pc${li%6}">#${li+1}</span>` : `<span class="m-badge" style="background:rgba(255,255,255,.15)">${li+1}</span>`}</button>`;
      }).join('')}
    </div>
    <div class="match-col">
      <div class="match-hdr">Matches</div>
      ${R.map((txt, ri) => {
        const li = rightOwner[ri];
        return `<button type="button" class="m-item" ${answeredDone ? 'disabled' : ''} onclick="tapMatchRight(${ri})"><span>${esc(txt)}</span>${li >= 0 ? `<span class="m-badge pc${li%6}">#${li+1}</span>` : ''}</button>`;
      }).join('')}
    </div>
  </div>` +
  (!answeredDone ? `<button class="go" id="subBtn" ${allLinked ? '' : 'disabled'} onclick="submitMatch()">🔗 Submit Pairs (${matchMap.filter(v => v >= 0).length}/${L.length})</button>` : '');
}
function tapMatchLeft(li){
  if(busy || answeredDone) return;
  if(matchMap[li] >= 0) matchMap[li] = -1;
  matchSelLeft = li;
  drawMatch();
}
function tapMatchRight(ri){
  if(busy || answeredDone) return;
  const prevOwner = matchMap.indexOf(ri);
  if(prevOwner >= 0){
    matchMap[prevOwner] = -1;
    matchSelLeft = prevOwner;
    drawMatch();
    return;
  }
  let li = matchSelLeft;
  if(li < 0 || li >= matchMap.length || matchMap[li] >= 0) li = matchMap.indexOf(-1);
  if(li < 0) return;
  matchMap[li] = ri;
  matchSelLeft = matchMap.indexOf(-1);
  drawMatch();
}
function submitMatch(){
  if(matchMap.some(v => v < 0)) return;
  send({pairs: matchMap.slice()});
}

function syncSlider(v){
  if(answeredDone) return;
  const num = parseFloat(v);
  if(isNaN(num)) return;
  sliderVal = num;
  const r = document.getElementById('slRange'), n = document.getElementById('slNum'), d = document.getElementById('slDisp');
  if(r && r.value !== String(v)) r.value = num;
  if(n && document.activeElement !== n) n.value = num;
  if(d) d.textContent = num;
}
function submitSlider(){
  const n = document.getElementById('slNum');
  const v = n ? parseFloat(n.value) : sliderVal;
  if(isNaN(v)) return;
  send({val: v});
}

function tapPin(ev){
  if(busy || answeredDone) return;
  const img = document.getElementById('pinImg');
  if(!img) return;
  const rect = img.getBoundingClientRect();
  if(!rect.width || !rect.height) return;
  const x = Math.max(0, Math.min(100, ((ev.clientX - rect.left) / rect.width) * 100));
  const y = Math.max(0, Math.min(100, ((ev.clientY - rect.top) / rect.height) * 100));
  pinXY = [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
  const mk = document.getElementById('pinMark'), rd = document.getElementById('pinReadout'), sb = document.getElementById('subBtn');
  if(mk){ mk.style.display = 'block'; mk.style.left = pinXY[0] + '%'; mk.style.top = pinXY[1] + '%'; }
  if(rd) rd.textContent = `📍 Pin placed at (${Math.round(pinXY[0])}%, ${Math.round(pinXY[1])}%) — tap image to adjust`;
  if(sb) sb.disabled = false;
}
function submitPin(){
  if(!pinXY) return;
  send({pin_xy: pinXY});
}

function drawOrd(){
  const el = document.getElementById('ord');
  if(!el) return;
  const d = cur.a || [];
  const minH = d.length > 5 ? '56px' : '72px';
  el.innerHTML =
    sel.map((j, n) => `<div class="slot" onclick="removeOrd(${n})"><span><b>#${n+1}</b> ${esc(d[j])}</span><span style="opacity:.7">✕</span></div>`).join('') +
    `<div class="grid">${d.map((a, j) => sel.includes(j) ? '' : `<button class="c${j%6}" style="min-height:${minH}" ${answeredDone ? 'disabled' : ''} onclick="tapOrd(${j})"><span>${esc(a)}</span></button>`).join('')}</div>` +
    (!answeredDone ? `<div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px">${sel.length ? `<button class="sec" style="margin:0" onclick="sel.pop();drawOrd()">↩ Undo</button>` : ''}${sel.length === d.length ? `<button class="go" style="margin:0;flex:1" onclick="submitOrd()">✅ Submit Order</button>` : ''}</div>` : '');
}
function tapOrd(j){ if(busy || answeredDone) return; sel.push(j); drawOrd(); }
function removeOrd(pos){ if(busy || answeredDone) return; sel.splice(pos, 1); drawOrd(); }

function pick(i){ send({choice: i}, i); }
function submitText(){ const v = document.getElementById('txt').value.trim(); if(v) send({text: v}); }
function submitOrd(){ send({seq: sel.slice()}); }

async function send(payload, idx){
  if(busy || answeredDone) return;
  busy = true;
  const prevScore = me.score || 0;
  const r = await post('/api/hw_answer', {id: hid, name: me.name, ...payload});
  busy = false;
  if(!r._httpOk){
    alert(r.error || 'Something went wrong');
    if((r.error || '').includes('closed')) location.reload();
    return;
  }
  answeredDone = true;
  stopSpeech();
  const isRight = !!r.ok;
  const isPartial = !isRight && !!r.partial;
  const gained = r.gained != null ? r.gained : Math.max(0, (r.score || 0) - prevScore);
  me.score = r.score;
  me.correct = r.correct;
  me.answered = (cur.i || 0) + 1;
  syncHud(cur.i + 1, cur.n);
  if(isRight || isPartial) sfxCorrect(); else sfxWrong();

  const t = cur.qtype || cur.type || 'mc';
  const zm = document.getElementById('qMainImg');
  if(zm) zm.classList.remove('zoom-go');

  const subBtn = document.getElementById('subBtn');
  if(subBtn) subBtn.style.display = 'none';
  if(t === 'slider'){
    const sr = document.getElementById('slRange'), sn = document.getElementById('slNum');
    if(sr) sr.disabled = true;
    if(sn) sn.disabled = true;
  } else if(t === 'pin' && r.pin_target){
    const svg = document.getElementById('pinSvg');
    const pt = r.pin_target;
    if(svg) svg.innerHTML = `<ellipse cx="${pt.x}" cy="${pt.y}" rx="${pt.r}" ry="${pt.r}" fill="rgba(105,240,174,0.32)" stroke="#69f0ae" stroke-width="1.2"/>`;
  } else if(t === 'multi'){
    drawMulti();
  } else if(t === 'match'){
    drawMatch();
  } else if(t === 'order'){
    drawOrd();
  } else {
    document.querySelectorAll('.grid button').forEach((b, i) => {
      b.disabled = true;
      if(t === 'mc' || t === 'tf' || t === 'zoom'){
        if(i === idx) b.classList.add(isRight ? 'right' : 'picked');
        if(!isRight && cur.a && cur.a[i] === r.answer) b.classList.add('right');
        else if(i !== idx || !isRight) b.classList.add('dim');
      }
    });
  }

  const ansTxt = r.answer != null ? r.answer : (r.correct_ans || '');
  const fbCls = isRight ? 'ok' : (isPartial ? 'partial' : 'no');
  const fbTitle = isRight
    ? `✅ Correct!${gained > 0 ? ' +' + gained + ' pts' : ''}`
    : (isPartial ? `⚡ Partial Credit!${gained > 0 ? ' +' + gained + ' pts' : ''}` : '❌ Not quite');

  const fb = document.getElementById('fb');
  fb.innerHTML = `
    <div class="fb ${fbCls}">
      ${fbTitle}
      ${isRight ? '' : `<div style="font-size:.86em;font-weight:750;margin-top:4px;opacity:.95">Correct answer: <b>${esc(ansTxt)}</b></div>`}
    </div>
    ${r.quote ? `<blockquote>“${esc(r.quote)}”</blockquote>` : ''}
    <button class="go" id="nx">${r.done ? '🏆 See My Results' : 'Next Question ➔'}</button>
  `;
  document.getElementById('nx').onclick = () => {
    if(r.done) finish(r);
    else { cur = r.question; show(); }
  };
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function finish(r){
  stopSpeech();
  syncHud(null, 0);
  const pct = Math.round(100 * r.correct / Math.max(1, r.n));
  if(pct >= 80) confettiBurst();
  $.innerHTML = `
    <div class="card-panel">
      <div style="font-size:3.1em;line-height:1">${pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : '💪'}</div>
      <h1>All Done, ${esc(me.name)}!</h1>
      <div class="meta-row" style="margin-bottom:6px">
        <span class="meta-pill" style="color:#69f0ae;border-color:rgba(105,240,174,.4)">✅ Submitted to Instructor</span>
        <span class="meta-pill" style="color:var(--gold);border-color:rgba(255,223,93,.45)">📊 Grade: ${pct}%</span>
      </div>
      <div class="stats-grid">
        <div class="stat"><b>${pct}%</b>Percentage Grade (${r.correct}/${r.n})</div>
        <div class="stat"><b>⭐ ${r.score}</b>Total Points</div>
      </div>
      <p style="opacity:.84;font-size:.92em;margin:6px 0 4px">Your score has been recorded. You may safely close this page.</p>
      <a class="plink" href="/practice">🧑‍🎓 Practice More Quizzes →</a>
    </div>
  `;
}
init();
</script></body></html>
