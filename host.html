<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Host</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#46178f;color:#fff;text-align:center;min-height:100vh;overflow-x:hidden}
#app{padding:24px;max-width:1000px;margin:auto;position:relative;z-index:2}
h1{font-size:2.3em;margin:.35em 0}.pin{font-size:5em;font-weight:800;background:#fff;color:#46178f;display:inline-block;padding:0 30px;border-radius:12px}
.lobby-box{display:flex;flex-direction:column;align-items:center;gap:20px;margin:10px 0}
a.join-link{color:#fff;text-decoration:underline}
button{font-size:1.3em;padding:12px 32px;border:0;border-radius:8px;background:#26890c;color:#fff;cursor:pointer;margin-top:20px;font-weight:700}
button:hover{filter:brightness(1.08)}
.btn-sec{background:#ffffff2b;font-size:1.05em;padding:10px 22px;margin:10px 6px 0}
.btn-sm{background:#ffffff2b;font-size:.95em;padding:8px 16px;margin:0 4px;border-radius:99px}
.top-bar{position:fixed;top:14px;right:16px;z-index:20;display:flex;gap:8px;align-items:center}
.top-bar button{font-size:.95em;padding:8px 14px;margin:0;background:#0006;border-radius:99px}
.top-bar button.on{background:#26890c;box-shadow:0 0 0 2px #fff8}
.names span{display:inline-block;background:#fff3;border-radius:8px;padding:8px 14px;margin:5px;font-weight:600;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.a{padding:24px;border-radius:10px;font-size:1.45em;font-weight:700;position:relative;overflow:hidden}
.a.res{padding:16px 20px;font-size:1.25em;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.a.res.win{box-shadow:0 0 0 3px #fff,0 6px 20px #0006}
.a-fill{position:absolute;left:0;top:0;bottom:0;background:#fff3;transition:width .6s cubic-bezier(.22,1,.36,1);pointer-events:none}
.a-txt{position:relative;z-index:1;flex:1}
.a-cnt{position:relative;z-index:1;background:#0004;padding:4px 12px;border-radius:99px;font-size:.9em;white-space:nowrap}

.a.dim{opacity:.38}.c0{background:#e21b3c}.c1{background:#1368ce}.c2{background:#d89e00}.c3{background:#26890c}
blockquote{margin:14px auto 0;max-width:860px;background:#fff;color:#2b0d57;border-radius:14px;padding:16px 26px;font-size:1.28em;font-style:italic;line-height:1.4;box-shadow:0 8px 28px #0005;animation:slideUp .35s cubic-bezier(.22,1,.36,1)}

.logo{max-width:340px;width:80%;border-radius:16px;margin:20px auto 10px;display:block;box-shadow:0 4px 16px #0004}

.award{background:#fff2;border-radius:10px;padding:10px 18px;min-width:180px}
.award b{display:block;color:#ffdf5d;font-size:1.05em;margin-bottom:2px}
.tough-box{max-width:760px;margin:18px auto;background:#0004;border-radius:12px;padding:14px 20px;text-align:left}
.tough-box h3{margin:0 0 10px;text-align:center;color:#ffdf5d}

.tough-item:first-of-type{border-top:0}
.acc-pill{display:inline-block;background:#fff3;padding:8px 20px;border-radius:99px;font-weight:800;font-size:1.15em;margin:6px 0 12px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:26px auto 24px;max-width:640px;min-height:240px}
.pod{flex:1;max-width:190px;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(40px);transition:opacity .6s ease,transform .6s cubic-bezier(.22,1,.36,1)}
.pod.show{opacity:1;transform:translateY(0)}
.pod-name{font-size:1.2em;font-weight:800;margin-bottom:6px;word-break:break-word}
.pod-score{font-size:.95em;opacity:.9;margin-bottom:8px}
.pod-bar{width:100%;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:14px;font-size:2.2em;font-weight:900;box-shadow:0 6px 20px #0005}
.pod-1 .pod-bar{height:165px;background:linear-gradient(180deg,#ffd700,#d49b00);color:#2b0d57}
.pod-2 .pod-bar{height:125px;background:linear-gradient(180deg,#e0e6ed,#9aa5b1);color:#2b0d57}
.pod-3 .pod-bar{height:95px;background:linear-gradient(180deg,#e69a58,#a85d24);color:#2b0d57}
.modal-bg{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#2b0d57;border:2px solid #fff4;border-radius:16px;padding:24px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;text-align:left;box-shadow:0 12px 40px #0009}
.modal h2{margin-top:0;text-align:center}
.modal input,.modal textarea{width:100%;box-sizing:border-box;padding:10px 12px;margin:6px 0 12px;border-radius:8px;border:0;font-family:inherit;font-size:1em}
.modal textarea{min-height:170px;font-family:ui-monospace,monospace;font-size:.92em}
#reactions{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:15}
.float-emo{position:absolute;bottom:-40px;font-size:2.4em;animation:floatUp 3.2s ease-out forwards;filter:drop-shadow(0 3px 6px #0006)}
.float-emo small{display:block;font-size:.36em;background:#0008;color:#fff;padding:2px 6px;border-radius:99px;margin-top:-4px;white-space:nowrap}
@keyframes floatUp{0%{transform:translateY(0) scale(.7);opacity:0}12%{opacity:1;transform:translateY(-40px) scale(1.1)}100%{transform:translateY(-88vh) scale(1);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
</style></head><body>
<div class="top-bar">
 <button id="autoBtn" style="display:none" onclick="hostCtl('toggle_auto')">⏭️ Auto: Off</button>
 <button id="muteBtn" onclick="toggleMute()">🔊 Sound On</button>
</div>
<canvas id="confetti"></canvas>
<div id="reactions"></div>
<div class="modal-bg" id="quizModal">
 <div class="modal">
  <h2>➕ Create / Upload Custom Quiz</h2>
  <label><b>Quiz Title:</b></label>
  <input id="customTitle" placeholder="e.g. Chapter 9 Review">
  <label><b>Upload .json or .csv file (optional):</b></label>
  <input type="file" id="customFile" accept=".json,.csv" onchange="loadCustomFile(event)">
  <label><b>Or type/paste questions (one per block, mark correct answer with *):</b></label>
  <textarea id="customText" placeholder="What is the capital of France?
Berlin
*Paris
Madrid
Rome
Quote: Paris has been the capital since 987 CE.

Which planet is the Red Planet?
Venus
*Mars
Jupiter
Mercury"></textarea>
  <div id="customErr" style="color:#ff9b9b;font-weight:700"></div>
  <div style="display:flex;justify-content:flex-end;gap:10px">
   <button class="btn-sec" style="margin:0" onclick="closeQuizModal()">Cancel</button>
   <button style="margin:0;font-size:1.05em;padding:10px 24px" onclick="saveCustomQuiz()">Save Quiz</button>
  </div>
 </div>
</div>
<div id="app">
 <img class="logo" src="/logo.jpg" alt="Brainrush!">
 <div class="quiz-pick">
  <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%">
   <select id="quizSel" onchange="syncQuizCount()"><option value="quiz.json">Loading quizzes…</option></select>
   <button class="btn-sec" style="margin:0;padding:10px 16px;font-size:1em" onclick="openQuizModal()">➕ Add Quiz</button>
  </div>
  <div class="quiz-opts">
   <label>Questions: <input id="qCount" type="number" min="1" max="50" value="15"> <span id="qMax">/ 15</span></label>
   <label><input id="qShuffle" type="checkbox" checked> Randomize</label>
   <label>⏱️ Time (s): <input id="qTime" type="number" min="5" max="120" value="20"></label>
   <label>🤖 Bots: <input id="qBots" type="number" min="0" max="30" value="0"></label>
  </div>
  <div class="quiz-opts">
   <label><input id="qTeams" type="checkbox"> 🛡️ Team Mode</label>
   <label><input id="qWager" type="checkbox" checked> 🎰 Final Boss Wager</label>
   <label><input id="qRedemp" type="checkbox" checked> 🔄 Redemption Question</label>
   <label><input id="qAuto" type="checkbox"> ⏭️ Auto-Advance</label>
  </div>
 </div>
 <button onclick="create()">Create game</button>
</div>
<script>
let pin, host, S = {};
const $ = document.getElementById('app'), sh = ["▲ ","◆ ","● ","■ "];

// --- Web Audio API Synthesizer & Game Show Music ---
let actx = null, muted = false, lastPlayers = 0, lastPhase = '', lastTickSec = -1, lastQIdx = -1;
let bgmTimer = null, bgmStep = 0;

function ensureAudio(){
 if(!actx){const C = window.AudioContext || window.webkitAudioContext; if(C) actx = new C();}
 if(actx && actx.state === 'suspended') actx.resume();
 return actx;
}
window.addEventListener('pointerdown', ()=>ensureAudio(), {passive:true});

function playTone(freq, dur, type, vol, delay){
 if(muted || !actx) return;
 const run = ()=>{
  const t = actx.currentTime + (delay||0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(vol || 0.3, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
 };
 if(actx.state === 'suspended') actx.resume().then(run); else run();
}
function tone(freq, dur, type='triangle', vol=0.32, delay=0){
 ensureAudio();
 playTone(freq, dur, type, vol, delay);
}
function toggleMute(){
 ensureAudio();
 muted = !muted;
 document.getElementById('muteBtn').textContent = muted ? '🔇 Muted' : '🔊 Sound On';
 if(!muted){ sfxJoin(); startBgmForPhase(); } else stopBgm();
}
function stopBgm(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; } }
function startLobbyBgm(){
 stopBgm();
 const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 392.00];
 bgmStep = 0;
 bgmTimer = setInterval(()=>{
  if(muted || S.phase !== 'lobby') return;
  const f = notes[bgmStep++ % notes.length];
  tone(f, 0.22, 'triangle', 0.18, 0);
 }, 360);
}
function startQuestionBgm(){
 stopBgm();
 const bass = [220, 220, 261.63, 293.66, 329.63, 329.63, 293.66, 261.63];
 const lead = [440, 523.25, 659.25, 587.33, 659.25, 783.99, 659.25, 587.33];
 bgmStep = 0;
 bgmTimer = setInterval(()=>{
  if(muted || S.phase !== 'question' || S.paused) return;
  const i = bgmStep++ % bass.length;
  const urgent = (S.preview_left||0) <= 0 && S.left <= 5;
  const mult = urgent ? 1.122 : 1;
  tone(bass[i]*mult, 0.16, 'sawtooth', 0.14, 0);
  tone(lead[i]*mult, 0.18, 'triangle', 0.22, 0.15);
 }, 320);
}
function startBgmForPhase(){
 if(S.phase === 'lobby') startLobbyBgm();
 else if(S.phase === 'question') startQuestionBgm();
 else stopBgm();
}
function sfxJoin(){ tone(523.25, 0.12, 'triangle', 0.35, 0); tone(659.25, 0.18, 'triangle', 0.35, 0.09); }
function sfxQuestion(){ [440, 554.37, 659.25, 880].forEach((f,i)=>tone(f, 0.18, 'triangle', 0.34, i*0.08)); }
function sfxTick(urgent){ tone(urgent ? 987.77 : 659.25, urgent ? 0.11 : 0.07, 'square', urgent ? 0.28 : 0.16); }
function sfxReveal(){ [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>tone(f, 0.26, 'triangle', 0.36, i*0.09)); }
function sfxBoard(){ [392, 523.25, 659.25, 783.99].forEach((f,i)=>tone(f, 0.2, 'triangle', 0.32, i*0.09)); }
function sfxPodium(){ [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f,i)=>tone(f, 0.35, 'triangle', 0.38, i*0.13)); }

// --- Confetti ---
let confParts = [], confAnim = null;
function startConfetti(){
 const c = document.getElementById('confetti');
 c.width = window.innerWidth; c.height = window.innerHeight;
 const ctx = c.getContext('2d');
 const cols = ['#ff2e63','#08d9d6','#ffde7d','#7dff6b','#ffffff','#ff9800'];
 confParts = Array.from({length: 130}, ()=>({
  x: Math.random()*c.width, y: -20 - Math.random()*c.height*0.5,
  vx: (Math.random()-0.5)*3, vy: 2.5 + Math.random()*4,
  s: 6 + Math.random()*7, col: cols[Math.floor(Math.random()*cols.length)],
  a: Math.random()*6.28, va: (Math.random()-0.5)*0.2
 }));
 const start = performance.now();
 if(confAnim) cancelAnimationFrame(confAnim);
 function loop(now){
  ctx.clearRect(0,0,c.width,c.height);
  confParts.forEach(p=>{
   p.x += p.vx; p.y += p.vy; p.a += p.va;
   ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
   ctx.fillStyle = p.col; ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.6);
   ctx.restore();
  });
  if(now - start < 7000) confAnim = requestAnimationFrame(loop);
  else ctx.clearRect(0,0,c.width,c.height);
 }
 confAnim = requestAnimationFrame(loop);
}

// --- Floating Reactions ---
let seenReactId = 0;
function showReactions(list){
 if(!list) return;
 const box = document.getElementById('reactions');
 list.forEach(r=>{
  if(r.id > seenReactId){
   seenReactId = r.id;
   const el = document.createElement('div');
   el.className = 'float-emo';
   el.style.left = (10 + Math.random()*80) + '%';
   el.innerHTML = `${esc(r.emoji)}<small>${esc(r.name)}</small>`;
   box.appendChild(el);
   setTimeout(()=>el.remove(), 3300);
  }
 });
}

// --- Custom Quiz Builder / Uploader ---
function openQuizModal(){ document.getElementById('quizModal').classList.add('open'); }
function closeQuizModal(){ document.getElementById('quizModal').classList.remove('open'); document.getElementById('customErr').textContent=''; }
function loadCustomFile(ev){
 const f = ev.target.files && ev.target.files[0];
 if(!f) return;
 if(!document.getElementById('customTitle').value){
  document.getElementById('customTitle').value = f.name.replace(/\.(json|csv)$/i,'').replace(/[_-]+/g,' ');
 }
 const reader = new FileReader();
 reader.onload = () => { document.getElementById('customText').value = reader.result; };
 reader.readAsText(f);
}
function parseCustomQuestions(raw){
 const s = (raw||'').trim();
 if(!s) return [];
 if(s.startsWith('[') || s.startsWith('{')){
  const j = JSON.parse(s);
  return Array.isArray(j) ? j : (j.questions || []);
 }
 // Check if CSV (lines with commas)
 const blocks = s.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
 if(blocks.length === 1 && s.includes(',') && s.split('\n').length > 1){
  return s.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
   const p = line.split(',').map(x=>x.trim());
   if(p.length < 5 || p[0].toLowerCase()==='question') return null;
   return {q:p[0], a:p.slice(1,5), c:Math.max(0, (parseInt(p[5],10)||1)-1), quote:p[6]||''};
  }).filter(Boolean);
 }
 return blocks.map(b=>{
  const lines = b.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length < 3) return null;
  const q = lines[0];
  const a = [];
  let c = 0, quote = '';
  lines.slice(1).forEach(l=>{
   if(/^quote:/i.test(l)){ quote = l.replace(/^quote:\s*/i,''); }
   else if(a.length < 4){
    if(l.startsWith('*')){ c = a.length; a.push(l.slice(1).trim()); }
    else a.push(l);
   }
  });
  return {q, a, c, quote};
 }).filter(Boolean);
}
async function saveCustomQuiz(){
 const title = document.getElementById('customTitle').value.trim() || 'Custom Quiz';
 const raw = document.getElementById('customText').value;
 try{
  const qs = parseCustomQuestions(raw);
  const r = await post('/api/upload_quiz', {title, questions: qs});
  if(r.error){ document.getElementById('customErr').textContent = r.error; return; }
  quizList = r.quizzes || quizList;
  const sel = document.getElementById('quizSel');
  if(sel && r.quizzes){
   sel.innerHTML = r.quizzes.map(q=>`<option value="${esc(q.file)}">${esc(q.title)}</option>`).join('');
   sel.value = r.file;
   syncQuizCount();
  }
  closeQuizModal();
 }catch(e){
  document.getElementById('customErr').textContent = 'Could not parse questions: ' + e.message;
 }
}

async function post(u, b){return (await fetch(u,{method:'POST',body:JSON.stringify(b)})).json()}
let quizList = [];
function syncQuizCount(){
 const sel = document.getElementById('quizSel');
 const q = quizList.find(x=>x.file===(sel&&sel.value));
 if(q){
  const inp = document.getElementById('qCount'), mx = document.getElementById('qMax');
  if(inp){ inp.max = q.count; inp.value = q.count; }
  if(mx) mx.textContent = '/ ' + q.count;
 }
}
(async()=>{
 try{
  const r = await (await fetch('/api/quizzes')).json();
  const sel = document.getElementById('quizSel');
  if(sel && r.quizzes && r.quizzes.length){
   quizList = r.quizzes;
   sel.innerHTML = r.quizzes.map(q=>`<option value="${esc(q.file)}">${esc(q.title)}</option>`).join('');
   syncQuizCount();
  }
 }catch(e){}
})();
async function create(){
 ensureAudio();sfxJoin();
 const sel = document.getElementById('quizSel');
 const inp = document.getElementById('qCount');
 const shuf = document.getElementById('qShuffle');
 const tm = document.getElementById('qTime');
 const bots = document.getElementById('qBots');
 const teams = document.getElementById('qTeams');
 const wager = document.getElementById('qWager');
 const redemp = document.getElementById('qRedemp');
 const auto = document.getElementById('qAuto');
 const qf = sel ? sel.value : 'quiz.json';
 const cnt = inp ? parseInt(inp.value, 10) : null;
 const qtm = tm ? parseInt(tm.value, 10) || 20 : 20;
 const bcnt = bots ? parseInt(bots.value, 10) || 0 : 0;
 const r=await post('/api/create',{
  quiz:qf, count:cnt, shuffle:shuf ? shuf.checked : false, qtime:qtm, bots:bcnt,
  teams:teams ? teams.checked : false,
  wager:wager ? wager.checked : true,
  redemption:redemp ? redemp.checked : true,
  auto:auto ? auto.checked : false
 });
 pin=r.pin;host=r.host;
 document.getElementById('autoBtn').style.display = 'inline-block';
 poll();setInterval(poll,600);
}
async function addBots(n=5){ensureAudio();await post('/api/bots',{pin,host,count:n});await poll()}
async function hostCtl(action, sec=10){ensureAudio();await post('/api/host_ctl',{pin,host,action,sec});await poll()}
let busy=false;
async function next(){ensureAudio();if(busy)return;busy=true;try{await post('/api/next',{pin,host});await poll()}finally{setTimeout(()=>busy=false,500)}}
async function poll(){
 const r=await fetch('/api/state?pin='+pin);S=await r.json();
 const ab = document.getElementById('autoBtn');
 if(ab){
  ab.textContent = S.auto ? '⏭️ Auto: ON' : '⏭️ Auto: Off';
  ab.classList.toggle('on', !!S.auto);
 }
 showReactions(S.reactions);handleAudio();render();
}

function handleAudio(){
 if(S.phase === 'lobby' && S.n > lastPlayers){ sfxJoin(); }
 lastPlayers = S.n || 0;
 if(S.phase !== lastPhase || (S.phase === 'question' && S.index !== lastQIdx)){
  lastPhase = S.phase;
  lastQIdx = S.index;
  startBgmForPhase();
  if(S.phase === 'question'){ sfxQuestion(); lastTickSec = -1; }
  else if(S.phase === 'results') sfxReveal();
  else if(S.phase === 'board') sfxBoard();
  else if(S.phase === 'final'){ sfxPodium(); startConfetti(); }
 }
 if(S.phase === 'question' && !S.paused && (S.preview_left || 0) <= 0){
  const sec = Math.ceil(S.left);
  if(sec > 0 && sec !== lastTickSec){
   lastTickSec = sec;
   sfxTick(sec <= 5);
  }
 }
}

function teamStandingsHtml(){
 if(!S.teams_enabled || !S.team_board || !S.team_board.length) return '';
 return `<div class="team-grid">${S.team_board.map((t,i)=>`<div class="team-card" style="background:${t.color}">${i===0?'👑 ':''}${t.emoji} ${esc(t.name)}<small>${t.avg} avg pts (${t.members})</small></div>`).join('')}</div>`;
}

function board(b){return b.map((x,i)=>`<div class="row"><span>${i+1}. ${x.team_emoji?x.team_emoji+' ':''}${esc((x.avatar?x.avatar+' ':'')+x.name)}${x.streak>=2?`<span class="streak">🔥${x.streak}</span>`:''}</span><b>${x.score}</b></div>`).join('')}

let animDone = -1;
function animBoard(b, qIdx){
 const H = 46, first = animDone !== qIdx && qIdx > 0;
 const prevOrder = [...b].sort((a,c)=>(a.prev_rank||99)-(c.prev_rank||99));
 const prevPos = new Map(prevOrder.map((x,i)=>[x.name, i]));
 const rows = b.map((x,i)=>{
  const pIdx = first ? (prevPos.get(x.name) ?? i) : i;
  const sc = first ? (x.prev ?? x.score) : x.score;
  const rk = first ? (pIdx + 1) : (i + 1);
  const diff = (x.prev_rank || (i+1)) - (i + 1);
  const arrow = qIdx > 0 && diff > 0 ? `<span class="shift up">▲${diff}</span>` : qIdx > 0 && diff < 0 ? `<span class="shift down">▼${-diff}</span>` : '';
  const streak = x.streak >= 2 ? `<span class="streak">🔥${x.streak}</span>` : '';
  const gain = x.gained !== 0 ? `<span class="gain ${first?'':'show'}">${x.gained>0?'+'+x.gained:x.gained}</span>` : '';
  const label = (x.team_emoji ? x.team_emoji + ' ' : '') + esc((x.avatar ? x.avatar + ' ' : '') + x.name);
  return `<div class="row" data-idx="${i}" data-prev="${sc}" data-score="${x.score}" data-diff="${diff}" style="transform:translateY(${pIdx*H}px)"><span><b class="rk">${rk}</b>. ${label}${streak}${arrow}</span><span>${gain}<b class="sc">${sc}</b></span></div>`;
 }).join('');
 if(first){
  animDone = qIdx;
  setTimeout(()=>{
   const els = document.querySelectorAll('.board-wrap .row');
   els.forEach(el=>{
    const i = +el.dataset.idx, diff = +el.dataset.diff, p = +el.dataset.prev, s = +el.dataset.score;
    el.style.transform = `translateY(${i*H}px)`;
    if(diff > 0) el.classList.add('moved-up');
    el.querySelector('.rk').textContent = i + 1;
    const g = el.querySelector('.gain'); if(g) g.classList.add('show');
    const scEl = el.querySelector('.sc');
    if(s !== p){
     const t0 = performance.now(), dur = 750;
     const step = now => {
      const k = Math.min(1, (now - t0) / dur);
      scEl.textContent = Math.round(p + (s - p) * k);
      if(k < 1) requestAnimationFrame(step);
     };
     requestAnimationFrame(step);
    }
   });
  }, 450);
 } else if(animDone !== qIdx){
  animDone = qIdx;
 }
 return `<div class="board-wrap" style="height:${b.length*H}px">${rows}</div>`;
}

let podiumShown = false;
function renderFinal(b){
 const p1 = b[0], p2 = b[1], p3 = b[2];
 const podSlot = (p, place, medal) => p ? `<div class="pod pod-${place} ${podiumShown?'show':''}" id="pod${place}">
  <div class="pod-name">${p.team_emoji?p.team_emoji+' ':''}${esc((p.avatar?p.avatar+' ':'')+p.name)}</div>
  <div class="pod-score">${p.score} pts</div>
  <div class="pod-bar">${medal}</div>
 </div>` : '';
 const podiumHtml = `<div class="podium">${podSlot(p2,2,'🥈')}${podSlot(p1,1,'🥇')}${podSlot(p3,3,'🥉')}</div>`;
 if(!podiumShown){
  podiumShown = true;
  setTimeout(()=>{const e=document.getElementById('pod3');if(e)e.classList.add('show')}, 350);
  setTimeout(()=>{const e=document.getElementById('pod2');if(e)e.classList.add('show')}, 1150);
  setTimeout(()=>{const e=document.getElementById('pod1');if(e)e.classList.add('show')}, 1950);
 }
 const rest = b.slice(3);
 const st = S.stats || {};
 const accHtml = st.possible ? `<div class="acc-pill">🎯 Group Accuracy: ${st.accuracy}% (${st.correct}/${st.possible} correct)</div>` : '';
 const awHtml = (st.awards && st.awards.length) ? `<div class="awards">${st.awards.map(a=>`<div class="award"><b>${esc(a.title)}</b>${esc(a.winner)} <small>(${esc(a.detail)})</small></div>`).join('')}</div>` : '';
 const toughHtml = (st.tough && st.tough.length) ? `<div class="tough-box"><h3>🧠 Tough Ones Recap (Most Missed)</h3>${st.tough.map(t=>`<div class="tough-item"><b>Q${t.index}${t.redemption?' (Redemption)':''} (${t.pct}% correct):</b> ${esc(t.q)}<br><span style="color:#7dff6b">✅ ${esc(t.ans)}</span></div>`).join('')}</div>` : '';
 return `<h1>🏆 Final Podium</h1>${accHtml}${teamStandingsHtml()}${podiumHtml}${awHtml}${toughHtml}${rest.length?'<h2>Runners-up</h2>'+board(rest):''}
 <div>
  <a href="/api/export?pin=${pin}" download="brainrush_${pin}_results.csv"><button class="btn-sec">📥 Download Results (CSV)</button></a>
  <button onclick="location.reload()">New game</button>
 </div>`;
}

function quoteBox(){return `<blockquote>&ldquo;${esc(S.quote)}&rdquo;${S.source?`<cite>&mdash; ${esc(S.source)}</cite>`:''}</blockquote>`}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

3v1h-3zM8,22h1v1h-1zM10,22h3v1h-3zM14,22h1v1h-1zM18,22h6v1h-6zM26,22h1v1h-1zM2,23h1v1h-1zM4,23h3v1h-3zM8,23h1v1h-1zM12,23h4v1h-4zM19,23h1v1h-1zM21,23h4v1h-4zM2,24h1v1h-1zM4,24h3v1h-3zM8,24h1v1h-1zM10,24h5v1h-5zM16,24h2v1h-2zM22,24h1v1h-1zM26,24h1v1h-1zM2,25h1v1h-1zM8,25h1v1h-1zM14,25h5v1h-5zM20,25h1v1h-1zM22,25h2v1h-2zM25,25h1v1h-1zM2,26h7v1h-7zM10,26h1v1h-1zM13,26h1v1h-1zM16,26h3v1h-3zM21,26h1v1h-1zM25,26h2v1h-2z" fill="#2b0d57"/></svg>';
let last='';
function render(){
 const inPrev = S.phase==='question' && (S.preview_left||0) > 0;
 const k = S.phase==='question'
  ? `q:${S.index}:${inPrev?1:0}`
  : JSON.stringify({...S,left:0,qtime:0,answered:0,preview_left:0,auto_left:0,reactions:null});
 if(k==last){
  const t=document.getElementById('t');
  if(t){
   const sec = Math.ceil(S.left);
   t.textContent = S.paused ? '⏸️ ' + sec : sec;
   t.classList.toggle('urgent', !S.paused && sec <= 5);
   t.classList.toggle('paused', !!S.paused);
  }
  const pb=document.getElementById('pauseBtn');
  if(pb) pb.textContent = S.paused ? '▶️ Resume' : '⏸️ Pause';
  const ac=document.getElementById('ansCnt');
  if(ac) ac.textContent = `${S.answered}/${S.n}`;
  const pf=document.getElementById('pf');
  if(pf) pf.style.width = Math.min(100, ((S.preview_left||0)/(S.preview_total||5))*100)+'%';
  const ab=document.getElementById('autoNextLbl');
  if(ab && S.auto_left != null) ab.textContent = ` (${S.auto_left}s)`;
  return;
 }
 last=k;
 const autoSuffix = S.auto && S.auto_left != null ? `<span id="autoNextLbl"> (${S.auto_left}s)</span>` : '';
 if(S.phase=='lobby')$.innerHTML=`<h1>Join at <a class="join-link" href="/play?pin=${pin}" target="_blank">plw.me/play</a> with PIN</h1><div class="lobby-box"><div class="pin">${pin}</div>${QR}</div>
  <p>${S.n} player(s)</p>${teamStandingsHtml()}<div class="names">${S.names.map(n=>`<span>${esc(n)}</span>`).join('')}</div>
  <div><button class="btn-sec" onclick="addBots(5)">🤖 +5 Phantom players</button>${S.n?'<button onclick="next()">Start</button>':''}</div>`;
 else if(S.phase=='question'){
  const sec = Math.ceil(S.left);
  const pct = Math.min(100, ((S.preview_left||0)/(S.preview_total||5))*100);
  const badges = `${S.redemption?'<div class="redemp-banner">🔄 REDEMPTION QUESTION (MOST MISSED!) 🔄</div>':''}${S.boss?'<div class="double-banner">🎰 FINAL BOSS WAGER + 2x POINTS! 🎰</div>':S.double?'<div class="double-banner">⚡ DOUBLE POINTS! ⚡</div>':''}`;
  if(inPrev){
   $.innerHTML=`<p>Question ${S.index+1}/${S.total}</p>
   <div class="q-stage">
    <div>${badges}</div>
    <h1>${esc(S.question)}</h1>
    <div class="preview-box" style="width:100%">
     <div class="preview-label">${S.boss?'🎰 Place your wagers & read the question…':'👀 Read the question…'}</div>
     <div class="preview-bar"><div class="preview-fill" id="pf" style="width:${pct}%"></div></div>
    </div>
   </div>`;
  } else {
   $.innerHTML=`<p>Question ${S.index+1}/${S.total} &middot; <span id="ansCnt">${S.answered}/${S.n}</span> answered</p>
   <div>${badges}</div>
   <h1>${esc(S.question)}</h1>
   <div class="ans-reveal">
    <div class="timer-row">
     <button class="btn-sm" id="pauseBtn" onclick="hostCtl('pause')">${S.paused?'▶️ Resume':'⏸️ Pause'}</button>
     <div class="timer ${!S.paused&&sec<=5?'urgent':''} ${S.paused?'paused':''}" id="t">${S.paused?'⏸️ '+sec:sec}</div>
     <button class="btn-sm" onclick="hostCtl('add_time',10)">+10s</button>
    </div>
    <div class="grid">${S.answers.map((a,i)=>`<div class="a c${i}">${sh[i]}${esc(a)}</div>`).join('')}</div>
    <button onclick="next()">Skip</button>
   </div>`;
  }
 } else if(S.phase=='results'){
  const ci = S.correct;
  const tot = Math.max(1, (S.counts||[]).reduce((a,b)=>a+b, 0));
  $.innerHTML=`<p style="margin:.2em 0">Question ${S.index+1}/${S.total} &middot; ${S.answered}/${S.n} answered</p>
  <h2 style="margin:.15em auto .3em;max-width:880px;font-size:1.7em;line-height:1.25">${esc(S.question)}</h2>
  <div class="ans-reveal">
   <div class="grid" style="margin-top:10px">${S.answers.map((a,i)=>{
    const cnt = (S.counts&&S.counts[i])||0;
    const pct = Math.round((cnt / tot) * 100);
    const win = i===ci;
    return `<div class="a res c${i} ${win?'win':'dim'}">
     <div class="a-fill" style="width:${pct}%"></div>
     <span class="a-txt">${sh[i]}${esc(a)}</span>
     <span class="a-cnt">${cnt}${win?' ✓':''}</span>
    </div>`;
   }).join('')}</div>
   ${S.quote?quoteBox():''}
   <div><button style="margin-top:14px" onclick="next()">Top players${autoSuffix}</button></div>
  </div>`;
 } else if(S.phase=='board'){
  const shHtml = (S.shoutouts&&S.shoutouts.length)?`<div class="shouts">${S.shoutouts.map(s=>`<span class="shout">${esc(s)}</span>`).join('')}</div>`:'';
  $.innerHTML=`<p>After question ${S.index+1}/${S.total}</p><h1>🏆 Top players</h1>${teamStandingsHtml()}${shHtml}${animBoard(S.board,S.index)}
  <button onclick="next()">${S.index+1>=S.total?'Final results':'Next question'}${autoSuffix}</button>`;
 } else $.innerHTML=renderFinal(S.board);
}
</script></body></html>
