<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Host</title>
<style>
:root{--bg:#46178f;--accent:#26890c;--card:#2b0d57}
body.theme-neon{--bg: radial-gradient(circle at top,#1a1040,#090514);background:#0d0620;--accent:#00c896;--card:#13092b}
body.theme-emerald{--bg: linear-gradient(135deg,#0f4c3a,#072a20);background:#0f4c3a;--accent:#e69a00;--card:#093024}
body.theme-sunset{--bg: linear-gradient(135deg,#7b1fa2,#c2185b,#e65100);background:#8e24aa;--accent:#1976d2;--card:#3b0d4a}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#fff;text-align:center;min-height:100vh;overflow-x:hidden;transition:background .4s}
#app{padding:24px;max-width:1000px;margin:auto;position:relative;z-index:2}
h1{font-size:2.3em;margin:.35em 0}.pin{font-size:5em;font-weight:800;background:#fff;color:#46178f;display:inline-block;padding:0 30px;border-radius:12px}
.lobby-box{display:flex;flex-direction:column;align-items:center;gap:20px;margin:10px 0}
a.join-link{color:#fff;text-decoration:underline}
button{font-size:1.3em;padding:12px 32px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;margin-top:20px;font-weight:700}
button:hover{filter:brightness(1.08)}
.btn-sec{background:#ffffff2b;font-size:1.05em;padding:10px 22px;margin:10px 6px 0}
.btn-sm{background:#ffffff2b;font-size:.95em;padding:8px 16px;margin:0 4px;border-radius:99px}
.top-bar{position:fixed;top:14px;right:16px;z-index:40}
.menu-btn{font-size:1.25em;padding:8px 14px;margin:0;background:#0007;border:1px solid #fff3;border-radius:12px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px);box-shadow:0 4px 14px #0005}
.menu-btn:hover{background:#000a}
.menu-dot{width:8px;height:8px;border-radius:50%;background:#7dff6b;display:none}
.menu-dot.on{display:inline-block}
.menu-drop{position:absolute;top:50px;right:0;width:260px;background:var(--card);border:1px solid #fff4;border-radius:14px;padding:8px;box-shadow:0 12px 36px #000b;display:none;flex-direction:column;gap:4px;text-align:left;backdrop-filter:blur(12px)}
.menu-drop.open{display:flex;animation:pop .16s ease-out}
.menu-drop button{width:100%;margin:0;padding:10px 12px;font-size:.95em;font-weight:600;background:transparent;border-radius:9px;text-align:left;display:flex;align-items:center;justify-content:space-between;color:#fff}
.menu-drop button:hover{background:#fff2}
.menu-drop button .state{font-size:.82em;padding:2px 8px;border-radius:99px;background:#fff2;color:#fffc}
.menu-drop button.on .state{background:#26890c;color:#fff;font-weight:800}
.menu-sep{height:1px;background:#fff2;margin:4px 6px}
.menu-kb{font-size:.76em;opacity:.65;padding:6px 10px 4px;line-height:1.45}
.names span{display:inline-block;background:#fff3;border-radius:8px;padding:8px 14px;margin:5px;font-weight:600;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.a{padding:24px;border-radius:10px;font-size:1.45em;font-weight:700;position:relative;overflow:hidden}
.a.res{padding:16px 20px;font-size:1.25em;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
.a.res.win{box-shadow:0 0 0 3px #fff,0 6px 20px #0006}
.a-fill{position:absolute;left:0;top:0;bottom:0;background:#fff3;transition:width .6s cubic-bezier(.22,1,.36,1);pointer-events:none}
.a-txt{position:relative;z-index:1;flex:1}
.a-cnt{position:relative;z-index:1;background:#0004;padding:4px 12px;border-radius:99px;font-size:.9em;white-space:nowrap}
.a.win .a-cnt{background:#fff;color:#2b0d57;font-weight:900}
.a.dim{opacity:.38}.c0{background:#e21b3c}.c1{background:#1368ce}.c2{background:#d89e00}.c3{background:#26890c}
blockquote{margin:14px auto 0;max-width:860px;background:#fff;color:#2b0d57;border-radius:14px;padding:16px 26px;font-size:1.28em;font-style:italic;line-height:1.4;box-shadow:0 8px 28px #0005;animation:slideUp .35s cubic-bezier(.22,1,.36,1)}
blockquote cite{display:block;font-size:.74em;font-style:normal;margin-top:6px;opacity:.75;font-weight:700}
.q-img{max-height:220px;max-width:90%;border-radius:12px;margin:8px auto;display:block;box-shadow:0 6px 20px #0005;object-fit:contain;background:#fff}
.timer-row{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0}
.timer{font-size:3em;font-weight:800;min-width:70px}
.timer.urgent{color:#ffdf5d;animation:pulse .5s infinite alternate}
.timer.paused{color:#ff9800;opacity:.85}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
.double-banner{display:inline-block;background:linear-gradient(90deg,#ff9800,#ffd600);color:#2b0d57;font-weight:900;padding:6px 20px;border-radius:99px;font-size:1.15em;letter-spacing:.5px;box-shadow:0 4px 14px #0004;animation:pulse .6s infinite alternate;margin:4px}
.redemp-banner{display:inline-block;background:linear-gradient(90deg,#ff2e63,#ff9800);color:#fff;font-weight:900;padding:6px 22px;border-radius:99px;font-size:1.15em;letter-spacing:.5px;box-shadow:0 4px 14px #0004;animation:pulse .6s infinite alternate;margin:4px}
.preview-box{margin:30px auto;max-width:640px}
.preview-label{font-size:1.4em;font-weight:700;color:#ffdf5d;margin-bottom:12px}
.preview-bar{height:14px;background:#fff3;border-radius:99px;overflow:hidden}
.preview-fill{height:100%;background:#ffdf5d;transition:width .2s linear}
.q-stage{min-height:46vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px}
.q-stage h1{font-size:2.7em;line-height:1.25;max-width:880px}
.ans-reveal{animation:slideUp .35s cubic-bezier(.22,1,.36,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.board-wrap{position:relative;max-width:580px;margin:6px auto}
.row{background:#fff2;padding:0 18px;height:36px;border-radius:8px;max-width:580px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;font-size:1.08em;margin:3px auto}
.board-wrap .row{position:absolute;left:0;right:0;margin:0;transition:transform .85s cubic-bezier(.22,1,.36,1),background .4s}
.row.moved-up{background:#26890caa;box-shadow:0 4px 14px #0005}
.gain{font-size:.82em;background:#fff3;padding:2px 8px;border-radius:99px;margin-right:8px;opacity:0;transition:opacity .35s}
.gain.show{opacity:1}
.streak{font-size:.82em;background:#ff6d00;color:#fff;padding:2px 8px;border-radius:99px;margin-left:8px;font-weight:700}
.shift{font-size:.85em;margin-left:6px;opacity:.9}
.up{color:#7dff6b}.down{color:#ff9b9b}
.logo{max-width:300px;width:75%;border-radius:16px;margin:14px auto 12px;display:block;box-shadow:0 4px 16px #0004}
.setup-card{max-width:640px;margin:0 auto;background:#0004;border:1px solid #fff2;border-radius:18px;padding:20px 22px;box-shadow:0 10px 32px #0005}
.quiz-row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;width:100%}
.quiz-row select{flex:1;min-width:220px;font-size:1.1em;padding:11px 16px;border-radius:10px;border:0;background:#fff;color:#2b0d57;font-weight:700;cursor:pointer}
.quick-bar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid #fff2;font-weight:700;font-size:1.02em}
.quick-bar label{display:inline-flex;align-items:center;gap:6px}
.quick-bar input[type=number],.adv-panel input[type=number]{width:58px;font-size:1em;padding:6px 8px;border-radius:8px;border:0;text-align:center;font-weight:800;color:#2b0d57;background:#fff}
.drawer-toggle{background:#fff2;font-size:.92em;padding:7px 14px;margin:0;border-radius:99px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.drawer-toggle.open{background:#fff4}
.adv-panel{display:none;margin-top:14px;padding-top:14px;border-top:1px solid #fff2;text-align:left}
.adv-panel.open{display:block;animation:slideUp .2s ease-out}
.adv-sec-title{font-size:.8em;text-transform:uppercase;letter-spacing:1px;opacity:.7;font-weight:800;margin:0 0 8px}
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px;margin-bottom:12px}
.mode-pill{display:flex;align-items:center;gap:8px;background:#fff1;border:1px solid #fff2;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:.94em;font-weight:600;user-select:none;transition:background .15s,border-color .15s}
.mode-pill:hover{background:#fff2}
.mode-pill:has(input:checked){background:#26890c66;border-color:#7dff6b}
.mode-pill input[type=checkbox]{width:16px;height:16px;margin:0;cursor:pointer;accent-color:#26890c}
.shouts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px auto 8px;max-width:780px}
.shout{background:#fff2;border:1px solid #fff4;padding:4px 13px;border-radius:99px;font-size:.92em;font-weight:700;animation:pop .3s ease-out}
.team-grid{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px auto 16px;max-width:780px}
.team-card{padding:10px 18px;border-radius:10px;font-weight:800;min-width:140px;box-shadow:0 4px 12px #0004}
.team-card small{display:block;font-weight:600;opacity:.9;font-size:.82em;margin-top:2px}
.word-cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;max-width:820px;min-height:220px;margin:24px auto;padding:24px;background:#0003;border-radius:16px}
.word-tag{display:inline-block;padding:8px 18px;border-radius:99px;background:#fff2;font-weight:800;animation:pop .3s ease-out;box-shadow:0 4px 12px #0004}
.awards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:16px auto;max-width:740px}
.award{background:#fff2;border-radius:10px;padding:10px 18px;min-width:180px}
.award b{display:block;color:#ffdf5d;font-size:1.05em;margin-bottom:2px}
.tough-box{max-width:760px;margin:18px auto;background:#0004;border-radius:12px;padding:14px 20px;text-align:left}
.tough-box h3{margin:0 0 10px;text-align:center;color:#ffdf5d}
.tough-item{padding:8px 0;border-top:1px solid #fff2;font-size:1.02em}
.tough-item:first-of-type{border-top:0}
.acc-pill{display:inline-block;background:#fff3;padding:8px 20px;border-radius:99px;font-weight:800;font-size:1.15em;margin:6px 0 12px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:26px auto 24px;max-width:640px;min-height:240px}
.pod{flex:1;max-width:190px;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(40px);transition:opacity .6s ease,transform .6s cubic-bezier(.22,1,.36,1)}
.pod.show{opacity:1;transform:translateY(0)}
.pod-name{font-size:1.2em;font-weight:800;margin-bottom:6px;word-break:break-word}
.pod-score{font-size:.95em;opacity:.9;margin-bottom:8px}
.pod-bar{width:100%;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:14px;font-size:2.2em;font-weight:900;box-shadow:0 6px 20px #0005}
.pod-1 .pod-bar{height:165px;background:linear-gradient(180deg,#ffd700,#d49b00);color:#2b0d57}
.pod-2 .pod-bar{height:125px;background:linear-gradient(180deg,#e0e6ed,#9aa5b1);color:#2b0d57}
.pod-3 .pod-bar{height:95px;background:linear-gradient(180deg,#e69a58,#a85d24);color:#2b0d57}
.modal-bg{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:2px solid #fff4;border-radius:16px;padding:24px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;text-align:left;box-shadow:0 12px 40px #0009}
.modal h2{margin-top:0;text-align:center}
.modal input,.modal textarea{width:100%;box-sizing:border-box;padding:10px 12px;margin:6px 0 12px;border-radius:8px;border:0;font-family:inherit;font-size:1em}
.modal textarea{min-height:170px;font-family:ui-monospace,monospace;font-size:.92em}
.kb-hint{position:fixed;bottom:8px;right:12px;font-size:.78em;opacity:.55;pointer-events:none;z-index:5}
#reactions{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:15}
.float-emo{position:absolute;bottom:-40px;font-size:2.4em;animation:floatUp 3.2s ease-out forwards;filter:drop-shadow(0 3px 6px #0006)}
.float-emo small{display:block;font-size:.36em;background:#0008;color:#fff;padding:2px 6px;border-radius:99px;margin-top:-4px;white-space:nowrap}
@keyframes floatUp{0%{transform:translateY(0) scale(.7);opacity:0}12%{opacity:1;transform:translateY(-40px) scale(1.1)}100%{transform:translateY(-88vh) scale(1);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
</style></head><body>
<div class="top-bar" id="topNav">
 <button class="menu-btn" onclick="toggleNavMenu(event)" title="Host Controls & Settings">
  <span>☰</span>
  <span id="navBadge" style="font-size:.75em;font-weight:700">Menu</span>
 </button>
 <div class="menu-drop" id="navMenu">
  <button id="muteBtn" class="on" onclick="toggleMute()"><span>🔊 Sound Effects</span><span class="state" id="muteState">ON</span></button>
  <button id="ttsBtn" onclick="toggleTts()"><span>🗣️ Voice Announcer</span><span class="state" id="ttsState">Off</span></button>
  <button id="autoBtn" style="display:none" onclick="hostCtl('toggle_auto')"><span>⏭️ Auto-Advance</span><span class="state" id="autoState">Off</span></button>
  <button onclick="cycleTheme()"><span>🎨 Visual Theme</span><span class="state" id="themeState">Purple</span></button>
  <div class="menu-sep"></div>
  <button id="remoteBtn" style="display:none" onclick="closeNavMenu();openRemoteModal()"><span>📱 Phone Host Remote</span><span class="state">Open ↗</span></button>
  <button id="addQuizMenuBtn" onclick="closeNavMenu();openQuizModal()"><span>➕ Create / Upload Quiz</span><span class="state">New</span></button>
  <div class="menu-sep"></div>
  <div class="menu-kb">⌨️ <b>Shortcuts:</b> [Space/→] Next &middot; [P] Pause &middot; [+] +10s &middot; [M] Mute &middot; [V] Voice</div>
 </div>
</div>
<canvas id="confetti"></canvas>
<div id="reactions"></div>
<div class="modal-bg" id="remoteModal">
 <div class="modal" style="max-width:460px;text-align:center">
  <h2>📱 Phone Host Remote</h2>
  <p>Open this link on your phone to control the quiz from anywhere in the room:</p>
  <input id="remoteUrlInp" readonly onclick="this.select()">
  <div style="display:flex;justify-content:center;gap:10px;margin-top:10px">
   <button class="btn-sec" style="margin:0" onclick="navigator.clipboard.writeText(document.getElementById('remoteUrlInp').value)">📋 Copy Link</button>
   <button style="margin:0;padding:10px 22px;font-size:1.05em" onclick="document.getElementById('remoteModal').classList.remove('open')">Done</button>
  </div>
 </div>
</div>
<div class="modal-bg" id="quizModal">
 <div class="modal">
  <h2>➕ Create / Upload Custom Quiz</h2>
  <label><b>Quiz Title:</b></label>
  <input id="customTitle" placeholder="e.g. Chapter 9 Review">
  <label><b>Upload .json or .csv file (optional):</b></label>
  <input type="file" id="customFile" accept=".json,.csv" onchange="loadCustomFile(event)">
  <label><b>Or type/paste questions (one per block, mark correct answer with *, optional Image: or Quote:):</b></label>
  <textarea id="customText" placeholder="What is the capital of France?
Berlin
*Paris
Madrid
Rome
Image: https://example.com/paris.jpg
Quote: Paris has been the capital since 987 CE."></textarea>
  <div id="customErr" style="color:#ff9b9b;font-weight:700"></div>
  <div style="display:flex;justify-content:flex-end;gap:10px">
   <button class="btn-sec" style="margin:0" onclick="closeQuizModal()">Cancel</button>
   <button style="margin:0;font-size:1.05em;padding:10px 24px" onclick="saveCustomQuiz()">Save Quiz</button>
  </div>
 </div>
</div>
<div id="app">
 <img class="logo" src="/logo.jpg" alt="Brainrush!">
 <div class="setup-card">
  <div class="quiz-row">
   <select id="quizSel" onchange="syncQuizCount()"><option value="quiz.json">Loading quizzes…</option></select>
   <button class="btn-sec" style="margin:0;padding:11px 16px;font-size:.98em;border-radius:10px" onclick="openQuizModal()">➕ Add Quiz</button>
  </div>
  <div class="quick-bar">
   <label>📝 Questions: <input id="qCount" type="number" min="1" max="200" value="15"> <span id="qMax" style="opacity:.8">/ 15</span></label>
   <label>⏱️ Timer: <input id="qTime" type="number" min="5" max="120" value="20"><span style="opacity:.8">s</span></label>
   <button type="button" class="drawer-toggle" id="advBtn" onclick="toggleAdvPanel()">⚙️ Options <span id="optSummary" style="background:#26890c;padding:2px 8px;border-radius:99px;font-size:.85em">4 active</span> <span id="advCaret">▾</span></button>
  </div>
  <div class="adv-panel" id="advPanel" onchange="updateOptSummary()">
   <div class="adv-sec-title">Game Modes & Power-Ups</div>
   <div class="mode-grid">
    <label class="mode-pill"><input id="qShuffle" type="checkbox" checked> 🎲 Randomize Order</label>
    <label class="mode-pill"><input id="qWager" type="checkbox" checked> 🎰 Final Boss Wager</label>
    <label class="mode-pill"><input id="qRedemp" type="checkbox" checked> 🔄 Redemption Round</label>
    <label class="mode-pill"><input id="qSabotage" type="checkbox" checked> ❄️ Ice Sabotage</label>
    <label class="mode-pill"><input id="qTeams" type="checkbox"> 🛡️ Team Mode</label>
    <label class="mode-pill"><input id="qIce" type="checkbox" onchange="document.getElementById('icePromptRow').style.display=this.checked?'block':'none'"> 💭 Word Cloud Warm-Up</label>
    <label class="mode-pill"><input id="qAuto" type="checkbox"> ⏭️ Auto-Advance</label>
   </div>
   <div id="icePromptRow" style="display:none;margin-bottom:12px">
    <label style="display:block;font-size:.86em;font-weight:700;opacity:.85;margin-bottom:4px">💭 Warm-Up Question:</label>
    <input id="qIcePrompt" type="text" maxlength="120" value="In one word, how are you feeling today?" placeholder="e.g. In one word, what's your favorite food?" style="width:100%;box-sizing:border-box;padding:9px 12px;border-radius:8px;border:0;font-size:.96em;font-weight:600;color:#2b0d57">
   </div>
   <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:8px;border-top:1px solid #fff2;font-weight:700;font-size:.95em">
    <label style="display:inline-flex;align-items:center;gap:8px">🤖 Phantom Bot Players: <input id="qBots" type="number" min="0" max="30" value="0"></label>
    <span style="opacity:.68;font-size:.88em">Bots answer &amp; compete alongside live players</span>
   </div>
  </div>
  <button style="width:100%;margin-top:18px;padding:14px;font-size:1.35em;border-radius:12px" onclick="create()">🚀 Create Game</button>
 </div>
</div>
<script>
let pin, host, S = {};
const $ = document.getElementById('app'), sh = ["▲ ","◆ ","● ","■ "];

// --- Hamburger Nav & Setup Drawer ---
function toggleNavMenu(ev){
 if(ev) ev.stopPropagation();
 document.getElementById('navMenu').classList.toggle('open');
}
function closeNavMenu(){
 const m = document.getElementById('navMenu');
 if(m) m.classList.remove('open');
}
window.addEventListener('click', e=>{
 const nav = document.getElementById('topNav');
 if(nav && !nav.contains(e.target)) closeNavMenu();
});
function toggleAdvPanel(){
 const p = document.getElementById('advPanel'), b = document.getElementById('advBtn'), c = document.getElementById('advCaret');
 if(!p) return;
 const open = p.classList.toggle('open');
 if(b) b.classList.toggle('open', open);
 if(c) c.textContent = open ? '▴' : '▾';
}
function updateOptSummary(){
 const ids = ['qShuffle','qWager','qRedemp','qSabotage','qTeams','qIce','qAuto'];
 let n = ids.filter(id=>{const el=document.getElementById(id); return el && el.checked;}).length;
 const bots = document.getElementById('qBots');
 if(bots && parseInt(bots.value,10) > 0) n++;
 const s = document.getElementById('optSummary');
 if(s) s.textContent = `${n} active`;
}

// --- Visual Themes ---
const THEMES = ['', 'theme-neon', 'theme-emerald', 'theme-sunset'];
const THEME_NAMES = ['Purple', 'Neon', 'Emerald', 'Sunset'];
let themeIdx = 0;
function cycleTheme(){
 themeIdx = (themeIdx + 1) % THEMES.length;
 document.body.className = THEMES[themeIdx];
 const ts = document.getElementById('themeState');
 if(ts) ts.textContent = THEME_NAMES[themeIdx];
}

// --- AI Voice Announcer (SpeechSynthesis) ---
let ttsOn = false;
function toggleTts(){
 ttsOn = !ttsOn;
 const b = document.getElementById('ttsBtn'), st = document.getElementById('ttsState');
 if(b) b.classList.toggle('on', ttsOn);
 if(st) st.textContent = ttsOn ? 'ON' : 'Off';
 if(ttsOn) speak('Voice announcer activated!');
 else if(window.speechSynthesis) window.speechSynthesis.cancel();
}
function speak(txt){
 if(!ttsOn || !window.speechSynthesis || !txt) return;
 try{
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.rate = 1.04;
  window.speechSynthesis.speak(u);
 }catch(e){}
}

// --- Keyboard Shortcuts ---
window.addEventListener('keydown', e=>{
 if(['INPUT','TEXTAREA','SELECT'].includes((e.target||{}).tagName)) return;
 if(e.code==='Space' || e.code==='ArrowRight'){ if(pin && S.phase!=='final'){ e.preventDefault(); next(); } }
 else if(e.key==='p' || e.key==='P'){ if(pin && S.phase==='question') hostCtl('pause'); }
 else if(e.key==='+' || e.key==='='){ if(pin && S.phase==='question') hostCtl('add_time', 10); }
 else if(e.key==='m' || e.key==='M'){ toggleMute(); }
 else if(e.key==='v' || e.key==='V'){ toggleTts(); }
});

// --- Web Audio API Synthesizer & Game Show Music ---
let actx = null, muted = false, lastPlayers = 0, lastPhase = '', lastTickSec = -1, lastQIdx = -1;
let bgmTimer = null, bgmStep = 0;

function ensureAudio(){
 if(!actx){const C = window.AudioContext || window.webkitAudioContext; if(C) actx = new C();}
 if(actx && actx.state === 'suspended') actx.resume();
 return actx;
}
window.addEventListener('pointerdown', ()=>ensureAudio(), {passive:true});

function playTone(freq, dur, type, vol, delay){
 if(muted || !actx) return;
 const run = ()=>{
  const t = actx.currentTime + (delay||0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(vol || 0.3, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
 };
 if(actx.state === 'suspended') actx.resume().then(run); else run();
}
function tone(freq, dur, type='triangle', vol=0.32, delay=0){
 ensureAudio();
 playTone(freq, dur, type, vol, delay);
}
function toggleMute(){
 ensureAudio();
 muted = !muted;
 const b = document.getElementById('muteBtn'), st = document.getElementById('muteState');
 if(b) b.classList.toggle('on', !muted);
 if(st) st.textContent = muted ? 'Muted' : 'ON';
 if(!muted){ sfxJoin(); startBgmForPhase(); } else stopBgm();
}
function stopBgm(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; } }
function startLobbyBgm(){
 stopBgm();
 const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 392.00];
 bgmStep = 0;
 bgmTimer = setInterval(()=>{
  if(muted || (S.phase !== 'lobby' && S.phase !== 'icebreaker')) return;
  const f = notes[bgmStep++ % notes.length];
  tone(f, 0.22, 'triangle', 0.18, 0);
 }, 360);
}
function startQuestionBgm(){
 stopBgm();
 const bass = [220, 220, 261.63, 293.66, 329.63, 329.63, 293.66, 261.63];
 const lead = [440, 523.25, 659.25, 587.33, 659.25, 783.99, 659.25, 587.33];
 bgmStep = 0;
 bgmTimer = setInterval(()=>{
  if(muted || S.phase !== 'question' || S.paused) return;
  const i = bgmStep++ % bass.length;
  const urgent = (S.preview_left||0) <= 0 && S.left <= 5;
  const mult = urgent ? 1.122 : 1;
  tone(bass[i]*mult, 0.16, 'sawtooth', 0.14, 0);
  tone(lead[i]*mult, 0.18, 'triangle', 0.22, 0.15);
 }, 320);
}
function startBgmForPhase(){
 if(S.phase === 'lobby' || S.phase === 'icebreaker') startLobbyBgm();
 else if(S.phase === 'question') startQuestionBgm();
 else stopBgm();
}
function sfxJoin(){ tone(523.25, 0.12, 'triangle', 0.35, 0); tone(659.25, 0.18, 'triangle', 0.35, 0.09); }
function sfxQuestion(){ [440, 554.37, 659.25, 880].forEach((f,i)=>tone(f, 0.18, 'triangle', 0.34, i*0.08)); }
function sfxTick(urgent){ tone(urgent ? 987.77 : 659.25, urgent ? 0.11 : 0.07, 'square', urgent ? 0.28 : 0.16); }
function sfxReveal(){ [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>tone(f, 0.26, 'triangle', 0.36, i*0.09)); }
function sfxBoard(){ [392, 523.25, 659.25, 783.99].forEach((f,i)=>tone(f, 0.2, 'triangle', 0.32, i*0.09)); }
function sfxPodium(){ [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f,i)=>tone(f, 0.35, 'triangle', 0.38, i*0.13)); }

// --- Confetti ---
let confParts = [], confAnim = null;
function startConfetti(){
 const c = document.getElementById('confetti');
 c.width = window.innerWidth; c.height = window.innerHeight;
 const ctx = c.getContext('2d');
 const cols = ['#ff2e63','#08d9d6','#ffde7d','#7dff6b','#ffffff','#ff9800'];
 confParts = Array.from({length: 130}, ()=>({
  x: Math.random()*c.width, y: -20 - Math.random()*c.height*0.5,
  vx: (Math.random()-0.5)*3, vy: 2.5 + Math.random()*4,
  s: 6 + Math.random()*7, col: cols[Math.floor(Math.random()*cols.length)],
  a: Math.random()*6.28, va: (Math.random()-0.5)*0.2
 }));
 const start = performance.now();
 if(confAnim) cancelAnimationFrame(confAnim);
 function loop(now){
  ctx.clearRect(0,0,c.width,c.height);
  confParts.forEach(p=>{
   p.x += p.vx; p.y += p.vy; p.a += p.va;
   ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
   ctx.fillStyle = p.col; ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.6);
   ctx.restore();
  });
  if(now - start < 7000) confAnim = requestAnimationFrame(loop);
  else ctx.clearRect(0,0,c.width,c.height);
 }
 confAnim = requestAnimationFrame(loop);
}

// --- Custom Quiz Builder / Uploader ---
function openQuizModal(){ document.getElementById('quizModal').classList.add('open'); }
function closeQuizModal(){ document.getElementById('quizModal').classList.remove('open'); document.getElementById('customErr').textContent=''; }
function loadCustomFile(ev){
 const f = ev.target.files && ev.target.files[0];
 if(!f) return;
 if(!document.getElementById('customTitle').value){
  document.getElementById('customTitle').value = f.name.replace(/\.(json|csv)$/i,'').replace(/[_-]+/g,' ');
 }
 const reader = new FileReader();
 reader.onload = () => { document.getElementById('customText').value = reader.result; };
 reader.readAsText(f);
}
function parseCustomQuestions(raw){
 const s = (raw||'').trim();
 if(!s) return [];
 if(s.startsWith('[') || s.startsWith('{')){
  const j = JSON.parse(s);
  return Array.isArray(j) ? j : (j.questions || []);
 }
 const blocks = s.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
 if(blocks.length === 1 && s.includes(',') && s.split('\n').length > 1){
  return s.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
   const p = line.split(',').map(x=>x.trim());
   if(p.length < 5 || p[0].toLowerCase()==='question') return null;
   return {q:p[0], a:p.slice(1,5), c:Math.max(0, (parseInt(p[5],10)||1)-1), quote:p[6]||''};
  }).filter(Boolean);
 }
 return blocks.map(b=>{
  const lines = b.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length < 3) return null;
  const q = lines[0];
  const a = [];
  let c = 0, quote = '', img = '';
  lines.slice(1).forEach(l=>{
   if(/^quote:/i.test(l)){ quote = l.replace(/^quote:\s*/i,''); }
   else if(/^image:/i.test(l)){ img = l.replace(/^image:\s*/i,''); }
   else if(a.length < 4){
    if(l.startsWith('*')){ c = a.length; a.push(l.slice(1).trim()); }
    else a.push(l);
   }
  });
  return {q, a, c, quote, img};
 }).filter(Boolean);
}
function getSavedCustomQuizzes(){
 try{ return JSON.parse(localStorage.getItem('brainrush_custom_quizzes') || '[]'); }catch(e){ return []; }
}
function storeCustomQuizLocal(item){
 try{
  const list = getSavedCustomQuizzes().filter(x=>x.file !== item.file);
  list.push(item);
  localStorage.setItem('brainrush_custom_quizzes', JSON.stringify(list));
 }catch(e){}
}
function mergeQuizLists(serverList){
 const map = new Map();
 (serverList||[]).forEach(q=>map.set(q.file, q));
 getSavedCustomQuizzes().forEach(q=>{ if(!map.has(q.file)) map.set(q.file, q); else map.get(q.file).questions = q.questions; });
 return Array.from(map.values());
}
function renderQuizSelect(selectedFile){
 const sel = document.getElementById('quizSel');
 if(!sel) return;
 sel.innerHTML = quizList.map(q=>`<option value="${esc(q.file)}">${esc(q.title)}</option>`).join('');
 if(selectedFile) sel.value = selectedFile;
 syncQuizCount();
}

async function saveCustomQuiz(){
 const title = document.getElementById('customTitle').value.trim() || 'Custom Quiz';
 const raw = document.getElementById('customText').value;
 try{
  const qs = parseCustomQuestions(raw);
  const r = await post('/api/upload_quiz', {title, questions: qs});
  if(r.error){ document.getElementById('customErr').textContent = r.error; return; }
  const savedQuestions = r.questions || qs;
  storeCustomQuizLocal({
   file: r.file,
   title: `${title} (${r.count} Qs)`,
   count: r.count,
   questions: savedQuestions
  });
  quizList = mergeQuizLists(r.quizzes || quizList);
  renderQuizSelect(r.file);
  closeQuizModal();
 }catch(e){
  document.getElementById('customErr').textContent = 'Could not parse questions: ' + e.message;
 }
}

 pin=r.pin;host=r.host;

async function poll(){

function handleAudio(){
 if(S.phase === 'lobby' && S.n > lastPlayers){ sfxJoin(); }
 lastPlayers = S.n || 0;
 if(S.phase !== lastPhase || (S.phase === 'question' && S.index !== lastQIdx)){
  lastPhase = S.phase;
  lastQIdx = S.index;
  startBgmForPhase();
  if(S.phase === 'icebreaker'){ speak(S.prompt); }
  else if(S.phase === 'question'){ sfxQuestion(); lastTickSec = -1; speak(S.question); }
  else if(S.phase === 'results'){
   sfxReveal();
   const winAns = (S.answers||[])[S.correct] || '';
   speak('Correct answer: ' + winAns);
  }
  else if(S.phase === 'board'){
   sfxBoard();
   if(S.board && S.board[0]) speak(S.board[0].name + ' is in the lead!');
  }
  else if(S.phase === 'final'){
   sfxPodium(); startConfetti();
   if(S.board && S.board[0]) speak('Congratulations to our winner, ' + S.board[0].name + '!');
  }
 }
 if(S.phase === 'question' && !S.paused && (S.preview_left || 0) <= 0){
  const sec = Math.ceil(S.left);
  if(sec > 0 && sec !== lastTickSec){
   lastTickSec = sec;
   sfxTick(sec <= 5);
  }
 }
}

function teamStandingsHtml(){
 if(!S.teams_enabled || !S.team_board || !S.team_board.length) return '';
 return `<div class="team-grid">${S.team_board.map((t,i)=>`<div class="team-card" style="background:${t.color}">${i===0?'👑 ':''}${t.emoji} ${esc(t.name)}<small>${t.avg} avg pts (${t.members})</small></div>`).join('')}</div>`;
}

function board(b){return b.map((x,i)=>`<div class="row"><span>${i+1}. ${x.team_emoji?x.team_emoji+' ':''}${esc((x.avatar?x.avatar+' ':'')+x.name)}${x.streak>=2?`<span class="streak">🔥${x.streak}</span>`:''}${x.frozen_next?' ❄️':''}</span><b>${x.score}</b></div>`).join('')}

let animDone = -1;
function animBoard(b, qIdx){
 const H = 41, first = animDone !== qIdx && qIdx > 0;
 const prevOrder = [...b].sort((a,c)=>(a.prev_rank||99)-(c.prev_rank||99));
 const prevPos = new Map(prevOrder.map((x,i)=>[x.name, i]));
 const rows = b.map((x,i)=>{
  const pIdx = first ? (prevPos.get(x.name) ?? i) : i;
  const sc = first ? (x.prev ?? x.score) : x.score;
  const rk = first ? (pIdx + 1) : (i + 1);
  const diff = (x.prev_rank || (i+1)) - (i + 1);
  const arrow = qIdx > 0 && diff > 0 ? `<span class="shift up">▲${diff}</span>` : qIdx > 0 && diff < 0 ? `<span class="shift down">▼${-diff}</span>` : '';
  const streak = x.streak >= 2 ? `<span class="streak">🔥${x.streak}</span>` : '';
  const ice = x.frozen_next ? ` <span title="Frozen for next question!">❄️</span>` : '';
  const gain = x.gained !== 0 ? `<span class="gain ${first?'':'show'}">${x.gained>0?'+'+x.gained:x.gained}</span>` : '';
  const label = (x.team_emoji ? x.team_emoji + ' ' : '') + esc((x.avatar ? x.avatar + ' ' : '') + x.name);
  return `<div class="row" data-idx="${i}" data-prev="${sc}" data-score="${x.score}" data-diff="${diff}" style="transform:translateY(${pIdx*H}px)"><span><b class="rk">${rk}</b>. ${label}${streak}${ice}${arrow}</span><span>${gain}<b class="sc">${sc}</b></span></div>`;
 }).join('');
 if(first){
  animDone = qIdx;
  setTimeout(()=>{
   const els = document.querySelectorAll('.board-wrap .row');
   els.forEach(el=>{
    const i = +el.dataset.idx, diff = +el.dataset.diff, p = +el.dataset.prev, s = +el.dataset.score;
    el.style.transform = `translateY(${i*H}px)`;
    if(diff > 0) el.classList.add('moved-up');
    el.querySelector('.rk').textContent = i + 1;
    const g = el.querySelector('.gain'); if(g) g.classList.add('show');
    const scEl = el.querySelector('.sc');
    if(s !== p){
     const t0 = performance.now(), dur = 750;
     const step = now => {
      const k = Math.min(1, (now - t0) / dur);
      scEl.textContent = Math.round(p + (s - p) * k);
      if(k < 1) requestAnimationFrame(step);
     };
     requestAnimationFrame(step);
    }
   });
  }, 450);
 } else if(animDone !== qIdx){
  animDone = qIdx;
 }
 return `<div class="board-wrap" style="height:${b.length*H}px">${rows}</div>`;
}

let podiumShown = false;
function renderFinal(b){
 const p1 = b[0], p2 = b[1], p3 = b[2];
 const podSlot = (p, place, medal) => p ? `<div class="pod pod-${place} ${podiumShown?'show':''}" id="pod${place}">
  <div class="pod-name">${p.team_emoji?p.team_emoji+' ':''}${esc((p.avatar?p.avatar+' ':'')+p.name)}</div>
  <div class="pod-score">${p.score} pts</div>
  <div class="pod-bar">${medal}</div>
 </div>` : '';
 const podiumHtml = `<div class="podium">${podSlot(p2,2,'🥈')}${podSlot(p1,1,'🥇')}${podSlot(p3,3,'🥉')}</div>`;
 if(!podiumShown){
  podiumShown = true;
  setTimeout(()=>{const e=document.getElementById('pod3');if(e)e.classList.add('show')}, 350);
  setTimeout(()=>{const e=document.getElementById('pod2');if(e)e.classList.add('show')}, 1150);
  setTimeout(()=>{const e=document.getElementById('pod1');if(e)e.classList.add('show')}, 1950);
 }
 const rest = b.slice(3);
 const st = S.stats || {};
 const accHtml = st.possible ? `<div class="acc-pill">🎯 Group Accuracy: ${st.accuracy}% (${st.correct}/${st.possible} correct)</div>` : '';
 const awHtml = (st.awards && st.awards.length) ? `<div class="awards">${st.awards.map(a=>`<div class="award"><b>${esc(a.title)}</b>${esc(a.winner)} <small>(${esc(a.detail)})</small></div>`).join('')}</div>` : '';
 const toughHtml = (st.tough && st.tough.length) ? `<div class="tough-box"><h3>🧠 Tough Ones Recap (Most Missed)</h3>${st.tough.map(t=>`<div class="tough-item"><b>Q${t.index}${t.redemption?' (Redemption)':''} (${t.pct}% correct):</b> ${esc(t.q)}<br><span style="color:#7dff6b">✅ ${esc(t.ans)}</span></div>`).join('')}</div>` : '';
 return `<h1>🏆 Final Podium</h1>${accHtml}${teamStandingsHtml()}${podiumHtml}${awHtml}${toughHtml}${rest.length?'<h2>Runners-up</h2>'+board(rest):''}
 <div>
  <a href="/api/export?pin=${pin}" download="brainrush_${pin}_results.csv"><button class="btn-sec">📥 Download Results (CSV)</button></a>
  <button onclick="location.reload()">New game</button>
 </div>`;
}

let last='';
function render(){
 const inPrev = S.phase==='question' && (S.preview_left||0) > 0;
 const k = S.phase==='question'
  ? `q:${S.index}:${inPrev?1:0}`
  : JSON.stringify({...S,left:0,qtime:0,answered:0,preview_left:0,auto_left:0,reactions:null});
 if(k==last){
  const t=document.getElementById('t');
  if(t){
   const sec = Math.ceil(S.left);
   t.textContent = S.paused ? '⏸️ ' + sec : sec;
   t.classList.toggle('urgent', !S.paused && sec <= 5);
   t.classList.toggle('paused', !!S.paused);
  }
  const pb=document.getElementById('pauseBtn');
  if(pb) pb.textContent = S.paused ? '▶️ Resume' : '⏸️ Pause';
  const ac=document.getElementById('ansCnt');
  if(ac) ac.textContent = `${S.answered}/${S.n}`;
  const pf=document.getElementById('pf');
  if(pf) pf.style.width = Math.min(100, ((S.preview_left||0)/(S.preview_total||5))*100)+'%';
  const ab=document.getElementById('autoNextLbl');
  if(ab && S.auto_left != null) ab.textContent = ` (${S.auto_left}s)`;
  return;
 }
 last=k;
 const autoSuffix = S.auto && S.auto_left != null ? `<span id="autoNextLbl"> (${S.auto_left}s)</span>` : '';
 const imgHtml = S.img ? `<img class="q-img" src="${esc(S.img)}" alt="">` : '';
 if(S.phase=='lobby')$.innerHTML=`<h1>Join at <a class="join-link" href="/play?pin=${pin}" target="_blank">plw.me/play</a> with PIN</h1><div class="lobby-box"><div class="pin">${pin}</div>${QR}</div>
  <p>${S.n} player(s)</p>${teamStandingsHtml()}<div class="names">${S.names.map(n=>`<span>${esc(n)}</span>`).join('')}</div>
  <div><button class="btn-sec" onclick="addBots(5)">🤖 +5 Phantom players</button>${S.n?'<button onclick="next()">Start</button>':''}</div>`;
 else if(S.phase=='icebreaker'){
  const cols = ['#e21b3c','#1368ce','#d89e00','#26890c','#9c27b0','#00897b'];
  const words = S.words || [];
  const cloud = words.length ? words.map((w,i)=>{
   const sz = Math.min(2.6, 1.15 + (w.count - 1)*0.35);
   return `<span class="word-tag" style="font-size:${sz}em;background:${cols[i%cols.length]}">${esc(w.text)}${w.count>1?` <small>(${w.count})</small>`:''}</span>`;
  }).join('') : `<p style="opacity:.7;font-size:1.3em">Waiting for players to type a word on their phones…</p>`;
  $.innerHTML=`<div class="double-banner">💭 LIVE WORD CLOUD WARM-UP</div>
  <h1>${esc(S.prompt)} <button class="btn-sm" style="font-size:.42em;vertical-align:middle" onclick="editIcePrompt()">✏️ Edit</button></h1>
  <p>${S.word_total||0} response(s)</p>
  <div class="word-cloud">${cloud}</div>
  <button onclick="next()">Start Question 1 ➔</button>`;
 } else if(S.phase=='question'){
  const sec = Math.ceil(S.left);
  const pct = Math.min(100, ((S.preview_left||0)/(S.preview_total||5))*100);
  const badges = `${S.redemption?'<div class="redemp-banner">🔄 REDEMPTION QUESTION (MOST MISSED!) 🔄</div>':''}${S.boss?'<div class="double-banner">🎰 FINAL BOSS WAGER! 🎰</div>':S.double?'<div class="double-banner">⚡ DOUBLE POINTS! ⚡</div>':''}`;
  if(inPrev){
   $.innerHTML=`<p>Question ${S.index+1}/${S.total}</p>
   <div class="q-stage">
    <div>${badges}</div>
    <h1>${esc(S.question)}</h1>
    ${imgHtml}
    <div class="preview-box" style="width:100%">
     <div class="preview-label">${S.boss?'🎰 Place your wagers & read the question…':'👀 Read the question…'}</div>
     <div class="preview-bar"><div class="preview-fill" id="pf" style="width:${pct}%"></div></div>
    </div>
   </div>`;
  } else {
   $.innerHTML=`<p>Question ${S.index+1}/${S.total} &middot; <span id="ansCnt">${S.answered}/${S.n}</span> answered</p>
   <div>${badges}</div>
   <h1>${esc(S.question)}</h1>
   ${imgHtml}
   <div class="ans-reveal">
    <div class="timer-row">
     <button class="btn-sm" id="pauseBtn" onclick="hostCtl('pause')">${S.paused?'▶️ Resume':'⏸️ Pause'}</button>
     <div class="timer ${!S.paused&&sec<=5?'urgent':''} ${S.paused?'paused':''}" id="t">${S.paused?'⏸️ '+sec:sec}</div>
     <button class="btn-sm" onclick="hostCtl('add_time',10)">+10s</button>
    </div>
    <div class="grid">${S.answers.map((a,i)=>`<div class="a c${i}">${sh[i]}${esc(a)}</div>`).join('')}</div>
    <button onclick="next()">Skip</button>
   </div>`;
  }
 } else if(S.phase=='results'){
  const ci = S.correct;
  const tot = Math.max(1, (S.counts||[]).reduce((a,b)=>a+b, 0));
  $.innerHTML=`<p style="margin:.2em 0">Question ${S.index+1}/${S.total} &middot; ${S.answered}/${S.n} answered</p>
  <h2 style="margin:.15em auto .3em;max-width:880px;font-size:1.7em;line-height:1.25">${esc(S.question)}</h2>
  <div class="ans-reveal">
   <div class="grid" style="margin-top:10px">${S.answers.map((a,i)=>{
    const cnt = (S.counts&&S.counts[i])||0;
    const pct = Math.round((cnt / tot) * 100);
    const win = i===ci;
    return `<div class="a res c${i} ${win?'win':'dim'}">
     <div class="a-fill" style="width:${pct}%"></div>
     <span class="a-txt">${sh[i]}${esc(a)}</span>
     <span class="a-cnt">${cnt}${win?' ✓':''}</span>
    </div>`;
   }).join('')}</div>
   ${S.quote?quoteBox():''}
   <div><button style="margin-top:14px" onclick="next()">${S.is_last?'🏆 Final Podium':'Top players'}${autoSuffix}</button></div>
  </div>`;
 } else if(S.phase=='board'){
  const shHtml = (S.shoutouts&&S.shoutouts.length)?`<div class="shouts">${S.shoutouts.map(s=>`<span class="shout">${esc(s)}</span>`).join('')}</div>`:'';
  $.innerHTML=`<p style="margin:0;opacity:.85">After question ${S.index+1}/${S.total}</p><h1 style="margin:.12em 0 .2em">🏆 Top players</h1>${teamStandingsHtml()}${shHtml}${animBoard(S.board,S.index)}
  <button style="margin-top:12px" onclick="next()">${S.index+1>=S.total?'Final results':'Next question'}${autoSuffix}</button>`;
 } else $.innerHTML=renderFinal(S.board);
}
</script></body></html>
