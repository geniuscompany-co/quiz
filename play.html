<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join Quiz</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#46178f;color:#fff;text-align:center;min-height:100vh}
#app{padding:16px;max-width:500px;margin:auto}
input{display:block;width:100%;box-sizing:border-box;font-size:1.4em;padding:14px;margin:10px 0;border-radius:6px;border:0;text-align:center}
button.go{width:100%;font-size:1.4em;padding:14px;border:0;border-radius:6px;background:#26890c;color:#fff;font-weight:700;cursor:pointer}
.avatars{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}
.av{font-size:1.7em;padding:6px 10px;border-radius:10px;background:#fff2;border:2px solid transparent;cursor:pointer;user-select:none}
.av.sel{background:#fff4;border-color:#ffdf5d;transform:scale(1.12)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tm{padding:10px;border-radius:8px;background:#fff2;border:2px solid transparent;cursor:pointer;font-weight:700;font-size:.95em;user-select:none}
.tm.sel{border-color:#ffdf5d;background:#fff4;transform:scale(1.03)}
.pu-bar{display:flex;justify-content:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.pu-btn{flex:1;min-width:74px;padding:9px 6px;border:2px solid #fff6;border-radius:99px;background:#fff2;color:#fff;font-size:.86em;font-weight:800;cursor:pointer}
.pu-btn.active{background:linear-gradient(90deg,#ff9800,#ffd600);color:#2b0d57;border-color:#fff}
.pu-btn:disabled{opacity:.35;cursor:default;text-decoration:line-through}
.conf-btn{width:100%;padding:9px 14px;margin-bottom:8px;border-radius:99px;border:2px solid #ffdf5d88;background:#0004;color:#ffdf5d;font-weight:800;font-size:.92em;cursor:pointer}
.conf-btn.on{background:linear-gradient(90deg,#ff6d00,#ffd600);color:#2b0d57;border-color:#fff;box-shadow:0 0 12px #ff980088}
.qnum{display:inline-block;background:#fff;color:#46178f;font-weight:900;font-size:.95em;padding:4px 16px;border-radius:99px;margin-bottom:8px}
.wheel-pill{display:inline-block;background:linear-gradient(90deg,#00c853,#00b0ff,#aa00ff);color:#fff;font-weight:900;padding:5px 14px;border-radius:99px;font-size:.86em;margin-bottom:6px;border:1px solid #fff8}
.rival-pill{display:inline-block;background:#0005;border:1px solid #fff4;color:#ffdf5d;font-size:.85em;padding:5px 14px;border-radius:99px;margin:6px 4px;font-weight:700}
.overtook-pill{display:inline-block;background:linear-gradient(90deg,#00c853,#64dd17);color:#0b3d0b;font-size:.9em;padding:5px 14px;border-radius:99px;margin:6px 4px;font-weight:900}
.title-badge{display:inline-block;background:#ffffff28;border:1px solid #fff6;color:#ffdf5d;font-size:.55em;padding:3px 12px;border-radius:99px;margin-top:6px;font-weight:800}
.aud-badge{background:#0006;padding:2px 10px;border-radius:99px;font-size:.85em;color:#ffdf5d;font-weight:900}
.sab-btn{margin-top:12px;padding:10px 18px;border-radius:99px;border:2px solid #80deea;background:#00acc155;color:#fff;font-weight:800;font-size:.95em;cursor:pointer}
.sab-btn:disabled{opacity:.4;cursor:default}
.ice-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#00b4dbdd,#0083b0ee);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;user-select:none;cursor:pointer}
.ice-overlay h1{font-size:2.4em;margin:.2em 0}
.ice-cube{font-size:5em;transition:transform .1s}
.ice-cube:active{transform:scale(.85)}
.wager-box{background:#0004;border:2px solid #ffdf5d;border-radius:12px;padding:12px;margin:10px 0}
.wager-btns{display:flex;gap:8px;margin-top:8px}
.wager-btn{flex:1;padding:10px;border-radius:8px;border:2px solid #fff5;background:#fff2;color:#fff;font-weight:800;font-size:1.05em;cursor:pointer}
.wager-btn.sel{background:#ffdf5d;color:#2b0d57;border-color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid button{min-height:28vh;padding:12px 10px;border:0;border-radius:10px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:1.15em;line-height:1.25;word-break:break-word}
.grid button .sh{font-size:2em;line-height:1}
.grid button.elim{opacity:.18;pointer-events:none;filter:grayscale(1)}
.c0{background:#e21b3c}.c1{background:#1368ce}.c2{background:#d89e00}.c3{background:#26890c}
.big{font-size:1.85em;margin-top:10vh}
.big:has(+blockquote){margin-top:4vh}
.streak-pill{display:inline-block;background:#ff6d00;color:#fff;font-size:.65em;padding:4px 14px;border-radius:99px;margin-top:8px;font-weight:800}
.double-pill{display:inline-block;background:linear-gradient(90deg,#ff9800,#ffd600);color:#2b0d57;font-weight:900;padding:4px 14px;border-radius:99px;font-size:.95em;margin-bottom:6px}
.underdog-pill{display:inline-block;background:linear-gradient(90deg,#00c853,#b2ff59);color:#1b5e20;font-weight:900;padding:4px 14px;border-radius:99px;font-size:.88em;margin-bottom:6px}
.react-bar{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.react-bar button{font-size:1.7em;background:#fff2;border:0;border-radius:99px;padding:8px 14px;cursor:pointer;transition:transform .12s}
.react-bar button:active{transform:scale(1.3)}
blockquote{background:#fff;color:#2b0d57;border-radius:10px;padding:14px 18px;margin:16px 0 0;font-style:italic;line-height:1.4;text-align:left}
blockquote cite{display:block;font-style:normal;font-size:.8em;margin-top:8px;opacity:.7}.err{color:#ffb3b3}
.trophy-card{background:linear-gradient(135deg,#ffd700,#ff9800);color:#2b0d57;border-radius:16px;padding:16px;margin:14px auto;max-width:360px;box-shadow:0 8px 24px #0006;font-weight:800}
.trophy-card.silver{background:linear-gradient(135deg,#f5f7fa,#b8c6db)}
.trophy-card.bronze{background:linear-gradient(135deg,#f3a683,#c47135);color:#fff}
.trophy-card button{margin-top:10px;padding:8px 16px;border-radius:99px;border:0;background:#2b0d57;color:#fff;font-weight:800;cursor:pointer}
.report-card{background:#fff2;border-radius:12px;padding:14px 16px;margin-top:16px;text-align:left;font-size:.95em}
.report-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-bottom:12px}
.stat-pill{background:#0004;padding:8px;border-radius:8px;font-weight:700}
.stat-pill b{display:block;font-size:1.25em;color:#ffdf5d}
.missed-item{border-top:1px solid #fff3;padding:8px 0;font-size:.92em}
.logo{max-width:260px;width:75%;border-radius:16px;margin:4px auto 12px;display:block;box-shadow:0 4px 16px #0004}

body.cb .c0{background:#D55E00}body.cb .c1{background:#0072B2}body.cb .c2{background:#F0E442;color:#222}body.cb .c3{background:#009E73}
body.hc{background:#000}body.hc .grid button{border:4px solid #fff}body.hc .pu-btn,body.hc .wager-btn{border-color:#fff}
#a11y{position:fixed;top:8px;right:8px;z-index:60;width:auto;font-size:.8em;padding:4px 10px;border-radius:99px;border:1px solid #fff5;background:#0006;color:#fff;cursor:pointer}
.hot-pill{display:inline-block;background:linear-gradient(90deg,#ff6d00,#ff1744);color:#fff;font-weight:900;padding:5px 14px;border-radius:99px;font-size:.85em;margin-bottom:6px;border:1px solid #fff8}
.hot-box{background:#0004;border:2px solid #ff6d00;border-radius:12px;padding:10px;margin:8px 0;font-size:.95em}
.team-pill{display:inline-block;background:linear-gradient(90deg,#1368ce,#00b0ff);color:#fff;font-weight:900;padding:5px 14px;border-radius:99px;font-size:.85em;margin-bottom:6px;border:1px solid #fff8}
.txtans{font-size:1.5em}
.slot{background:#fff3;border-radius:8px;padding:10px 14px;margin:5px 0;font-weight:800;text-align:left;font-size:1.05em}
.grid button img{max-height:80px;max-width:100%;border-radius:8px;background:#fff}
.rosterSel{display:block;width:100%;box-sizing:border-box;font-size:1.3em;padding:14px;margin:10px 0;border-radius:6px;border:0;text-align:center;color:#2b0d57;background:#fff}
.plink{display:inline-block;margin-top:10px;color:#fff;font-size:.95em}

.avatars{max-height:150px;overflow-y:auto;padding:4px}
.cust{margin:8px 0}.swatches{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw.sel{border-color:#ffdf5d;transform:scale(1.15)}
.tagsel{display:block;width:100%;box-sizing:border-box;font-size:1.05em;padding:10px;margin:6px 0;border-radius:6px;border:0;color:#2b0d57;background:#fff;text-align:center}
.cust input{font-size:1.05em;padding:10px}
.don-btn{width:100%;padding:10px 14px;margin-bottom:8px;border-radius:99px;border:2px solid #ff4081aa;background:#0004;color:#ff80ab;font-weight:800;font-size:.92em;cursor:pointer}
.don-btn.on{background:linear-gradient(90deg,#d500f9,#ff1744);color:#fff;border-color:#fff;box-shadow:0 0 12px #ff174488}
.team-prompt{background:#1368ce55;border:2px solid #1368ce;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:.92em;text-align:left}
.speed-pill{display:inline-block;background:linear-gradient(90deg,#00b8d4,#2979ff);color:#fff;font-weight:900;padding:5px 14px;border-radius:99px;font-size:.86em;margin-bottom:6px;border:1px solid #fff8}
.steal-box{background:#0004;border:2px solid #ffab40;border-radius:12px;padding:10px;margin:10px 0;font-size:.95em}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.6);z-index:80;background:linear-gradient(90deg,#ffd600,#ff9100);color:#2b0d57;font-weight:900;font-size:1.3em;padding:14px 22px;border-radius:16px;box-shadow:0 10px 30px #000a;opacity:0;pointer-events:none;text-align:center;max-width:86vw}
#toast.show{animation:toastin 2.4s ease forwards}
@keyframes toastin{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1.08)}20%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
#sfxBtn{position:fixed;top:8px;left:8px;z-index:60;width:auto;font-size:.8em;padding:4px 10px;border-radius:99px;border:1px solid #fff5;background:#0006;color:#fff;cursor:pointer}

.case-ph{text-align:left}
.case-body-ph p{font-size:1.02em;line-height:1.5;margin:.7em 0}
.role-card{background:#6a1b9a88;border:2px solid #ce93d8;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:.95em}
.exh-ph{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.exh-ph figure{margin:0;max-width:46%;text-align:center}.exh-ph img{max-width:100%;max-height:110px;border-radius:8px;background:#fff;object-fit:contain;cursor:zoom-in}
.exh-ph figcaption{font-size:.72em;opacity:.85}
.lens-pill{display:inline-block;background:#00bfa588;border:1px solid #1de9b6;border-radius:99px;padding:4px 14px;font-size:.55em;margin-top:8px;font-weight:800}
.resp-ph{background:#fff;color:#2b0d57;border-radius:10px;padding:10px 12px;margin:8px 0;text-align:left;font-weight:600;font-size:.95em}
.resp-ph button{margin-top:6px;padding:6px 14px;border-radius:99px;border:0;background:#26890c;color:#fff;font-weight:800;cursor:pointer}
.resp-ph button:disabled{opacity:.4}
.rk-list{background:#0004;border-radius:12px;padding:8px 14px;text-align:left;font-size:.95em;margin:10px 0}
.rk-list div{padding:4px 0;border-top:1px solid #fff2}.rk-list div:first-child{border-top:0}
#caseBtn{position:fixed;right:10px;bottom:10px;z-index:55;display:none;width:auto;margin:0;padding:10px 16px;border-radius:99px;border:2px solid #fff;background:#6a1b9a;color:#fff;font-weight:800;font-size:.95em;box-shadow:0 6px 18px #000a;cursor:pointer}
#caseOv{position:fixed;inset:0;background:#000d;z-index:90;display:none;overflow-y:auto;padding:14px}
#caseOv .card{max-width:520px;margin:0 auto;background:#2b0d57;border:2px solid #fff4;border-radius:14px;padding:14px 16px;text-align:left}
#caseOv .xbtn{float:right;width:auto;margin:0;padding:6px 14px;border-radius:99px;border:0;background:#e21b3c;color:#fff;font-weight:800}
#imgOv{position:fixed;inset:0;background:#000e;z-index:95;display:none;align-items:center;justify-content:center;padding:10px}
#imgOv img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
</style></head><body><button id="caseBtn" onclick="openCaseFile()">📁 Case file</button><div id="caseOv"></div><div id="imgOv" onclick="this.style.display='none'"><img id="imgBig" alt=""></div><button id="sfxBtn" onclick="toggleSfx()">🔊</button><canvas id="fx"></canvas><div id="toast"></div><button id="a11y" onclick="cycleA11y()" title="Accessibility">👁️</button><div id="app"></div>
<script>
let pin, pid, S = {}, avatar = '🦊', team = '';
let iceBrokenQ = -1, iceTaps = 0;
const AVS = ['🦊','🐼','🦁','🐸','🦄','🐙','🦖','🐝','🦋','🐧','🚀','⚡','🐶','🐱','🐯','🐵','🐨','🐰','🐻','🐮','🐷','🐔','🦉','🦅','🐺','🐴','🦓','🦒','🐘','🦏','🐢','🐍','🐊','🐬','🐳','🦈','🐠','🦀','🦞','🐌','🦜','🦩','🦥','🦦','🦔','🐲','👽','🤖','👾','🎃','🌟','🍕','🍩','⚽','🏀','🎮'];
const TEAMS = [
 {id:'', label:'🎲 Auto Team'},
 {id:'red', label:'🔴 Red Dragons'},
 {id:'blue', label:'🔵 Blue Sharks'},
 {id:'gold', label:'🟡 Gold Lions'},
 {id:'green', label:'🟢 Green Vipers'}
];
const REACTS = ['🔥','😂','😮','🎉','👏','❤️'];
const $ = document.getElementById('app'), sh = ["▲","◆","●","■"];
async function post(u,b){const r=await fetch(u,{method:'POST',body:JSON.stringify(b)});return {ok:r.ok,...await r.json()}}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pickAv(a){avatar=a;document.querySelectorAll('.av').forEach(el=>el.classList.toggle('sel',el.dataset.av===a))}
function pickTm(t){team=t;document.querySelectorAll('.tm').forEach(el=>el.classList.toggle('sel',el.dataset.tm===t))}

const urlPin = new URLSearchParams(location.search).get('pin') || '';

async function checkPinConfig(pinVal){
 try{
  const r = await (await fetch('/api/active' + (pinVal ? '?pin='+encodeURIComponent(pinVal) : ''))).json();
  const inp = document.getElementById('p');
  if(inp && !inp.value && r && r.pin) inp.value = r.pin;
  const tmBox = document.getElementById('teamBox');
   if(tmBox) tmBox.style.display = (r && r.teams) ? 'grid' : 'none';
   const nb = document.getElementById('nameBox');
   if(nb){
    const sig = (r && r.has_roster) ? 'R:' + JSON.stringify(r.roster) : 'T';
    if(nb.dataset.sig !== sig){
     nb.dataset.sig = sig;
     nb.innerHTML = (r && r.has_roster)
      ? `<select id="n" class="rosterSel"><option value="">— Pick your name —</option>${(r.roster||[]).map(x=>`<option>${esc(x)}</option>`).join('')}</select>`
      : `<input id="n" placeholder="Nickname" maxlength="16">`;
    }
   }
   if(r && r.logo){ const lg = document.querySelector('img.logo'); if(lg && lg.dataset.cl !== r.logo){ lg.dataset.cl = r.logo; lg.src = r.logo; } }
  }catch(e){}
}

let lastName = '', nameColor = '', ctag = '';
function form(err, canReclaim){
 const savedPin = urlPin || pin || '';
 $.innerHTML=`<img class="logo" src="/logo.jpg?v=2" alt="Brainrush!" onerror="this.outerHTML='<h1 style=&quot;font-size:2.4em;margin:.3em 0&quot;>🧠 Brainrush!</h1>'"><h1>Join game</h1>
 <input id="p" placeholder="Game PIN" inputmode="numeric" value="${esc(savedPin)}" oninput="if(this.value.length===6)checkPinConfig(this.value)">
 <div id="nameBox" data-sig="T"><input id="n" placeholder="Nickname" maxlength="16" value="${esc(lastName)}"></div>
 <div class="avatars">${AVS.map(a=>`<span class="av ${a===avatar?'sel':''}" data-av="${a}" onclick="pickAv('${a}')">${a}</span>`).join('')}</div>
 ${custHtml()}<div class="teams" id="teamBox" style="display:none">${TEAMS.slice(1).map(t=>`<div class="tm ${t.id===team?'sel':''}" data-tm="${t.id}" onclick="pickTm('${t.id}')">${t.label}</div>`).join('')}</div>
 <button class="go" onclick="join()">Enter</button>${canReclaim?'<button class="go" style="background:#1368ce;margin-top:8px" onclick="join(true)">🔁 Rejoin as this name</button>':''}<p class="err">${err||''}</p>
  <a class="plink" href="#" onclick="join(true);return false" style="margin-right:14px">Lost your place? Rejoin →</a><a class="plink" href="/practice">🧑‍🎓 Practice on your own →</a>`;
 checkPinConfig(savedPin);
}

const COLORS = ['#ffffff','#ff6b6b','#ffd166','#7bed9f','#70a1ff','#ff9ff3','#a29bfe','#ffa502','#2ed573','#1e90ff'];
const TITLES = ['','The Brain','Quiz Wizard','Speed Demon','Chaos Agent','Snack Lord','Night Owl','Hot Streak','Underdog','Big Mood','Mr Cool','Dino Fan'];
function custHtml(){
 return `<div class="cust"><div class="swatches">${COLORS.map(c=>`<span class="sw ${c===nameColor?'sel':''}" style="background:${c}" onclick="pickColor('${c}')"></span>`).join('')}</div>
 <select id="ctagSel" class="tagsel" onchange="ctag=this.value;document.getElementById('ctagCustom').value=''">${TITLES.map(t=>`<option value="${t}" ${t===ctag?'selected':''}>${t||'— Pick a title (optional) —'}</option>`).join('')}</select>
 <input id="ctagCustom" placeholder="…or type your own title (max 14)" maxlength="14" oninput="ctag=this.value;document.getElementById('ctagSel').value=''"></div>`;
}
function pickColor(c){ nameColor = c; document.querySelectorAll('.sw').forEach(el=>el.classList.toggle('sel', el.style.background.replace(/\s/g,'')===hexToRgb(c))); }
function hexToRgb(h){ const n=parseInt(h.slice(1),16); return `rgb(${n>>16},${(n>>8)&255},${n&255})`; }
try{ const sv = JSON.parse(localStorage.getItem('brainrush_cust')||'null'); if(sv){ if(sv.avatar) avatar = sv.avatar; nameColor = sv.color||''; ctag = sv.ctag||''; } }catch(e){}

async function join(reclaim){
  pin = p.value.trim();
  lastName = (document.getElementById('n')||{}).value || '';
  const ct = ((document.getElementById('ctagCustom')||{}).value || ctag || '').slice(0,14);
  const r = await post('/api/join', {pin, name:lastName, avatar, team, color:nameColor, ctag:ct, reclaim:!!reclaim});
  if(!r.ok) return form(r.error, r.can_reclaim);
  pid = r.pid;
  try{ localStorage.setItem('brainrush_session', JSON.stringify({pin, pid})); localStorage.setItem('brainrush_cust', JSON.stringify({avatar, color:nameColor, ctag:ct})); }catch(e){}
  unlockAudio();
  poll(); setInterval(poll,600);
}

async function tryReconnect(){
 try{
  const raw = localStorage.getItem('brainrush_session');
  if(!raw) return form();
  const s = JSON.parse(raw);
  if(!s.pin || !s.pid) return form();
  if(urlPin && urlPin !== s.pin) return form();
  const r = await fetch(`/api/state?pin=${s.pin}&pid=${s.pid}`);
  if(!r.ok) return form();
  const st = await r.json();
  if(st && (st.me || st.pending) && st.phase !== 'final'){
   pin = s.pin; pid = s.pid; S = st;
   render(); setInterval(poll, 600);
   return;
  }
 }catch(e){}
 form();
}

async function sendWord(){
 const inp = document.getElementById('iceInp');
 if(!inp || !inp.value.trim()) return;
 await post('/api/word',{pin,pid,word:inp.value.trim()});
 poll();
}
async function ans(c){await post('/api/answer',{pin,pid,choice:c});poll()}
async function usePu(kind){await post('/api/powerup',{pin,pid,kind});poll()}
async function setWager(pct){await post('/api/wager',{pin,pid,pct});poll()}
async function toggleConf(){await post('/api/confident',{pin,pid});poll()}
async function sabotage(){await post('/api/sabotage',{pin,pid});poll()}
async function predict(g){await post('/api/predict',{pin,pid,guess:g});poll()}
async function sendText(){
 const e=document.getElementById('txtAns'); if(!e||!e.value.trim()) return;
 await post('/api/answer',{pin,pid,text:e.value.trim()}); poll();
}
let ordSel=[], ordIdx=-1;
function drawOrd(){
 const el=document.getElementById('ordWrap'); if(!el) return;
 const d=S.answers||[];
 el.innerHTML=`<p style="margin:6px 0">${S.qtype==='rank'?'Tap in <b>your order</b>, most important first:':'Tap the items in the <b>correct order</b>:'}</p>`+
  ordSel.map((j,n)=>`<div class="slot">${n+1}. ${esc(d[j])}</div>`).join('')+
  `<div class="grid">${d.map((a,j)=>ordSel.includes(j)?'':`<button class="c${j}" style="min-height:11vh" onclick="tapOrd(${j})"><span>${esc(a)}</span></button>`).join('')}</div>`+
  `<div style="margin-top:8px">${ordSel.length?`<button class="pu-btn" style="width:auto;padding:8px 18px" onclick="ordSel.pop();drawOrd()">↩ Undo</button>`:''}</div>`+
  (ordSel.length===d.length?`<button class="go" style="margin-top:8px" onclick="submitOrd()">Submit order</button>`:'');

   $.innerHTML=`${iceHtml}${whl}${dbl}${udog}${hot}${teamP}${donUi}${wagerUi}${(S.case||S.case_game)?'':puBar}${inputUi}`;
   if(t==='order' || t==='rank') drawOrd();
  }
 } else if(S.phase=='results' && S.case && !(m.spectating)){
  $.innerHTML = caseResultPhone(m);
 } else if(S.phase=='results'){
  if(m.spectating){
   $.innerHTML=`<div class="big">⚔️ Tiebreaker results<br><small>See the big screen!</small></div>${reactBar()}`;
  } else {
  const st = m.streak >= 5 ? `<br><span class="streak-pill">🔥🔥 ${m.streak} in a row! ON FIRE ${m.bonus?`(+${m.bonus} bonus)`:''}</span>` : m.streak >= 2 ? `<br><span class="streak-pill">🔥 ${m.streak} in a row! ${m.bonus?`(+${m.bonus} bonus)`:''}</span>` : '';
  const whMsg = m.wheel_bonus ? `<br><small style="color:#b2ff59">🎡 Mystery Wheel Bonus: +${m.wheel_bonus} pts!</small>` : '';
  const cfMsg = m.conf_delta ? `<br><small style="color:${m.conf_delta>0?'#ffdf5d':'#ff9b9b'}">🔥 Confidence Bet: ${m.conf_delta>0?'+'+m.conf_delta:m.conf_delta} pts</small>` : '';
  const tbMsg = m.team_bonus ? `<br><small style="color:#7dd3ff">🤝 Team Battle bonus: +${m.team_bonus}</small>` : '';
  let hotMsg = '';
  if(m.hot){
   if(m.hot.you) hotMsg = `<br><small style="color:#ffab40">🔥 Hot Seat: ${m.hot.ok?'You nailed it! +400':'you missed it'}</small>`;
   else if(m.hot.pred===null||m.hot.pred===undefined) hotMsg = `<br><small style="opacity:.8">🔥 You skipped the Hot Seat prediction</small>`;
   else hotMsg = `<br><small style="color:#ffab40">🔥 Hot Seat prediction: ${m.hot.pred===m.hot.ok?'🎯 great read! +200':'not this time'}</small>`;
  }
  const reveal = (S.qtype==='text'||S.qtype==='order') ? `<br><small style="opacity:.9">✅ Answer: ${esc(S.qtype==='order'?(S.answers_correct||[]).join(' → '):(S.answers_correct||[''])[0])}</small>` : '';
  const shMsg = (!m.correct && m.shielded) ? `<br><small style="color:#80deea">🛡️ Streak Shield protected your streak &amp; bets!</small>` : '';
  const gTxt = m.gained >= 0 ? '+'+m.gained : m.gained;
  const canSab = S.sabotage_enabled && !S.is_last && m.pu_freeze && m.score >= 200 && S.n > 1;
  const sabBtn = canSab ? `<div><button class="sab-btn" onclick="sabotage()">⛄ Throw Snowball at Leader (-200 pts)</button></div>` : m.ice_sent ? `<div><small style="color:#80deea">⛄ Snowball thrown at the leader for next round!</small></div>` : '';
  $.innerHTML=`<div><span class="qnum">Question ${S.index+1} of ${S.total}</span></div><div class="big" style="margin-top:4vh">${!m.answered?"⏰ Time's up":m.correct?'✅ Correct! '+gTxt:'❌ Incorrect'+(m.gained<0?' ('+m.gained+')':'')}${st}${whMsg}${cfMsg}${tbMsg}${hotMsg}${shMsg}${reveal}<br><small>Score ${m.score}</small></div>${rivalHtml(m)}${sabBtn}${stealUi(m)}${S.quote?`<blockquote>&ldquo;${esc(S.quote)}&rdquo;${S.source?`<cite>&mdash; ${esc(S.source)}</cite>`:''}</blockquote>`:''}${reactBar()}`;
  }
 } else if(S.phase=='board'){
  const canSab = S.sabotage_enabled && m.pu_freeze && m.score >= 200 && S.n > 1;
  const sabBtn = canSab ? `<div><button class="sab-btn" onclick="sabotage()">⛄ Throw Snowball at Leader (-200 pts)</button></div>` : m.ice_sent ? `<div><small style="color:#80deea">⛄ Snowball thrown at the leader for next round!</small></div>` : '';
  const ttlBadge = m.title ? `<br><span class="title-badge">${esc(m.title)}</span>` : '';
  $.innerHTML=`<div class="big">🏆 You're #${m.rank}<br><small>${m.score} points</small>${ttlBadge}${m.streak>=2?`<br><span class="streak-pill">🔥 ${m.streak} Streak</span>`:''}</div>${rivalHtml(m)}${sabBtn}${reactBar()}`;
 } else {
  const rep = m.report || {};
  const tClass = m.rank===1?'':m.rank===2?'silver':m.rank===3?'bronze':'';
  const trophyHtml = m.rank <= 3 ? `<div class="trophy-card ${tClass}">
   <div style="font-size:2em">${m.rank===1?'🥇 1st Place Champion!':m.rank===2?'🥈 2nd Place Podium!':'🥉 3rd Place Podium!'}</div>
   <div>${tag} &middot; ${m.score} pts</div>
   <button onclick="saveCert('${esc(m.name)}',${m.rank},${m.score},${rep.accuracy||0})">🏅 Save Winner Certificate</button>
  </div>` : '';
  const missedHtml = (rep.missed && rep.missed.length) ? `<div style="margin-top:8px"><b>📝 Questions to Review:</b>${rep.missed.map(x=>`<div class="missed-item"><b>Q${x.num}:</b> ${esc(x.q)}<br><span style="color:#ff9b9b">You: ${esc(x.your_ans)}</span> &middot; <span style="color:#7dff6b">✅ ${esc(x.correct_ans)}</span></div>`).join('')}</div>` : `<div style="text-align:center;color:#7dff6b;font-weight:800">🌟 Perfect Score! You got every question right!</div>`;
  const repHtml = rep.total ? `<div class="report-card">
   <div class="report-stats">
    <div class="stat-pill"><b>${rep.accuracy}%</b>${rep.correct}/${rep.total} Correct</div>
    <div class="stat-pill"><b>🔥 ${rep.max_streak||0}</b>Best Streak</div>
    <div class="stat-pill"><b>${rep.fastest!=null?rep.fastest+'s':'-'}</b>Fastest</div>
   </div>
   ${missedHtml}
  </div>` : '';
  $.innerHTML=`<div class="big" style="margin-top:3vh">🎉 Game over!<br>You placed #${m.rank}<br><small>${m.score} points</small></div>${trophyHtml}${repHtml}${reactBar()}`;
 }
}
tryReconnect();
</script></body></html>
