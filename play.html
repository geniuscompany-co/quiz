<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brainrush! — Play</title>
<style>
:root{
  --bg1:#6827d6;
  --bg2:#46178f;
  --bg3:#23094d;
  --surface:rgba(255,255,255,.11);
  --surface-strong:rgba(20,6,46,.52);
  --border:rgba(255,255,255,.20);
  --gold:#ffdf5d;
  --green:#26890c;
  --green-bright:#69f0ae;
  --ink:#2b0d57;
  --radius:16px;
  --radius-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100vh;min-height:100dvh}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at 50% -12%,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%) fixed;
  color:#fff;
  text-align:center;
  display:flex;
  flex-direction:column;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}

/* --- Top Mobile HUD --- */
#topHud{
  position:sticky;
  top:0;
  z-index:55;
  width:100%;
  background:rgba(22,7,50,.78);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.14);
}
.hud-inner{
  max-width:540px;
  margin:0 auto;
  padding:7px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:46px;
}
.hud-left,.hud-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hud-btn{
  width:auto;
  margin:0;
  padding:5px 10px;
  font-size:.82em;
  font-weight:800;
  border-radius:99px;
  border:1px solid rgba(255,255,255,.26);
  background:rgba(255,255,255,.12);
  color:#fff;
  cursor:pointer;
  line-height:1.2;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.hud-btn:active{transform:scale(.95)}
#caseBtn{
  display:none;
  background:linear-gradient(135deg,#8e24aa,#5e35b1);
  border-color:rgba(255,255,255,.55);
  box-shadow:0 2px 10px rgba(0,0,0,.35);
}
.hud-me{
  display:none;
  align-items:center;
  gap:6px;
  background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.16);
  border-radius:99px;
  padding:3px 10px;
  font-size:.82em;
  font-weight:800;
  min-width:0;
  max-width:210px;
}
.hud-me .hm-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-me .hm-score{color:var(--gold);white-space:nowrap}
.hud-me .hm-rank{background:rgba(255,255,255,.18);padding:1px 6px;border-radius:99px;font-size:.88em}

/* --- Smooth Live Timer Bar --- */
#timerStrip{
  display:none;
  max-width:540px;
  width:100%;
  margin:0 auto;
  padding:0 12px 7px;
  align-items:center;
  gap:8px;
}
.ts-track{
  flex:1;
  height:8px;
  background:rgba(255,255,255,.18);
  border-radius:99px;
  overflow:hidden;
}
.ts-fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#69f0ae,#ffdf5d);
  border-radius:99px;
  transition:width .12s linear,background .25s ease;
}
.ts-fill.urgent{background:linear-gradient(90deg,#ff1744,#ff9100)}
.ts-fill.preview{background:linear-gradient(90deg,#00e5ff,#ffdf5d)}
.ts-lbl{
  font-size:.78em;
  font-weight:900;
  min-width:62px;
  text-align:right;
  color:var(--gold);
  white-space:nowrap;
}
.ts-lbl.urgent{color:#ff8a80}

/* --- App Container --- */
#app{
  flex:1;
  width:100%;
  max-width:540px;
  margin:0 auto;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
}

/* --- Cards & Surfaces --- */
.card-panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:0 10px 28px rgba(0,0,0,.24);
  backdrop-filter:blur(6px);
}
.brand-head{margin:2px 0 10px}
.logo{
  max-width:190px;
  max-height:84px;
  width:auto;
  border-radius:14px;
  margin:0 auto 6px;
  display:block;
  box-shadow:0 6px 18px rgba(0,0,0,.32);
  object-fit:contain;
}
.join-title{font-size:1.45em;font-weight:900;margin:0;letter-spacing:-.01em}
.join-sub{font-size:.88em;opacity:.82;margin:3px 0 0}

/* --- Inputs & Primary Buttons --- */
.field-lbl{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:.78em;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  opacity:.85;
  margin:8px 2px 4px;
}
.pin-ok{color:var(--green-bright);text-transform:none;letter-spacing:0}
input,select.rosterSel,select.tagsel{
  display:block;
  width:100%;
  font-size:1.22em;
  font-weight:800;
  padding:12px 14px;
  margin:0 0 8px;
  border-radius:var(--radius-sm);
  border:2px solid transparent;
  text-align:center;
  color:var(--ink);
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.16);
  font-family:inherit;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,223,93,.35);
}
#p{letter-spacing:3px;font-size:1.35em}
#p::placeholder{letter-spacing:normal;font-weight:700;opacity:.5}
input::placeholder{font-weight:650;opacity:.52}

button.go{
  width:100%;
  font-size:1.25em;
  padding:14px 18px;
  border:0;
  border-radius:13px;
  background:linear-gradient(180deg,#2fa80f,#217a0a);
  color:#fff;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 5px 0 #145205,0 8px 20px rgba(0,0,0,.28);
  transition:transform .08s,filter .15s;
  letter-spacing:.01em;
}
button.go:hover{filter:brightness(1.05)}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #145205,0 4px 10px rgba(0,0,0,.25)}
button.go.blue{
  background:linear-gradient(180deg,#1e7ae8,#1158b0);
  box-shadow:0 5px 0 #0a3975,0 8px 18px rgba(0,0,0,.26);
}

/* --- Progressive Customization Accordion on Join --- */
.cust-toggle{
  width:100%;
  margin:4px 0 10px;
  padding:9px 12px;
  border-radius:var(--radius-sm);
  border:1px solid rgba(255,255,255,.24);
  background:rgba(0,0,0,.24);
  color:#fff;
  font-size:.92em;
  font-weight:800;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.cust-preview{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.cust-drawer{
  display:none;
  background:rgba(0,0,0,.26);
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  padding:10px;
  margin:-2px 0 10px;
}
.cust-drawer.open{display:block}
.avatars{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  max-height:124px;
  overflow-y:auto;
  padding:4px;
  margin-bottom:8px;
}
.av{
  font-size:1.5em;
  padding:5px 8px;
  border-radius:10px;
  background:rgba(255,255,255,.12);
  border:2px solid transparent;
  cursor:pointer;
  user-select:none;
  transition:transform .12s,background .12s;
}
.av.sel{background:rgba(255,255,255,.28);border-color:var(--gold);transform:scale(1.1)}
.swatches{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:6px 0 8px}
.sw{width:27px;height:27px;border-radius:50%;border:3px solid rgba(255,255,255,.25);cursor:pointer;transition:transform .12s}
.sw.sel{border-color:var(--gold);transform:scale(1.16);box-shadow:0 0 10px rgba(255,223,93,.6)}
.tagsel{font-size:.98em;padding:9px 10px;margin:4px 0 6px}
.cust-drawer input{font-size:.98em;padding:9px 10px;margin:0}

.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}
.tm{
  padding:10px 8px;
  border-radius:10px;
  background:rgba(255,255,255,.13);
  border:2px solid rgba(255,255,255,.18);
  cursor:pointer;
  font-weight:800;
  font-size:.92em;
  user-select:none;
}
.tm.sel{border-color:var(--gold);background:rgba(255,255,255,.26);transform:scale(1.02)}

.join-links{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.plink{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:7px 13px;
  border-radius:99px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  text-decoration:none;
  font-size:.86em;
  font-weight:750;
}
.err{color:#ff9e9e;font-weight:800;font-size:.92em;margin:8px 0 0}
.err:empty{display:none}

/* --- Question Stage: Zero-Scroll Flex Budget --- */
.q-screen{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-height:0;
}
.chip-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:5px;
}
.qnum{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#fff;
  color:var(--bg2);
  font-weight:900;
  font-size:.84em;
  padding:4px 12px;
  border-radius:99px;
  box-shadow:0 2px 8px rgba(0,0,0,.22);
}
.wheel-pill,.double-pill,.underdog-pill,.hot-pill,.team-pill,.speed-pill,.streak-pill,.rival-pill,.overtook-pill,.lens-pill,.title-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  border-radius:99px;
  padding:4px 11px;
  font-size:.8em;
  font-weight:900;
  line-height:1.2;
}
.wheel-pill{background:linear-gradient(90deg,#00c853,#00b0ff,#aa00ff);color:#fff;border:1px solid rgba(255,255,255,.5)}
.double-pill{background:linear-gradient(90deg,#ff9800,#ffd600);color:var(--ink)}
.underdog-pill{background:linear-gradient(90deg,#00c853,#b2ff59);color:#0f3d13}
.hot-pill{background:linear-gradient(90deg,#ff6d00,#ff1744);color:#fff;border:1px solid rgba(255,255,255,.5)}
.team-pill{background:linear-gradient(90deg,#1368ce,#00b0ff);color:#fff;border:1px solid rgba(255,255,255,.5)}
.speed-pill{background:linear-gradient(90deg,#00b8d4,#2979ff);color:#fff;border:1px solid rgba(255,255,255,.5)}
.streak-pill{background:linear-gradient(90deg,#ff6d00,#ff3d00);color:#fff;font-size:.85em;padding:5px 13px}
.rival-pill{background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.24);color:var(--gold);font-weight:800}
.overtook-pill{background:linear-gradient(90deg,#00c853,#64dd17);color:#0b3d0b}
.lens-pill{background:rgba(0,191,165,.35);border:1px solid #1de9b6;color:#fff;font-size:.82em}
.title-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:var(--gold);font-size:.84em}

/* --- Question Stem & Media Card on Phone --- */
.q-card{
  background:var(--surface-strong);
  border:1px solid rgba(255,255,255,.2);
  border-radius:14px;
  padding:11px 13px;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}
.q-stem{
  font-size:clamp(1.02rem,3.8vw,1.24rem);
  font-weight:850;
  line-height:1.3;
  margin:0;
  word-break:break-word;
}
.q-media{
  max-height:128px;
  max-width:100%;
  border-radius:10px;
  margin:8px auto 2px;
  display:block;
  background:#fff;
  object-fit:contain;
  cursor:zoom-in;
}
.q-media.zoom-hold{filter:blur(26px);cursor:default;pointer-events:none}
.q-media.zoom-go{animation:zoomrev 15s linear forwards;cursor:default;pointer-events:none}
@keyframes zoomrev{from{filter:blur(26px)}to{filter:blur(0)}}

.exh-ph{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 2px}
.exh-ph figure{margin:0;max-width:47%;text-align:center}
.exh-ph img{max-width:100%;max-height:96px;border-radius:8px;background:#fff;object-fit:contain;cursor:zoom-in}
.exh-ph figcaption{font-size:.72em;opacity:.86;margin-top:2px}

/* --- Contextual Round Prompts (Hot Seat, Team Talk, Wager) --- */
.hot-box,.wager-box,.team-prompt,.steal-box{
  background:rgba(0,0,0,.34);
  border-radius:12px;
  padding:9px 11px;
  font-size:.9em;
}
.hot-box{border:1.5px solid #ff6d00;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;text-align:left}
.hot-box .wager-btns{margin:0;flex:0 0 auto}
.wager-box{border:1.5px solid var(--gold)}
.team-prompt{background:rgba(19,104,206,.34);border:1.5px solid #4fc3f7;text-align:left}
.steal-box{border:1.5px solid #ffab40;margin:10px 0}
.wager-btns{display:flex;gap:6px;margin-top:6px}
.wager-btn{
  flex:1;
  padding:8px 10px;
  border-radius:9px;
  border:1.5px solid rgba(255,255,255,.32);
  background:rgba(255,255,255,.14);
  color:#fff;
  font-weight:850;
  font-size:.92em;
  cursor:pointer;
}
.wager-btn.sel{background:linear-gradient(180deg,#ffe57f,#ffb300);color:var(--ink);border-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);text-shadow:0 1px 0 rgba(255,255,255,.4)}

/* --- 2x2 Ergonomic Answer Grid --- */
.ans-zone{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:0;
}
.grid{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  min-height:210px;
}
.grid.tf-grid{min-height:170px}
.grid button{
  min-height:104px;
  padding:12px 10px;
  border:0;
  border-radius:14px;
  color:#fff;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:850;
  font-size:1.06em;
  line-height:1.22;
  word-break:break-word;
  box-shadow:0 5px 0 rgba(0,0,0,.30),0 8px 16px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .08s,filter .12s,opacity .2s;
  position:relative;
}
.grid button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.30),0 4px 8px rgba(0,0,0,.2)}
.grid button .sh{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  border-radius:9px;
  background:rgba(0,0,0,.22);
  font-size:1.2em;
  line-height:1;
  flex-shrink:0;
}
.grid button img{max-height:68px;max-width:100%;border-radius:8px;background:#fff;object-fit:contain}
.grid button.elim{opacity:.16;pointer-events:none;filter:grayscale(1)}
.c0{background:#e21b3c}.c1{background:#1368ce}.c2{background:#d89e00}.c3{background:#26890c}
.aud-badge{background:rgba(0,0,0,.48);padding:2px 9px;border-radius:99px;font-size:.78em;color:var(--gold);font-weight:900}

/* --- Bottom Tactical Tray (Power-Ups + Confidence / DoN Bet) --- */
.tac-dock{
  background:rgba(16,4,38,.58);
  border:1px solid rgba(255,255,255,.16);
  border-radius:14px;
  padding:7px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.pu-bar{display:flex;gap:5px}
.pu-btn{
  flex:1;
  min-width:0;
  padding:8px 4px;
  border:1.5px solid rgba(255,255,255,.28);
  border-radius:10px;
  background:rgba(255,255,255,.11);
  color:#fff;
  font-size:.78em;
  font-weight:850;
  cursor:pointer;
  white-space:nowrap;
}
.pu-btn.active{background:linear-gradient(90deg,#ff9800,#ffd600);color:var(--ink);border-color:#fff}
.pu-btn:disabled{opacity:.32;cursor:default;text-decoration:line-through}
.conf-btn,.don-btn{
  width:100%;
  margin:0;
  padding:8px 12px;
  border-radius:10px;
  font-weight:850;
  font-size:.84em;
  cursor:pointer;
}
.conf-btn{border:1.5px solid rgba(255,223,93,.55);background:rgba(0,0,0,.28);color:var(--gold)}
.conf-btn.on{background:linear-gradient(90deg,#ff6d00,#ffd600);color:var(--ink);border-color:#fff;box-shadow:0 0 12px rgba(255,152,0,.5)}
.don-btn{border:1.5px solid rgba(255,64,129,.65);background:rgba(0,0,0,.28);color:#ff80ab}
.don-btn.on{background:linear-gradient(90deg,#d500f9,#ff1744);color:#fff;border-color:#fff;box-shadow:0 0 12px rgba(255,23,68,.5)}

/* --- Order / Ranking & Text Inputs --- */
.ord-slots{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.slot{
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.28);
  border-radius:10px;
  padding:9px 12px;
  font-weight:800;
  text-align:left;
  font-size:.98em;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  cursor:pointer;
}
.slot small{opacity:.72;font-size:.8em}
.txtans{font-size:1.25em}
textarea.txtans{
  display:block;
  width:100%;
  font-size:1.04em;
  font-weight:650;
  padding:12px;
  border-radius:12px;
  border:2px solid transparent;
  color:var(--ink);
  background:#fff;
  font-family:inherit;
  text-align:left;
  resize:vertical;
  margin-bottom:4px;
}
.char-cnt{text-align:right;font-size:.78em;opacity:.78;margin-bottom:8px;font-weight:700}

/* --- Status, Results, Lobby & Podium Cards --- */
.state-card{
  margin:auto 0;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px 16px;
  box-shadow:0 12px 32px rgba(0,0,0,.26);
}
.state-card.ok{background:linear-gradient(160deg,rgba(38,137,12,.52),rgba(20,82,5,.58));border-color:rgba(125,255,107,.55)}
.state-card.no{background:linear-gradient(160deg,rgba(198,40,40,.48),rgba(110,16,30,.55));border-color:rgba(255,138,128,.45)}
.state-icon{font-size:2.7em;line-height:1;margin-bottom:6px}
.state-title{font-size:1.65em;font-weight:900;margin:4px 0;line-height:1.2}
.state-sub{font-size:.98em;opacity:.9;line-height:1.4;margin:6px 0}
.ans-reveal-pill{
  display:inline-block;
  margin-top:8px;
  padding:7px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.34);
  border:1px solid rgba(125,255,107,.45);
  font-size:.92em;
  font-weight:800;
}

.sab-btn{
  margin:6px 4px 0;
  padding:10px 16px;
  border-radius:99px;
  border:2px solid #80deea;
  background:rgba(0,172,193,.35);
  color:#fff;
  font-weight:850;
  font-size:.9em;
  cursor:pointer;
}
.sab-btn:disabled{opacity:.4;cursor:default}

blockquote{
  background:#fff;
  color:var(--ink);
  border-radius:13px;
  padding:13px 16px;
  margin:12px 0 0;
  font-style:italic;
  line-height:1.42;
  text-align:left;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
  font-size:.95em;
}
blockquote cite{display:block;font-style:normal;font-size:.82em;margin-top:6px;opacity:.72;font-weight:700}

/* --- Reactions Bar --- */
.react-bar{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:auto;
  padding-top:12px;
  flex-wrap:wrap;
}
.react-bar button{
  font-size:1.45em;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.2);
  border-radius:99px;
  padding:7px 12px;
  cursor:pointer;
  transition:transform .12s,background .12s;
}
.react-bar button:active{transform:scale(1.28);background:rgba(255,255,255,.28)}

/* --- Case Study Reader, Polls & Peer Voting --- */
.case-ph{
  text-align:left;
  background:var(--surface-strong);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px 16px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.case-ph h2{margin:6px 0 8px;font-size:1.28em;line-height:1.28}
.case-body-ph p{font-size:1em;line-height:1.56;margin:.65em 0;color:rgba(255,255,255,.95)}
.role-card{
  background:linear-gradient(135deg,rgba(123,31,162,.62),rgba(74,20,140,.68));
  border:1.5px solid #ce93d8;

async function tryReconnect(){
 try{
  const raw = localStorage.getItem('brainrush_session');

function beep(f, d, type, v, delay){
 if(!sfxOn || !ac) return;
 const t = ac.currentTime + (delay||0), o = ac.createOscillator(), g = ac.createGain();
 o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
 g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(v || .25, t + .015); g.gain.exponentialRampToValueAtTime(0.001, t + d);
 o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}

function confettiBurst(){
 const c = document.getElementById('fx'); c.width = innerWidth; c.height = innerHeight;
 const ctx = c.getContext('2d'), cols = ['#ff2e63','#08d9d6','#ffde7d','#7dff6b','#fff','#ff9800'];
 const ps = Array.from({length:90}, ()=>({x:innerWidth/2, y:innerHeight*.3, vx:(Math.random()-.5)*12, vy:-4-Math.random()*9, s:5+Math.random()*7, col:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, va:(Math.random()-.5)*.3}));
 const t0 = performance.now();
 (function loop(now){
  ctx.clearRect(0,0,c.width,c.height);
  ps.forEach(p=>{ p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
  if(now - t0 < 1900) requestAnimationFrame(loop); else ctx.clearRect(0,0,c.width,c.height);
 })(t0);
}

 bestStreak = Math.max(bestStreak, m.streak || 0);
 if(m.rank === 1 && lastRank > 1) msgs.push('🥇 You took the lead!');

 lastRank = m.rank;

function updTimerBar(){

 if(S && S.phase === 'question' && S.qtype !== 'info'){
  wrap.style.display = 'flex';

   const tot = Math.max(1, S.preview_total || 5);
   const rem = Math.max(0, S.preview_left - (S.paused ? 0 : elapsed));
   fill.style.width = Math.min(100, (rem / tot) * 100) + '%';
   fill.className = 'ts-fill preview';
   lbl.className = 'ts-lbl';
   lbl.textContent = `👀 ${Math.ceil(rem)}s`;
  } else if(S.qtime > 0){
   const tot = Math.max(1, S.qtime || 15);
   const rem = Math.max(0, (S.left || 0) - (S.paused ? 0 : elapsed));
   const urg = !S.paused && rem <= 5;
   fill.style.width = Math.min(100, (rem / tot) * 100) + '%';

   lbl.className = 'ts-lbl' + (urg ? ' urgent' : '');
   lbl.textContent = S.paused ? `⏸️ ${Math.ceil(rem)}s` : `⏱️ ${Math.ceil(rem)}s`;
  } else {
   wrap.style.display = 'none';

 } else if(S && S.phase === 'intro' && (S.intro_total || 0) > 0){

    </div>
   </div>` : '';
   const confBtn = (!S.boss && !S.tiebreak && !S.case && !S.case_game && !m.answered) ? `<button class="conf-btn ${m.confident?'on':''}" onclick="toggleConf()">🔥 ${m.confident?'Confidence Bet ON (+250 / −150)':'Bet on Yourself (+250 / −150)'}</button>` : '';

   if(m.spectating){
    $.innerHTML=`<div class="q-screen">${chipRow}${qCard}<div class="state-card"><div class="state-icon">⚔️</div><div class="state-title">Sudden Death Tiebreaker</div><p class="state-sub">Only the tied leaders answer this round.</p></div>${reactBar()}</div>`;
   } else if(m.answered){
    const denom = S.n_active != null ? S.n_active : (S.n || 0);
    const picked = (m.choice != null && S.answers && S.answers[m.choice]) ? `<div class="ans-reveal-pill">${sh[m.choice]||''} ${esc(S.answers[m.choice])}</div>` : '';
    $.innerHTML=`<div class="q-screen">${chipRow}${qCard}<div class="state-card"><div class="state-icon">✅</div><div class="state-title">Answer Locked In!</div>${picked}<p class="state-sub" id="waitCnt">${denom?`${S.answered||1} of ${denom} answered`:'Waiting for everyone else…'}</p></div>${hot}${reactBar()}</div>`;
   } else if(inPrev){
    $.innerHTML=`<div class="q-screen">${chipRow}${qCard}<div class="state-card" style="padding:16px"><div class="state-icon" style="font-size:2em">👀</div><div class="state-title" style="font-size:1.3em">Read the Question</div><p class="state-sub">Answer tiles unlock when the reading bar finishes…</p></div>${hot}${teamP}${wagerBox}${donUi||confBtn?`<div class="tac-dock">${donUi}${confBtn}</div>`:''}${rivalHtml(m)}</div>`;
   } else {
    const hide = m.hide || [];
    const pcts = m.audience_pcts || null;
    const choiceQ = (t==='mc' || t==='tf' || t==='zoom');
    const puRow = (S.case || S.case_game) ? '' : `<div class="pu-bar">
     ${choiceQ?`<button class="pu-btn" ${m.pu_5050?'':'disabled'} onclick="usePu('5050')">✂️ 50/50</button>`:''}
     <button class="pu-btn ${m.active_2x?'active':''}" ${m.pu_2x||m.active_2x?'':'disabled'} onclick="usePu('2x')">⚡ ${m.active_2x?'2x ON':'2x'}</button>
     <button class="pu-btn ${m.active_shield?'active':''}" ${m.pu_shield||m.active_shield?'':'disabled'} onclick="usePu('shield')">🛡️ ${m.active_shield?'Saved':'Shield'}</button>
     ${choiceQ?`<button class="pu-btn ${m.active_audience?'active':''}" ${m.pu_audience||m.active_audience?'':'disabled'} onclick="usePu('audience')">📊 ${m.active_audience?'Live':'Poll'}</button>`:''}
    </div>`;
    const dock = (puRow || donUi || confBtn) ? `<div class="tac-dock">${puRow}${donUi}${confBtn}</div>` : '';

    let inputUi;
    if(t==='open'){
     inputUi = `<div class="ans-zone"><textarea id="openTxt" class="txtans" rows="4" maxlength="240" placeholder="Write 1–2 persuasive sentences (anonymous)…" oninput="const c=document.getElementById('openCnt');if(c)c.textContent=this.value.length+' / 240'"></textarea><div class="char-cnt" id="openCnt">0 / 240</div><button class="go" onclick="sendOpen()">✍️ Submit Response</button></div>`;
    } else if(t==='text'){
     inputUi = `<div class="ans-zone"><input id="txtAns" class="txtans" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')sendText()"><button class="go" onclick="sendText()">✅ Submit Answer</button></div>`;
    } else if(t==='order' || t==='rank'){
     inputUi = `<div class="ans-zone"><div id="ordWrap"></div></div>`;
    } else {
     const tfCls = (S.answers && S.answers.length === 2) ? ' tf-grid' : '';
     inputUi = `<div class="ans-zone"><div class="grid${tfCls}">${S.answers.map((a,i)=>`<button class="c${i%4} ${hide.includes(i)?'elim':''}" onclick="ans(${i})">${S.aimg&&S.aimg[i]?`<img src="${esc(S.aimg[i])}" alt="">`:''}<span class="sh">${sh[i]||''}</span><span>${esc(a)}</span>${pcts?`<span class="aud-badge" id="aud${i}">📊 ${pcts[i]}%</span>`:''}</button>`).join('')}</div></div>`;
    }
    $.innerHTML=`${iceHtml}<div class="q-screen">${chipRow}${qCard}${hot}${teamP}${wagerBox}${inputUi}${dock}</div>`;
    if(t==='order' || t==='rank') drawOrd();
    if(t==='text'){ const e=document.getElementById('txtAns'); if(e) e.focus(); }
   }
  } else if(S.phase=='results' && S.case && !(m.spectating)){
   $.innerHTML = caseResultPhone(m);
  } else if(S.phase=='results'){
   if(m.spectating){
    $.innerHTML=`<div class="state-card"><div class="state-icon">⚔️</div><div class="state-title">Tiebreaker Complete</div><p class="state-sub">Check the final result!</p></div>${reactBar()}`;
   } else {
    const st = m.streak >= 5 ? `<span class="streak-pill">🔥🔥 ${m.streak} Streak! ${m.bonus?`(+${m.bonus})`:''}</span>` : m.streak >= 2 ? `<span class="streak-pill">🔥 ${m.streak} Streak ${m.bonus?`(+${m.bonus})`:''}</span>` : '';
    const whMsg = m.wheel_bonus ? `<span class="underdog-pill">🎡 Wheel +${m.wheel_bonus}</span>` : '';
    const cfMsg = m.conf_delta ? `<span class="${m.conf_delta>0?'double-pill':'hot-pill'}">🔥 Bet ${m.conf_delta>0?'+'+m.conf_delta:m.conf_delta}</span>` : '';
    const tbMsg = m.team_bonus ? `<span class="team-pill">🤝 Team +${m.team_bonus}</span>` : '';
    const shMsg = (!m.correct && m.shielded) ? `<span class="speed-pill">🛡️ Shield Saved Streak!</span>` : '';
    let hotMsg = '';
    if(m.hot){
     if(m.hot.you) hotMsg = `<div class="state-sub" style="color:#ffd180">🔥 Hot Seat: ${m.hot.ok?'You nailed it! (+400)':'Missed this one'}</div>`;
     else if(m.hot.pred!==null && m.hot.pred!==undefined) hotMsg = `<div class="state-sub" style="color:#ffd180">🔥 Hot Seat call: ${m.hot.pred===m.hot.ok?'🎯 Spot on! (+200)':'Missed prediction'}</div>`;
    }
    let rightTxt = '';
    if(S.qtype==='text') rightTxt = (S.answers_correct||[''])[0] || '';
    else if(S.qtype==='order') rightTxt = (S.answers_correct||[]).join(' → ');
    else if(S.correct != null && S.correct >= 0 && S.answers && S.answers[S.correct]) rightTxt = (sh[S.correct]||'') + ' ' + S.answers[S.correct];
    const reveal = (!m.correct && rightTxt) ? `<div class="ans-reveal-pill">✅ Answer: ${esc(rightTxt)}</div>` : '';
    const gTxt = m.gained >= 0 ? '+'+m.gained : m.gained;
    const canSab = S.sabotage_enabled && !S.is_last && m.pu_freeze && m.score >= 200 && S.n > 1;
    const sabBtn = canSab ? `<div style="margin-top:8px"><button class="sab-btn" onclick="sabotage()">⛄ Snowball Leader (−200 pts)</button></div>` : m.ice_sent ? `<div style="margin-top:6px"><small style="color:#80deea;font-weight:800">⛄ Snowball queued for the leader!</small></div>` : '';
    const bonusChips = [st, whMsg, cfMsg, tbMsg, shMsg].filter(Boolean).join('');

    $.innerHTML=`<div class="chip-row" style="margin-bottom:6px"><span class="qnum">Question ${S.index+1} of ${S.total}</span></div>
     ${S.question?`<div class="q-card" style="margin-bottom:8px"><p class="q-stem" style="font-size:.98rem">${esc(S.question)}</p></div>`:''}
     <div class="state-card ${m.correct?'ok':'no'}" style="margin:0">
      <div class="state-icon">${!m.answered?'⏰':m.correct?'✅':'❌'}</div>
      <div class="state-title">${!m.answered?"Time's Up":m.correct?'Correct! '+gTxt:'Incorrect'+(m.gained<0?' ('+m.gained+')':'')}</div>
      ${bonusChips?`<div class="chip-row" style="margin-top:8px">${bonusChips}</div>`:''}
      ${hotMsg}${reveal}
      <div class="state-sub" style="margin-top:8px;font-weight:800">Total Score: <span style="color:var(--gold)">${m.score}</span>${m.rank?` &middot; Rank #${m.rank}`:''}</div>
     </div>
     ${rivalHtml(m)}${sabBtn}${stealUi(m)}
     ${S.quote?`<blockquote>&ldquo;${esc(S.quote)}&rdquo;${S.source?`<cite>&mdash; ${esc(S.source)}</cite>`:''}</blockquote>`:''}
     ${reactBar()}`;
   }
  } else if(S.phase=='board'){
   const canSab = S.sabotage_enabled && m.pu_freeze && m.score >= 200 && S.n > 1;
   const sabBtn = canSab ? `<div style="margin-top:10px"><button class="sab-btn" onclick="sabotage()">⛄ Throw Snowball at Leader (−200 pts)</button></div>` : m.ice_sent ? `<div style="margin-top:8px"><small style="color:#80deea;font-weight:800">⛄ Snowball thrown at the leader for next round!</small></div>` : '';
   $.innerHTML=`<div class="state-card">
     <div class="state-icon">🏆</div>
     <div class="state-title" style="font-size:2em">Rank #${m.rank}</div>
     <div class="state-sub" style="font-size:1.15em;font-weight:850;color:var(--gold)">${m.score} points</div>
     <div class="chip-row" style="margin-top:8px">
      ${m.title?`<span class="title-badge">${esc(m.title)}</span>`:''}
      ${m.streak>=2?`<span class="streak-pill">🔥 ${m.streak} Streak</span>`:''}
     </div>
     ${rivalHtml(m)}${sabBtn}
    </div>${reactBar()}`;
  } else {
   const rep = m.report || {};
   const tClass = m.rank===1?'':m.rank===2?'silver':m.rank===3?'bronze':'';
   const trophyHtml = m.rank <= 3 ? `<div class="trophy-card ${tClass}">
    <div style="font-size:1.7em">${m.rank===1?'🥇 1st Place Champion!':m.rank===2?'🥈 2nd Place Podium!':'🥉 3rd Place Podium!'}</div>
    <div style="margin-top:4px">${tag} &middot; ${m.score} pts</div>
    <button onclick="saveCert('${esc(m.name)}',${m.rank},${m.score},${rep.accuracy||0})">🏅 Save Winner Certificate</button>
   </div>` : `<div class="state-card" style="margin:6px 0;padding:16px"><div class="state-title">🎉 Game Complete!</div><div class="state-sub" style="font-weight:850">Placed <b>#${m.rank}</b> &middot; <span style="color:var(--gold)">${m.score} pts</span></div></div>`;
   const missedHtml = (rep.missed && rep.missed.length) ? `<div style="margin-top:6px"><b>📝 Questions to Review:</b>${rep.missed.map(x=>`<div class="missed-item"><b>Q${x.num}:</b> ${esc(x.q)}<br><span style="color:#ff9b9b">You: ${esc(x.your_ans)}</span> &middot; <span style="color:#7dff6b">✅ ${esc(x.correct_ans)}</span></div>`).join('')}</div>` : `<div style="text-align:center;color:#7dff6b;font-weight:850;padding:4px 0">🌟 Perfect Score! Every question right!</div>`;
   const repHtml = rep.total ? `<div class="report-card">
    <div class="report-stats">
     <div class="stat-pill"><b>${rep.accuracy}%</b>${rep.correct}/${rep.total} Right</div>
     <div class="stat-pill"><b>🔥 ${rep.max_streak||0}</b>Best Streak</div>
     <div class="stat-pill"><b>${rep.fastest!=null?rep.fastest+'s':'—'}</b>Fastest</div>
    </div>
    ${missedHtml}
   </div>` : '';
   $.innerHTML=`${trophyHtml}${repHtml}<div class="join-links"><a class="plink" href="/play" onclick="try{localStorage.removeItem('brainrush_session')}catch(e){}">🔁 Join New Game</a><a class="plink" href="/practice">🧑‍🎓 Solo Practice</a></div>${reactBar()}`;
  }
}
tryReconnect();
</script></body></html>
