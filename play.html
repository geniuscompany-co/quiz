<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brainrush! — Play</title>
<style>
:root{
  --bg1:#6827d6;
  --bg2:#46178f;
  --bg3:#23094d;
  --surface:rgba(255,255,255,.11);
  --surface-strong:rgba(20,6,46,.52);
  --border:rgba(255,255,255,.20);
  --gold:#ffdf5d;
  --green:#26890c;
  --green-bright:#69f0ae;
  --ink:#2b0d57;
  --radius:16px;
  --radius-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100vh;min-height:100dvh}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at 50% -12%,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%) fixed;
  color:#fff;
  text-align:center;
  display:flex;
  flex-direction:column;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}

/* --- Top Mobile HUD --- */
#topHud{
  position:sticky;
  top:0;
  z-index:55;
  width:100%;
  background:rgba(22,7,50,.78);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.14);
}
.hud-inner{
  max-width:540px;
  margin:0 auto;
  padding:7px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:46px;
}
.hud-left,.hud-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hud-btn{
  width:auto;
  margin:0;
  padding:5px 10px;
  font-size:.82em;
  font-weight:800;
  border-radius:99px;
  border:1px solid rgba(255,255,255,.26);
  background:rgba(255,255,255,.12);
  color:#fff;
  cursor:pointer;
  line-height:1.2;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.hud-btn:active{transform:scale(.95)}
#caseBtn{
  display:none;
  background:linear-gradient(135deg,#8e24aa,#5e35b1);
  border-color:rgba(255,255,255,.55);
  box-shadow:0 2px 10px rgba(0,0,0,.35);
}
.hud-me{
  display:none;
  align-items:center;
  gap:6px;
  background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.16);
  border-radius:99px;
  padding:3px 10px;
  font-size:.82em;
  font-weight:800;
  min-width:0;
  max-width:210px;
}
.hud-me .hm-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-me .hm-score{color:var(--gold);white-space:nowrap}
.hud-me .hm-rank{background:rgba(255,255,255,.18);padding:1px 6px;border-radius:99px;font-size:.88em}

/* --- Smooth Live Timer Bar --- */
#timerStrip{
  display:none;
  max-width:540px;
  width:100%;
  margin:0 auto;
  padding:0 12px 7px;
  align-items:center;
  gap:8px;
}
.ts-track{
  flex:1;
  height:8px;
  background:rgba(255,255,255,.18);
  border-radius:99px;
  overflow:hidden;
}
.ts-fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#69f0ae,#ffdf5d);
  border-radius:99px;
  transition:width .12s linear,background .25s ease;
}
.ts-fill.urgent{background:linear-gradient(90deg,#ff1744,#ff9100)}
.ts-fill.preview{background:linear-gradient(90deg,#00e5ff,#ffdf5d)}
.ts-lbl{
  font-size:.78em;
  font-weight:900;
  min-width:62px;
  text-align:right;
  color:var(--gold);
  white-space:nowrap;
}
.ts-lbl.urgent{color:#ff8a80}

/* --- App Container --- */
#app{
  flex:1;
  width:100%;
  max-width:540px;
  margin:0 auto;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
}

/* --- Cards & Surfaces --- */
.card-panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:0 10px 28px rgba(0,0,0,.24);
  backdrop-filter:blur(6px);
}
.brand-head{margin:2px 0 10px}
.logo{
  max-width:190px;
  max-height:84px;
  width:auto;
  border-radius:14px;
  margin:0 auto 6px;
  display:block;
  box-shadow:0 6px 18px rgba(0,0,0,.32);
  object-fit:contain;
}
.join-title{font-size:1.45em;font-weight:900;margin:0;letter-spacing:-.01em}
.join-sub{font-size:.88em;opacity:.82;margin:3px 0 0}

/* --- Inputs & Primary Buttons --- */
.field-lbl{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:.78em;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  opacity:.85;
  margin:8px 2px 4px;
}
.pin-ok{color:var(--green-bright);text-transform:none;letter-spacing:0}
input,select.rosterSel,select.tagsel{
  display:block;
  width:100%;
  font-size:1.22em;
  font-weight:800;
  padding:12px 14px;
  margin:0 0 8px;
  border-radius:var(--radius-sm);
  border:2px solid transparent;
  text-align:center;
  color:var(--ink);
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.16);
  font-family:inherit;
}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,223,93,.35);
}
#p{letter-spacing:3px;font-size:1.35em}
#p::placeholder{letter-spacing:normal;font-weight:700;opacity:.5}
input::placeholder{font-weight:650;opacity:.52}

button.go{
  width:100%;
  font-size:1.25em;
  padding:14px 18px;
  border:0;
  border-radius:13px;
  background:linear-gradient(180deg,#2fa80f,#217a0a);
  color:#fff;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 5px 0 #145205,0 8px 20px rgba(0,0,0,.28);
  transition:transform .08s,filter .15s;
  letter-spacing:.01em;
}
button.go:hover{filter:brightness(1.05)}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #145205,0 4px 10px rgba(0,0,0,.25)}
button.go.blue{
  background:linear-gradient(180deg,#1e7ae8,#1158b0);
  box-shadow:0 5px 0 #0a3975,0 8px 18px rgba(0,0,0,.26);
}

/* --- Progressive Customization Accordion on Join --- */
.cust-toggle{
  width:100%;
  margin:4px 0 10px;
  padding:9px 12px;
  border-radius:var(--radius-sm);
  border:1px solid rgba(255,255,255,.24);
  background:rgba(0,0,0,.24);
  color:#fff;
  font-size:.92em;
  font-weight:800;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.cust-preview{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.cust-drawer{
  display:none;
  background:rgba(0,0,0,.26);
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  padding:10px;
  margin:-2px 0 10px;
}
.cust-drawer.open{display:block}
.avatars{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  max-height:124px;
  overflow-y:auto;
  padding:4px;
  margin-bottom:8px;
}
.av{
  font-size:1.5em;
  padding:5px 8px;
  border-radius:10px;
  background:rgba(255,255,255,.12);
  border:2px solid transparent;
  cursor:pointer;
  user-select:none;
  transition:transform .12s,background .12s;
}
.av.sel{background:rgba(255,255,255,.28);border-color:var(--gold);transform:scale(1.1)}
.swatches{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:6px 0 8px}
.sw{width:27px;height:27px;border-radius:50%;border:3px solid rgba(255,255,255,.25);cursor:pointer;transition:transform .12s}
.sw.sel{border-color:var(--gold);transform:scale(1.16);box-shadow:0 0 10px rgba(255,223,93,.6)}
.tagsel{font-size:.98em;padding:9px 10px;margin:4px 0 6px}
.cust-drawer input{font-size:.98em;padding:9px 10px;margin:0}

.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}
.tm{
  padding:10px 8px;
  border-radius:10px;
  background:rgba(255,255,255,.13);
  border:2px solid rgba(255,255,255,.18);
  cursor:pointer;
  font-weight:800;
  font-size:.92em;
  user-select:none;
}
.tm.sel{border-color:var(--gold);background:rgba(255,255,255,.26);transform:scale(1.02)}

.join-links{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.plink{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:7px 13px;
  border-radius:99px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  text-decoration:none;
  font-size:.86em;
  font-weight:750;
}
.err{color:#ff9e9e;font-weight:800;font-size:.92em;margin:8px 0 0}
.err:empty{display:none}

/* --- Question Stage: Zero-Scroll Flex Budget --- */
.q-screen{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:8px;
  min-height:0;
}
.chip-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:5px;
}
.qnum{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#fff;
  color:var(--bg2);
  font-weight:900;
  font-size:.84em;
  padding:4px 12px;
  border-radius:99px;
  box-shadow:0 2px 8px rgba(0,0,0,.22);
}
.wheel-pill,.double-pill,.underdog-pill,.hot-pill,.team-pill,.speed-pill,.streak-pill,.rival-pill,.overtook-pill,.lens-pill,.title-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  border-radius:99px;
  padding:4px 11px;
  font-size:.8em;
  font-weight:900;
  line-height:1.2;
}
.wheel-pill{background:linear-gradient(90deg,#00c853,#00b0ff,#aa00ff);color:#fff;border:1px solid rgba(255,255,255,.5)}
.double-pill{background:linear-gradient(90deg,#ff9800,#ffd600);color:var(--ink)}
.underdog-pill{background:linear-gradient(90deg,#00c853,#b2ff59);color:#0f3d13}
.hot-pill{background:linear-gradient(90deg,#ff6d00,#ff1744);color:#fff;border:1px solid rgba(255,255,255,.5)}
.team-pill{background:linear-gradient(90deg,#1368ce,#00b0ff);color:#fff;border:1px solid rgba(255,255,255,.5)}
.speed-pill{background:linear-gradient(90deg,#00b8d4,#2979ff);color:#fff;border:1px solid rgba(255,255,255,.5)}
.streak-pill{background:linear-gradient(90deg,#ff6d00,#ff3d00);color:#fff;font-size:.85em;padding:5px 13px}
.rival-pill{background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.24);color:var(--gold);font-weight:800}
.overtook-pill{background:linear-gradient(90deg,#00c853,#64dd17);color:#0b3d0b}
.lens-pill{background:rgba(0,191,165,.35);border:1px solid #1de9b6;color:#fff;font-size:.82em}
.title-badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:var(--gold);font-size:.84em}

/* --- Question Stem & Media Card on Phone --- */
.q-card{
  background:var(--surface-strong);
  border:1px solid rgba(255,255,255,.2);
  border-radius:14px;
  padding:11px 13px;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}
.q-stem{
  font-size:clamp(1.02rem,3.8vw,1.24rem);
  font-weight:850;
  line-height:1.3;
  margin:0;
  word-break:break-word;
}
.q-media{
  max-height:128px;
  max-width:100%;
  border-radius:10px;
  margin:8px auto 2px;
  display:block;
  background:#fff;
  object-fit:contain;
  cursor:zoom-in;
}
.q-media.zoom-hold{filter:blur(26px);cursor:default;pointer-events:none}
.q-media.zoom-go{animation:zoomrev 15s linear forwards;cursor:default;pointer-events:none}
@keyframes zoomrev{from{filter:blur(26px)}to{filter:blur(0)}}

.exh-ph{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0 2px}
.exh-ph figure{margin:0;max-width:47%;text-align:center}
.exh-ph img{max-width:100%;max-height:96px;border-radius:8px;background:#fff;object-fit:contain;cursor:zoom-in}
.exh-ph figcaption{font-size:.72em;opacity:.86;margin-top:2px}

/* --- Contextual Round Prompts (Hot Seat, Team Talk, Wager) --- */
.hot-box,.wager-box,.team-prompt,.steal-box{
  background:rgba(0,0,0,.34);
  border-radius:12px;
  padding:9px 11px;
  font-size:.9em;
}
.hot-box{border:1.5px solid #ff6d00;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;text-align:left}
.hot-box .wager-btns{margin:0;flex:0 0 auto}
.wager-box{border:1.5px solid var(--gold)}
.team-prompt{background:rgba(19,104,206,.34);border:1.5px solid #4fc3f7;text-align:left}
.steal-box{border:1.5px solid #ffab40;margin:10px 0}
.wager-btns{display:flex;gap:6px;margin-top:6px}
.wager-btn{
  flex:1;
  padding:8px 10px;
  border-radius:9px;
  border:1.5px solid rgba(255,255,255,.32);
  background:rgba(255,255,255,.14);
  color:#fff;
  font-weight:850;
  font-size:.92em;
  cursor:pointer;
}
.wager-btn.sel{background:linear-gradient(180deg,#ffe57f,#ffb300);color:var(--ink);border-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);text-shadow:0 1px 0 rgba(255,255,255,.4)}

/* --- 2x2 Ergonomic Answer Grid --- */
.ans-zone{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:0;
}
.grid{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  min-height:210px;
}
.grid.tf-grid{min-height:170px}
.grid button{
  min-height:104px;
  padding:12px 10px;
  border:0;
  border-radius:14px;
  color:#fff;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:850;
  font-size:1.06em;
  line-height:1.22;
  word-break:break-word;
  box-shadow:0 5px 0 rgba(0,0,0,.30),0 8px 16px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .08s,filter .12s,opacity .2s;
  position:relative;
}
.grid button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.30),0 4px 8px rgba(0,0,0,.2)}
.grid button .sh{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  border-radius:9px;
  background:rgba(0,0,0,.22);
  font-size:1.2em;
  line-height:1;
  flex-shrink:0;
}
.grid button img{max-height:68px;max-width:100%;border-radius:8px;background:#fff;object-fit:contain}
.grid button.elim{opacity:.16;pointer-events:none;filter:grayscale(1)}
.c0{background:#e21b3c}.c1{background:#1368ce}.c2{background:#d89e00}.c3{background:#26890c}
.aud-badge{background:rgba(0,0,0,.48);padding:2px 9px;border-radius:99px;font-size:.78em;color:var(--gold);font-weight:900}

/* --- Bottom Tactical Tray (Power-Ups + Confidence / DoN Bet) --- */
.tac-dock{
  background:rgba(16,4,38,.58);
  border:1px solid rgba(255,255,255,.16);
  border-radius:14px;
  padding:7px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.pu-bar{display:flex;gap:5px}
.pu-btn{
  flex:1;
  min-width:0;
  padding:8px 4px;
  border:1.5px solid rgba(255,255,255,.28);
  border-radius:10px;
  background:rgba(255,255,255,.11);
  color:#fff;
  font-size:.78em;
  font-weight:850;
  cursor:pointer;
  white-space:nowrap;
}
.pu-btn.active{background:linear-gradient(90deg,#ff9800,#ffd600);color:var(--ink);border-color:#fff}
.pu-btn:disabled{opacity:.32;cursor:default;text-decoration:line-through}
.conf-btn,.don-btn{
  width:100%;
  margin:0;
  padding:8px 12px;
  border-radius:10px;
  font-weight:850;
  font-size:.84em;
  cursor:pointer;
}
.conf-btn{border:1.5px solid rgba(255,223,93,.55);background:rgba(0,0,0,.28);color:var(--gold)}
.conf-btn.on{background:linear-gradient(90deg,#ff6d00,#ffd600);color:var(--ink);border-color:#fff;box-shadow:0 0 12px rgba(255,152,0,.5)}
.don-btn{border:1.5px solid rgba(255,64,129,.65);background:rgba(0,0,0,.28);color:#ff80ab}
.don-btn.on{background:linear-gradient(90deg,#d500f9,#ff1744);color:#fff;border-color:#fff;box-shadow:0 0 12px rgba(255,23,68,.5)}

/* --- Order / Ranking & Text Inputs --- */
.ord-slots{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.slot{
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.28);
  border-radius:10px;
  padding:9px 12px;
  font-weight:800;
  text-align:left;
  font-size:.98em;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  cursor:pointer;
}
.slot small{opacity:.72;font-size:.8em}
.txtans{font-size:1.25em}
textarea.txtans{
  display:block;
  width:100%;
  font-size:1.04em;
  font-weight:650;
  padding:12px;
  border-radius:12px;
  border:2px solid transparent;
  color:var(--ink);
  background:#fff;
  font-family:inherit;
  text-align:left;
  resize:vertical;
  margin-bottom:4px;
}
.char-cnt{text-align:right;font-size:.78em;opacity:.78;margin-bottom:8px;font-weight:700}

/* --- Status, Results, Lobby & Podium Cards --- */
.state-card{
  margin:auto 0;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px 16px;
  box-shadow:0 12px 32px rgba(0,0,0,.26);
}
.state-card.ok{background:linear-gradient(160deg,rgba(38,137,12,.52),rgba(20,82,5,.58));border-color:rgba(125,255,107,.55)}
.state-card.no{background:linear-gradient(160deg,rgba(198,40,40,.48),rgba(110,16,30,.55));border-color:rgba(255,138,128,.45)}
.state-icon{font-size:2.7em;line-height:1;margin-bottom:6px}
.state-title{font-size:1.65em;font-weight:900;margin:4px 0;line-height:1.2}
.state-sub{font-size:.98em;opacity:.9;line-height:1.4;margin:6px 0}
.ans-reveal-pill{
  display:inline-block;
  margin-top:8px;
  padding:7px 14px;
  border-radius:10px;
  background:rgba(0,0,0,.34);
  border:1px solid rgba(125,255,107,.45);
  font-size:.92em;
  font-weight:800;
}

.sab-btn{
  margin:6px 4px 0;
  padding:10px 16px;
  border-radius:99px;
  border:2px solid #80deea;
  background:rgba(0,172,193,.35);
  color:#fff;
  font-weight:850;
  font-size:.9em;
  cursor:pointer;
}
.sab-btn:disabled{opacity:.4;cursor:default}

blockquote{
  background:#fff;
  color:var(--ink);
  border-radius:13px;
  padding:13px 16px;
  margin:12px 0 0;
  font-style:italic;
  line-height:1.42;
  text-align:left;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
  font-size:.95em;
}
blockquote cite{display:block;font-style:normal;font-size:.82em;margin-top:6px;opacity:.72;font-weight:700}

/* --- Reactions Bar --- */
.react-bar{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:auto;
  padding-top:12px;
  flex-wrap:wrap;
}
.react-bar button{
  font-size:1.45em;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.2);
  border-radius:99px;
  padding:7px 12px;
  cursor:pointer;
  transition:transform .12s,background .12s;
}
.react-bar button:active{transform:scale(1.28);background:rgba(255,255,255,.28)}

/* --- Case Study Reader, Polls & Peer Voting --- */
.case-ph{
  text-align:left;
  background:var(--surface-strong);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px 16px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
.case-ph h2{margin:6px 0 8px;font-size:1.28em;line-height:1.28}
.case-body-ph p{font-size:1em;line-height:1.56;margin:.65em 0;color:rgba(255,255,255,.95)}
.role-card{
  background:linear-gradient(135deg,rgba(123,31,162,.62),rgba(74,20,140,.68));
  border:1.5px solid #ce93d8;

function stopSpeech(){

function speakQuestion(){
 if(!('speechSynthesis' in window) || !S) return;
 if(window.speechSynthesis.speaking){ stopSpeech(); return; }
 const parts = [];
 if(S.question) parts.push(S.question);
 if(S.qtype === 'info' && S.body) parts.push(S.body);
 else if((S.preview_left || 0) <= 0){
  const qt = S.qtype || 'mc';
  if(['mc','tf','zoom','multi','poll','scale'].includes(qt) && Array.isArray(S.answers) && S.answers.length){
   parts.push('Options: ' + S.answers.map((a,i)=>`${i+1}: ${a}`).join('. '));
  } else if((qt === 'order' || qt === 'rank') && Array.isArray(S.answers) && S.answers.length){
   parts.push('Items: ' + S.answers.join(', '));
  } else if(qt === 'match' && Array.isArray(S.match_left) && S.match_left.length){
   parts.push('Match prompts: ' + S.match_left.join(', ') + '. With: ' + (S.match_right||[]).join(', '));
  } else if(qt === 'slider' && S.slider_cfg){
   parts.push(`Range ${S.slider_cfg.min} to ${S.slider_cfg.max}${S.slider_cfg.unit?' '+S.slider_cfg.unit:''}.`);
  }
 }
 if(!parts.length) return;
 try{
  const u = new SpeechSynthesisUtterance(parts.join('. '));
  const b = document.getElementById('stuTtsBtn');
  if(b){ b.classList.add('on'); b.textContent = '⏹️ Stop'; }
  u.onend = u.onerror = () => {
   const btn = document.getElementById('stuTtsBtn');
   if(btn){ btn.classList.remove('on'); btn.textContent = '🔊 Read Aloud'; }
  };
  window.speechSynthesis.speak(u);
 }catch(e){}
}

function isThinkLocked(){

 const pv = Math.max(0, (S.preview_left || 0) - elapsed);
 const thk = Math.max(0, (S.think_left || 0) - elapsed);
 return pv <= 0.05 && thk > 0.05;
}

function drawMatchPhone(){
 const el = document.getElementById('matchWrap');
 if(!el) return;
 const lefts = S.match_left || [], rights = S.match_right || [], n = lefts.length;
 if(matchPairs.length !== n) matchPairs = Array(n).fill(-1);
 const linked = matchPairs.filter(v => v >= 0).length;
 const ready = n > 0 && linked === n;
 const locked = isThinkLocked();
 el.innerHTML = `
  <div style="font-size:.86em;opacity:.9;margin-bottom:5px;font-weight:750">Tap a left item &amp; its matching partner (tap paired item to unpair):</div>
  <div class="match-cols">
   <div class="match-col">
    <div class="match-hdr">Prompts</div>
    ${lefts.map((lt, li) => {
     const rj = matchPairs[li];
     return `<button type="button" class="m-item ${matchLeft===li?'active':''}" onclick="tapMatchL(${li})"><span>${esc(lt)}</span>${rj>=0?`<span class="m-badge pc${li%6}">#${li+1}</span>`:''}</button>`;
    }).join('')}
   </div>
   <div class="match-col">
    <div class="match-hdr">Matches</div>
    ${rights.map((rt, rj) => {
     const li = matchPairs.indexOf(rj);
     return `<button type="button" class="m-item" onclick="tapMatchR(${rj})"><span>${esc(rt)}</span>${li>=0?`<span class="m-badge pc${li%6}">#${li+1}</span>`:''}</button>`;
    }).join('')}
   </div>
  </div>
  <button class="go" id="matchSubBtn" data-think-lock="1" data-ready="${ready?1:0}" ${(locked || !ready)?'disabled':''} onclick="submitMatch()">🔗 Submit Pairs (${linked}/${n})</button>
 `;
}
function tapMatchL(li){
 if(matchPairs[li] >= 0){ matchPairs[li] = -1; matchLeft = li; }
 else { matchLeft = (matchLeft === li) ? null : li; }
 drawMatchPhone();
}
function tapMatchR(rj){
 const existing = matchPairs.indexOf(rj);
 let target = matchLeft;
 if(target === null || target === undefined){
  if(existing >= 0){ matchPairs[existing] = -1; matchLeft = existing; drawMatchPhone(); return; }
  target = matchPairs.findIndex(v => v < 0);
 }
 if(target === null || target < 0) return;
 if(existing >= 0) matchPairs[existing] = -1;
 matchPairs[target] = rj;
 const nx = matchPairs.findIndex(v => v < 0);
 matchLeft = nx >= 0 ? nx : null;
 drawMatchPhone();
}

function unlockAudio(){ try{ if(!ac){ const C = window.AudioContext || window.webkitAudioContext; if(C) ac = new C(); } if(ac && ac.state === 'suspended') ac.resume(); }catch(e){} }

function beep(f, d, type, v, delay){
 if(!sfxOn || !ac) return;
 const t = ac.currentTime + (delay||0), o = ac.createOscillator(), g = ac.createGain();
 o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
 g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime(v || .25, t + .015); g.gain.exponentialRampToValueAtTime(0.001, t + d);
 o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
function sfxCorrect(){ [523.25,659.25,783.99].forEach((f,i)=>beep(f,.16,'triangle',.28,i*.09)); }

function confettiBurst(){
 const c = document.getElementById('fx'); c.width = innerWidth; c.height = innerHeight;
 const ctx = c.getContext('2d'), cols = ['#ff2e63','#08d9d6','#ffde7d','#7dff6b','#fff','#ff9800'];
 const ps = Array.from({length:90}, ()=>({x:innerWidth/2, y:innerHeight*.3, vx:(Math.random()-.5)*12, vy:-4-Math.random()*9, s:5+Math.random()*7, col:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, va:(Math.random()-.5)*.3}));
 const t0 = performance.now();
 (function loop(now){
  ctx.clearRect(0,0,c.width,c.height);
  ps.forEach(p=>{ p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
  if(now - t0 < 1900) requestAnimationFrame(loop); else ctx.clearRect(0,0,c.width,c.height);
 })(t0);
}

function maybeResultFX(){

 if(S.phase !== 'results' || !m || fxQ === S.index || m.spectating) return;

 if(m.correct && !everCorrect) msgs.push('🎉 First correct answer!');
 if(m.correct) everCorrect = true;
 if(m.streak >= 3 && m.streak > bestStreak) msgs.push('🔥 New personal best streak: ' + m.streak + '!');
 bestStreak = Math.max(bestStreak, m.streak || 0);
 if(!S.hide_board){

function updTimerBar(){
 const wrap = document.getElementById('timerStrip');

 if(!wrap || !fill || !lbl) return;
 const elapsed = (pollStamp && !(S && S.paused)) ? Math.max(0, (performance.now() - pollStamp) / 1000) : 0;
 if(S && S.phase === 'question' && S.qtype !== 'info'){
  wrap.style.display = 'flex';
  const pvRem = Math.max(0, (S.preview_left || 0) - elapsed);
  const thkRem = Math.max(0, (S.think_left || 0) - elapsed);
  if(S.consensus_step === 2){
   const tot = Math.max(1, S.consensus_total || 20);
   const cRem = Math.max(0, (S.consensus_left || 0) - elapsed);
   fill.style.width = Math.min(100, (cRem / tot) * 100) + '%';
   fill.className = 'ts-fill consensus' + (!S.paused && cRem <= 5 ? ' urgent' : '');
   lbl.className = 'ts-lbl' + (!S.paused && cRem <= 5 ? ' urgent' : '');
   lbl.textContent = `🤝 ${Math.ceil(cRem)}s`;
   const csEl = document.getElementById('consSec');
   if(csEl) csEl.textContent = Math.ceil(cRem);
  } else if(pvRem > 0.05){
   const tot = Math.max(1, S.preview_total || 5);
   fill.style.width = Math.min(100, (pvRem / tot) * 100) + '%';
   fill.className = 'ts-fill preview';
   lbl.className = 'ts-lbl';
   lbl.textContent = `👀 ${Math.ceil(pvRem)}s`;
  } else if(thkRem > 0.05){
   const tot = Math.max(1, S.think_total || 5);
   fill.style.width = Math.min(100, (thkRem / tot) * 100) + '%';
   fill.className = 'ts-fill think';
   lbl.className = 'ts-lbl';
   lbl.textContent = `🧠 ${Math.ceil(thkRem)}s`;
   const tb = document.getElementById('thinkSec');
   if(tb) tb.textContent = Math.ceil(thkRem);
  } else {
   const tbBanner = document.getElementById('thinkBanner');
   if(tbBanner && tbBanner.style.display !== 'none'){
    tbBanner.style.display = 'none';
    document.querySelectorAll('[data-think-lock="1"]').forEach(el => {
     if(el.dataset.ready !== '0') el.disabled = false;
    });
   }
   if(S.qtime > 0){
    const tot = Math.max(1, S.qtime || 15);
    const rem = Math.max(0, (S.left || 0) - elapsed);
    const urg = !S.paused && rem <= 5;
    fill.style.width = Math.min(100, (rem / tot) * 100) + '%';
    fill.className = 'ts-fill' + (urg ? ' urgent' : '');
    lbl.className = 'ts-lbl' + (urg ? ' urgent' : '');
    lbl.textContent = S.paused ? `⏸️ ${Math.ceil(rem)}s` : `⏱️ ${Math.ceil(rem)}s`;
   } else {
    wrap.style.display = 'none';
   }
  }
 } else if(S && S.phase === 'intro' && (S.intro_total || 0) > 0){
  wrap.style.display = 'flex';
  const rem = Math.max(0, (S.intro_left || 0) - elapsed);
  fill.style.width = Math.min(100, (rem / Math.max(1, S.intro_total)) * 100) + '%';
  fill.className = 'ts-fill preview';
  lbl.className = 'ts-lbl';
  lbl.textContent = `🎬 ${Math.ceil(rem)}s`;
 } else {
  wrap.style.display = 'none';
 }
}

    } else if(qt==='match' && Array.isArray(S.pairs_correct)){
     rightTxt = S.pairs_correct.map(p => `${p.l} → ${p.r}`).join(', ');
    } else if(qt==='slider' && S.slider_res){
     const sr = S.slider_res, u = sr.unit ? ' ' + sr.unit : '';
     rightTxt = sr.margin ? `${sr.target}${u} (±${sr.margin})` : `${sr.target}${u}`;
    } else if(qt==='pin' && S.pin_target){
     rightTxt = `Target zone (${Math.round(S.pin_target.x)}%, ${Math.round(S.pin_target.y)}%)`;
    } else if(Array.isArray(S.correct_multi) && S.correct_multi.length > 1){
     const opts = S.answers_correct || S.answers || [];
     rightTxt = S.correct_multi.map(k => (sh[k%6]||'') + ' ' + (opts[k]||'')).join(' OR ');
    } else if(S.correct != null && S.correct >= 0 && S.answers && S.answers[S.correct]){
     rightTxt = (sh[S.correct%6]||'') + ' ' + S.answers[S.correct];
    }

    const pinResVisual = (qt === 'pin' && S.img && S.pin_target) ? (()=>{
     const pt = S.pin_target, r = Math.max(1, Number(pt.r)||12);
     const myP = m.pin_xy;
     return `<div style="margin-top:10px"><div class="pin-stage" style="cursor:default">
      <img src="${esc(S.img)}" alt="" style="max-height:190px">
      <svg class="pin-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
       <ellipse cx="${pt.x}" cy="${pt.y}" rx="${r}" ry="${r}" fill="rgba(46,204,113,0.34)" stroke="#69f0ae" stroke-width="1.3"/>
      </svg>
      ${myP?`<div class="pin-marker" style="left:${myP[0]}%;top:${myP[1]}%"></div>`:''}
     </div></div>`;
    })() : '';

    const reveal = (!m.correct && rightTxt) ? `<div class="ans-reveal-pill">✅ Answer: ${esc(rightTxt)}</div>` : '';
    const isSurvey = S.scoring_mode === 'survey';
    const isPartial = !m.correct && !!m.partial;
    const gTxt = isSurvey ? '' : (' ' + (m.gained >= 0 ? '+'+m.gained : m.gained) + (isPartial ? ' pts' : ''));
    const cardCls = !m.answered ? 'no' : m.correct ? 'ok' : isPartial ? 'partial' : 'no';
    const iconTxt = !m.answered ? '⏰' : m.correct ? '✅' : isPartial ? '⚡' : '❌';
    const titleTxt = !m.answered
     ? "Time's Up"
     : m.correct
       ? `Correct!${gTxt}`
       : isPartial
         ? `⚡ Partial Credit!${gTxt}`
         : `Incorrect${(!isSurvey && m.gained<0)?` (${m.gained})`:''}`;

    const canSab = S.sabotage_enabled && !S.hide_board && !S.is_last && m.pu_freeze && m.score >= 200 && S.n > 1;
    const sabBtn = canSab ? `<div style="margin-top:8px"><button class="sab-btn" onclick="sabotage()">⛄ Snowball Leader (−200 pts)</button></div>` : m.ice_sent ? `<div style="margin-top:6px"><small style="color:#80deea;font-weight:800">⛄ Snowball queued for the leader!</small></div>` : '';
    const bonusChips = [st, whMsg, cfMsg, tbMsg, shMsg].filter(Boolean).join('');
    const scoreLine = S.scoring_mode === 'percent'
     ? `Grade: <span style="color:var(--gold)">${m.pct??0}%</span> (${m.score} pts)${(!S.hide_board && m.rank)?` &middot; Rank #${m.rank}`:''}`
     : isSurvey
       ? `Accuracy so far: <span style="color:var(--gold)">${m.pct??0}%</span>`
       : `Total Score: <span style="color:var(--gold)">${m.score}</span> (${m.pct??0}%)${(!S.hide_board && m.rank)?` &middot; Rank #${m.rank}`:''}`;

    $.innerHTML=`<div class="chip-row" style="margin-bottom:6px"><span class="qnum">Question ${S.index+1} of ${S.total}</span></div>
     ${S.question?`<div class="q-card" style="margin-bottom:8px"><p class="q-stem" style="font-size:.98rem">${esc(S.question)}</p></div>`:''}
     <div class="state-card ${cardCls}" style="margin:0">
      <div class="state-icon">${iconTxt}</div>
      <div class="state-title">${titleTxt}</div>
      ${bonusChips?`<div class="chip-row" style="margin-top:8px">${bonusChips}</div>`:''}
      ${hotMsg}${reveal}${pinResVisual}
      <div class="state-sub" style="margin-top:8px;font-weight:800">${scoreLine}</div>
     </div>
     ${outcomeAndShiftHtml(m)}${consensusSummaryHtml()}
     ${!S.hide_board?rivalHtml(m):''}${sabBtn}${stealUi(m)}
     ${S.quote?`<blockquote>&ldquo;${esc(S.quote)}&rdquo;${S.source?`<cite>&mdash; ${esc(S.source)}</cite>`:''}</blockquote>`:''}
     ${reactBar()}`;
   }
  } else if(S.phase=='board'){
   if(S.hide_board){
    $.innerHTML=`<div class="state-card">
      <div class="state-icon">🙈</div>
      <div class="state-title" style="font-size:1.45em">Live Standings Hidden</div>
      <div class="state-sub">Rankings stay under wraps until the Final Podium!</div>
      <div class="state-sub" style="font-weight:850;color:var(--gold)">Your Grade: ${m.pct??0}% &middot; ${m.score} pts</div>
     </div>${reactBar()}`;
   } else {
    const canSab = S.sabotage_enabled && m.pu_freeze && m.score >= 200 && S.n > 1;
    const sabBtn = canSab ? `<div style="margin-top:10px"><button class="sab-btn" onclick="sabotage()">⛄ Throw Snowball at Leader (−200 pts)</button></div>` : m.ice_sent ? `<div style="margin-top:8px"><small style="color:#80deea;font-weight:800">⛄ Snowball thrown at the leader for next round!</small></div>` : '';
    const subMetric = S.scoring_mode === 'percent' ? `${m.pct??0}% Grade · ${m.score} pts` : `${m.score} points · ${m.pct??0}%`;
    $.innerHTML=`<div class="state-card">
      <div class="state-icon">🏆</div>
      <div class="state-title" style="font-size:2em">Rank #${m.rank}</div>
      <div class="state-sub" style="font-size:1.15em;font-weight:850;color:var(--gold)">${subMetric}</div>
      <div class="chip-row" style="margin-top:8px">
       ${m.title?`<span class="title-badge">${esc(m.title)}</span>`:''}
       ${m.streak>=2?`<span class="streak-pill">🔥 ${m.streak} Streak</span>`:''}
      </div>
      ${rivalHtml(m)}${sabBtn}
     </div>${reactBar()}`;
   }
  } else {
   const rep = m.report || {};
   const accVal = rep.accuracy != null ? rep.accuracy : (m.pct || 0);
   const tClass = m.rank===1?'':m.rank===2?'silver':m.rank===3?'bronze':'';
   const trophyHtml = (m.rank <= 3 && S.scoring_mode !== 'survey') ? `<div class="trophy-card ${tClass}">
    <div style="font-size:1.7em">${m.rank===1?'🥇 1st Place Champion!':m.rank===2?'🥈 2nd Place Podium!':'🥉 3rd Place Podium!'}</div>
    <div style="margin-top:4px">${tag} &middot; ${S.scoring_mode==='percent'?`${accVal}% (${m.score} pts)`:`${m.score} pts (${accVal}%)`}</div>
    <button onclick="saveCert('${esc(m.name)}',${m.rank},${m.score},${accVal})">🏅 Save Winner Certificate</button>
   </div>` : `<div class="state-card" style="margin:6px 0;padding:16px"><div class="state-title">🎉 Session Complete!</div><div class="state-sub" style="font-weight:850">${S.scoring_mode==='survey'?'Thank you for participating!':`Placed <b>#${m.rank}</b> &middot; <span style="color:var(--gold)">${accVal}% Grade (${m.score} pts)</span>`}</div></div>`;

   const cal = rep.calibration;
   const calibHtml = (cal && cal.conf_n > 0)
    ? `<div class="calib-card">🎯 <b>Confidence Calibration:</b> Confident bets: <b>${cal.conf_pct}% right</b> (${cal.conf_ok}/${cal.conf_n}) &middot; Calm answers: <b>${cal.calm_pct != null ? cal.calm_pct + '%' : '—'}</b></div>`
    : '';
   const missedHtml = (rep.missed && rep.missed.length) ? `<div style="margin-top:6px"><b>📝 Questions to Review:</b>${rep.missed.map(x=>`<div class="missed-item"><b>Q${x.num}:</b> ${esc(x.q)}<br><span style="color:#ff9b9b">You: ${esc(x.your_ans)}</span> &middot; <span style="color:#7dff6b">✅ ${esc(x.correct_ans)}</span></div>`).join('')}</div>` : `<div style="text-align:center;color:#7dff6b;font-weight:850;padding:4px 0">🌟 Perfect Score! Every question right!</div>`;
   const repHtml = rep.total ? `<div class="report-card">
    <div style="text-align:center;margin-bottom:10px"><span class="title-badge" style="font-size:1.05em;padding:5px 14px">📊 Final Grade: ${accVal}%</span></div>
    <div class="report-stats">
     <div class="stat-pill"><b>${accVal}%</b>${rep.correct}/${rep.total} Right</div>
     <div class="stat-pill"><b>🔥 ${rep.max_streak||0}</b>Best Streak</div>
     <div class="stat-pill"><b>${rep.fastest!=null?rep.fastest+'s':'—'}</b>Fastest</div>
    </div>
    ${calibHtml}
    ${missedHtml}
   </div>` : '';
   $.innerHTML=`${trophyHtml}${repHtml}<div class="join-links"><a class="plink" href="/play" onclick="try{localStorage.removeItem('brainrush_session')}catch(e){}">🔁 Join New Game</a><a class="plink" href="/practice">🧑‍🎓 Solo Practice</a></div>${reactBar()}`;
  }
}
tryReconnect();
</script></body></html>
