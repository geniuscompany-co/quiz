<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brainrush! — Host Remote</title>
<style>
:root{
  --bg1:#3b1478;
  --bg2:#220a4a;
  --bg3:#120429;
  --surface:rgba(255,255,255,.09);
  --surface-hi:rgba(255,255,255,.14);
  --border:rgba(255,255,255,.18);
  --gold:#ffdf5d;
  --green:#26890c;
  --green-hi:#69f0ae;
  --blue:#1368ce;
  --ink:#2b0d57;
  --radius:16px;
  --radius-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100vh;min-height:100dvh}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at 50% -10%,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;
  color:#fff;
  display:flex;
  flex-direction:column;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}

/* --- Sticky Studio HUD --- */
#topHud{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(16,4,38,.84);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.14);
}
.hud-inner{
  max-width:520px;
  margin:0 auto;
  padding:8px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:48px;
}
.hud-left{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:var(--gold);
  color:var(--ink);
  font-weight:900;
  padding:4px 11px;
  border-radius:99px;
  font-size:.8em;
  letter-spacing:.02em;
  white-space:nowrap;
}
.badge.green{background:#69f0ae;color:#0b3318}
.badge.muted{background:rgba(255,255,255,.15);color:#fff}
.players-pill{
  font-size:.82em;
  font-weight:800;
  color:rgba(255,255,255,.9);
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.16);
  padding:3px 9px;
  border-radius:99px;
  white-space:nowrap;
}
.awake-pill{
  border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.1);
  color:#fff;
  font-size:.78em;
  font-weight:800;
  padding:5px 10px;
  border-radius:99px;
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
}
.awake-pill.on{
  background:rgba(105,240,174,.18);
  border-color:rgba(105,240,174,.55);
  color:#b9f6ca;
}

/* --- Live Timer Progress Strip --- */
#rProgWrap{
  display:none;
  max-width:520px;
  width:100%;
  margin:0 auto;
  padding:0 12px 7px;
}
.rp-track{
  height:6px;
  background:rgba(255,255,255,.16);
  border-radius:99px;
  overflow:hidden;
}
.rp-fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#69f0ae,#ffdf5d);
  border-radius:99px;
  transition:width .14s linear,background .25s ease;
}
.rp-fill.preview{background:linear-gradient(90deg,#00e5ff,#ffdf5d)}
.rp-fill.urgent{background:linear-gradient(90deg,#ff1744,#ff9100)}
.rp-fill.paused{background:#ffdf5d;opacity:.65}

/* --- Main Stage --- */
#app{
  flex:1;
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:12px 12px 0;
  display:flex;
  flex-direction:column;
}
.stage-body{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-bottom:12px;
}

/* --- Cards & Callouts --- */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:15px;
  box-shadow:0 10px 28px rgba(0,0,0,.28);
}
.phase-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:8px;
}
.phase-tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:.76em;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.06em;
  padding:4px 10px;
  border-radius:99px;
  background:rgba(255,255,255,.14);
  color:var(--gold);
}
.q-counter{
  font-size:.82em;
  font-weight:900;
  background:#fff;
  color:var(--ink);
  padding:3px 11px;
  border-radius:99px;
}
h1{font-size:1.32em;margin:.2em 0;font-weight:900;letter-spacing:-.01em}
h2{font-size:1.18em;margin:.2em 0;font-weight:900}
.sub{font-size:.9em;opacity:.84;line-height:1.42;margin:4px 0 10px}

.q-stem{
  font-size:1.08em;
  font-weight:800;
  line-height:1.34;
  margin:4px 0 8px;
  text-align:left;
}
.live-metrics{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.14);
  border-radius:11px;
  padding:8px 11px;
  margin-top:8px;
  font-size:.92em;
}
.live-metrics b{color:var(--gold)}
.ans-meter{
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-weight:800;
}
.ans-mini-bar{
  width:52px;
  height:7px;
  background:rgba(255,255,255,.18);
  border-radius:99px;
  overflow:hidden;
}
.ans-mini-bar i{
  display:block;
  height:100%;
  background:var(--green-hi);
  border-radius:99px;
  transition:width .25s ease;
}

.key-box{
  display:flex;
  align-items:flex-start;
  gap:8px;
  background:rgba(38,137,12,.24);
  border:1px solid rgba(105,240,174,.45);
  border-radius:12px;
  padding:10px 12px;
  margin-top:9px;
  text-align:left;
  font-size:.95em;
  line-height:1.35;
}
.key-box b{color:#9cffbe}

.note-card{
  background:linear-gradient(180deg,#fffbeb,#fef08a);
  color:var(--ink);
  border-radius:13px;
  padding:11px 14px;
  text-align:left;
  font-size:.93em;
  line-height:1.4;
  font-weight:650;
  box-shadow:0 6px 18px rgba(0,0,0,.22);
}
.note-card b{color:#1e0842;font-weight:900}

.pend-card{
  background:linear-gradient(135deg,#ffdf5d,#ffc107);
  color:var(--ink);
  border-radius:13px;
  padding:11px 13px;
  text-align:left;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.pend-title{font-weight:900;font-size:.92em;margin-bottom:6px}
.pend-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:rgba(255,255,255,.55);
  border-radius:9px;
  padding:6px 9px;
  margin-top:5px;
  font-weight:800;
}
.pend-actions{display:flex;gap:6px;flex-shrink:0}
.pend-btn{
  border:0;
  border-radius:8px;
  padding:6px 12px;
  color:#fff;
  font-weight:900;
  font-size:.9em;
  cursor:pointer;
}
.pend-btn.ok{background:#26890c}
.pend-btn.no{background:#e21b3c}

.body-prev{
  max-height:175px;
  overflow-y:auto;
  white-space:pre-wrap;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:10px 12px;
  margin-top:8px;
  font-size:.9em;
  line-height:1.46;
  color:rgba(255,255,255,.92);
  text-align:left;
}

/* --- Results Detail --- */
.poll-row{
  position:relative;
  overflow:hidden;
  margin:6px 0;
  padding:8px 10px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.12);
  border-radius:9px;
  text-align:left;
  font-size:.91em;
}
.poll-fill{
  position:absolute;
  inset:0 auto 0 0;
  background:rgba(255,223,93,.20);
  pointer-events:none;
}
.poll-content{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}
.lens-tag{
  display:inline-block;
  font-size:.78em;
  background:rgba(255,223,93,.22);
  color:var(--gold);
  padding:1px 7px;
  border-radius:99px;
  margin-left:5px;
  font-weight:800;
}
.defend-box{
  margin-top:8px;
  padding:8px 10px;
  border-radius:9px;
  background:rgba(226,27,60,.2);
  border:1px solid rgba(255,138,128,.35);
  text-align:left;
  font-size:.9em;
  line-height:1.4;
}

/* --- Discussion / Chapter Timer Bar --- */
.disc-bar{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:10px;
  padding:9px 10px;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.16);
  border-radius:11px;
}
.disc-bar .ctrl-btn{flex:1;min-width:70px;padding:8px 8px;font-size:.86em}
.disc-bar input,.set-row input{
  width:62px;
  padding:7px 6px;
  border-radius:8px;
  border:0;
  text-align:center;
  font-weight:900;
  font-size:.95em;
  color:var(--ink);
  background:#fff;
}

/* --- Secondary Session Tools Drawer --- */
.tools-toggle{
  width:100%;
  padding:10px 13px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.24);
  color:rgba(255,255,255,.9);
  font-size:.88em;
  font-weight:800;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.tools-drawer{
  display:none;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.15);
  border-radius:13px;
  padding:10px;
  margin-top:6px;
}
.tools-drawer.open{display:block}
.set-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  margin-bottom:8px;
  padding:7px 10px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);
  border-radius:10px;
  flex-wrap:wrap;
  font-size:.88em;
  font-weight:750;
}
.set-row-right{display:flex;align-items:center;gap:6px}

/* --- Buttons & Sticky Bottom Thumb Dock --- */
.ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl-btn{
  padding:11px 10px;
  font-size:.94em;
  font-weight:800;
  border:1px solid rgba(255,255,255,.24);
  border-radius:11px;
  background:rgba(255,255,255,.13);
  color:#fff;
  cursor:pointer;
  transition:transform .08s,background .15s;
}
.ctrl-btn:active{transform:scale(.97)}
.ctrl-btn.on{
  background:linear-gradient(180deg,#2fa80f,#217a0a);
  border-color:rgba(255,255,255,.65);
}

.thumb-dock{
  position:sticky;
  bottom:0;
  z-index:45;
  margin:auto -12px 0;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(18,4,41,.75) 0%,rgba(18,4,41,.96) 30%);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.16);
}
.quick-tbar{
  display:grid;
  grid-template-columns:1.3fr repeat(3,1fr);
  gap:6px;
  margin-bottom:8px;
}
.quick-tbar .ctrl-btn{
  padding:9px 6px;
  font-size:.86em;
  border-radius:10px;
}
.skip-prev-btn{
  width:100%;
  padding:11px 12px;
  margin-bottom:8px;
  border:0;
  border-radius:11px;
  background:linear-gradient(180deg,#ffe57f,#ffc107);
  color:var(--ink);
  font-weight:900;
  font-size:.98em;
  cursor:pointer;
  box-shadow:0 3px 0 #b28704;
}
.big-btn{
  width:100%;
  font-size:1.24em;
  padding:16px 14px;
  border:0;
  border-radius:14px;
  background:linear-gradient(180deg,#2fa80f,#20780a);
  color:#fff;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 5px 0 #134e04,0 8px 22px rgba(0,0,0,.35);
  transition:opacity .15s,transform .08s;
  letter-spacing:.01em;
}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #134e04,0 4px 10px rgba(0,0,0,.3)}
.big-btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.big-btn.sec{
  background:linear-gradient(180deg,#1e7ae8,#1158b0);
  box-shadow:0 5px 0 #0a3975,0 8px 20px rgba(0,0,0,.3);
  font-size:1.08em;
  padding:14px;
}

/* --- Standby Launch Card --- */
.launch-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:15px;
  text-align:left;
  box-shadow:0 10px 28px rgba(0,0,0,.28);
}
.launch-card h3{
  margin:0 0 10px;
  text-align:center;
  font-size:1.06em;
  color:var(--gold);
  font-weight:900;
}
.seg{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  background:rgba(0,0,0,.36);
  padding:4px;
  border-radius:11px;
  margin-bottom:10px;
}
.seg button{
  padding:9px 8px;
  border:0;
  border-radius:8px;
  background:transparent;
  color:rgba(255,255,255,.78);
  font-weight:800;
  font-size:.94em;
  cursor:pointer;
}
.seg button.active{
  background:linear-gradient(135deg,#8e24aa,#5e35b1);
  color:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
}
.sel{
  width:100%;
  padding:12px;
  border-radius:11px;
  border:2px solid transparent;
  background:#fff;
  color:var(--ink);
  font-weight:800;
  font-size:.98em;
  margin-bottom:8px;
}
.sel:focus{outline:none;border-color:var(--gold)}
.sec-lbl{
  font-size:.76em;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:var(--gold);
  margin:10px 2px 5px;
}
.timer-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 8px}
.timer-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  background:rgba(0,0,0,.24);
  border:1px solid rgba(255,255,255,.16);
  padding:6px 9px;
  border-radius:9px;
  font-size:.82em;
  font-weight:750;
}
.timer-item input{
  width:54px;
  padding:5px;
  border-radius:7px;
  border:0;
  text-align:center;
  font-weight:900;
  font-size:.96em;
  color:var(--ink);
  background:#fff;
}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 8px}
.opt-pill{
  display:flex;
  align-items:center;
  gap:7px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  padding:8px 9px;
  border-radius:9px;
  font-size:.83em;
  font-weight:700;
  cursor:pointer;
  user-select:none;
  transition:background .12s,border-color .12s;
}
.opt-pill:has(input:checked){
  background:rgba(38,137,12,.28);
  border-color:rgba(105,240,174,.65);
}
.opt-pill input{width:16px;height:16px;margin:0;accent-color:#26890c;flex-shrink:0}
.bots-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(0,0,0,.24);
  border:1px solid rgba(255,255,255,.16);
  border-radius:10px;
  padding:8px 11px;
  margin:8px 0 10px;
  font-size:.88em;
  font-weight:800;
}
.bots-row input{
  width:64px;
  padding:5px 6px;
  border-radius:7px;
  border:0;
  text-align:center;
  font-weight:900;
  font-size:.98em;
  color:var(--ink);
  background:#fff;
}
.err-msg{
  background:rgba(226,27,60,.22);
  border:1px solid rgba(255,138,128,.45);
  border-radius:9px;
  padding:8px 10px;
  color:#ffb4b4;
  font-weight:800;
  font-size:.86em;
  margin:6px 0 10px;
  text-align:center;
  display:none;
}
</style></head><body>

<div id="topHud">
  <div class="hud-inner">
    <div class="hud-left" id="hudLeft">
      <span class="badge muted">🕹️ HOST REMOTE</span>
    </div>
    <button id="awakeBtn" class="awake-pill" onclick="toggleAwake()" title="Keep phone screen awake">☀️ <span id="awakeState">ON</span></button>
  </div>
  <div id="rProgWrap"><div class="rp-track"><div class="rp-fill" id="rProgFill"></div></div></div>
</div>

<div id="app"><div class="card" style="text-align:center;margin-top:20px">Loading remote…</div></div>

<script>
const qs = new URLSearchParams(location.search);
let rkey = qs.get('key') || '', pin = qs.get('pin') || '', host = qs.get('host') || '', S = {};
let lastKey = '', launchMode = 'quiz', quizCatalog = [], quizzesLoaded = false, launching = false;
let toolsOpen = false, pollStamp = performance.now();
const $ = document.getElementById('app'), sh = ["▲ ","◆ ","● ","■ "];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function post(u,b){
 const r = await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
 let d = {};
 try{ d = await r.json(); }catch(e){}
 d._status = r.status;
 return d;
}
async function next(){await post('/api/next',{pin,host});pollNow()}
async function ctl(action,sec=10){await post('/api/host_ctl',{pin,host,action,sec});pollNow()}
async function appr(name,ok){await post('/api/approve',{pin,host,name,approve:ok});pollNow()}
async function addBots(n=5){await post('/api/bots',{pin,host,count:n});pollNow()}

function toggleTools(){
 toolsOpen = !toolsOpen;
 const d = document.getElementById('toolsDrawer');
 const c = document.getElementById('toolsChev');
 if(d) d.classList.toggle('open', toolsOpen);
 if(c) c.textContent = toolsOpen ? '▴' : '▾';
}

function setHudStatus(mode){
 const hl = document.getElementById('hudLeft');
 const pw = document.getElementById('rProgWrap');
 if(!hl) return;
 if(mode === 'standby'){
  hl.innerHTML = `<span class="badge green">🟢 PAIRED STANDBY</span>`;
  if(pw) pw.style.display = 'none';
 } else if(mode === 'unpaired'){
  hl.innerHTML = `<span class="badge muted">🕹️ UNPAIRED</span>`;
  if(pw) pw.style.display = 'none';
 } else if(mode === 'live'){
  hl.innerHTML = `<span class="badge">🕹️ PIN ${esc(pin)}</span><span class="players-pill">👥 <span id="rPlayers">${S.n || 0} players</span></span>`;
 }
}

async function loadQuizzes(){
 if(quizzesLoaded) return;
 quizzesLoaded = true;
 try{
  const tok = localStorage.getItem('brainrush_token') || '';
  const r = await fetch('/api/quizzes?token=' + encodeURIComponent(tok));
  if(r.ok){
   const d = await r.json();
   quizCatalog = d.quizzes || [];
   populateSelect();
  }
 }catch(e){ quizzesLoaded = false; }
}

function populateSelect(){
 const sel = document.getElementById('mQuizSel');
 if(!sel) return;
 const prev = sel.value;
 const isCase = launchMode === 'case';
 const ph = isCase ? '— Select a Case Study —' : '— Select a Quiz —';
 const list = quizCatalog.filter(q => isCase ? !!q.case : !q.case);
 sel.innerHTML = `<option value="">${ph}</option>` + list.map(q => `<option value="${esc(q.file)}">${esc(q.title)}</option>`).join('');
 if(prev && list.some(q => q.file === prev)) sel.value = prev;
 else sel.value = '';
}

function setLaunchMode(m){
 launchMode = m;
 lastKey = '';
 renderStandby();
}

function renderOptsHtml(){
 if(launchMode === 'case'){
  return `
   <label class="opt-pill"><input type="checkbox" id="mIce"> 💭 Word Cloud</label>
   <label class="opt-pill"><input type="checkbox" id="mTeams"> 🛡️ Teams</label>
   <label class="opt-pill"><input type="checkbox" id="mMod"> 🛡️ Approve Names</label>
  `;
 }
 return `
  <label class="opt-pill"><input type="checkbox" id="mShuf"> 🎲 Shuffle Qs</label>
  <label class="opt-pill"><input type="checkbox" id="mIce"> 💭 Word Cloud</label>
  <label class="opt-pill"><input type="checkbox" id="mTeams"> 🛡️ Team Mode</label>
  <label class="opt-pill"><input type="checkbox" id="mWager"> 🎰 Final Boss</label>
  <label class="opt-pill"><input type="checkbox" id="mRedemp"> 🔄 Redemption</label>
  <label class="opt-pill"><input type="checkbox" id="mWheel"> 🎡 Mystery Wheel</label>
  <label class="opt-pill"><input type="checkbox" id="mHot"> 🔥 Hot Seat</label>

function chk(id){ const el = document.getElementById(id); return !!(el && el.checked); }
function numVal(id, def, lo, hi){
 const el = document.getElementById(id);
 const v = el ? parseInt(el.value, 10) : NaN;
 return isNaN(v) ? def : Math.max(lo, Math.min(hi, v));
}

async function launchFromPhone(){
 if(launching) return;
 const sel = document.getElementById('mQuizSel');
 const errEl = document.getElementById('mErr');
 const qf = sel ? sel.value : '';
 if(!qf){
  if(errEl){
   errEl.textContent = launchMode === 'case' ? 'Please select a Case Study first.' : 'Please select a Quiz first.';
   errEl.style.display = 'block';
  }
  return;
 }
 if(errEl) errEl.style.display = 'none';
 const bots = Math.max(0, Math.min(30, parseInt((document.getElementById('mBots')||{}).value, 10) || 0));
 const isCase = launchMode === 'case';
 const teamsOn = chk('mTeams');
 const payload = {
  quiz: qf,
  pair_key: rkey,
  qtime: isCase ? numVal('mCheckTime', 20, 5, 900) : numVal('mQTime', 15, 5, 900),
  preview: isCase ? numVal('mCasePrev', 5, 0, 120) : numVal('mPrevTime', 5, 0, 120),
  shuffle: isCase ? false : chk('mShuf'),
  icebreaker: chk('mIce'),
  teams: teamsOn,
  team_battle: isCase ? false : teamsOn,
  wager: isCase ? false : chk('mWager'),
  redemption: isCase ? false : chk('mRedemp'),
  wheel: isCase ? false : chk('mWheel'),
  hotseat: isCase ? false : chk('mHot'),
  tiebreak: isCase ? false : chk('mTie'),
  moderate: chk('mMod'),
  sabotage: false,
  speed: false,
  dbl: false,
  steal: false,
  auto: false,
  bots: bots,
  token: localStorage.getItem('brainrush_token') || '',
  password: sessionStorage.getItem('brainrush_pw') || ''
 };
 if(isCase){
  payload.discuss_time = numVal('mDiscTime', 60, 5, 900);
  payload.case_times = {
   poll: numVal('mPollTime', 45, 5, 900),
   rank: numVal('mRankTime', 60, 5, 900),
   open: numVal('mOpenTime', 120, 5, 900)
  };
 }
 launching = true;
 const btn = document.getElementById('mLaunchBtn');
 if(btn) btn.disabled = true;
 try{
  let r = await post('/api/create', payload);
  if(r.need_pw){
   const pw = window.prompt('Host password required:');
   if(!pw){
    if(errEl){ errEl.textContent = 'Host password required to create a session.'; errEl.style.display = 'block'; }
    return;
   }
   sessionStorage.setItem('brainrush_pw', pw);
   payload.password = pw;
   r = await post('/api/create', payload);
  }
  if(!r || !r.pin){
   if(errEl){ errEl.textContent = r.error || 'Could not create session.'; errEl.style.display = 'block'; }
   return;
  }
  pin = r.pin;
  host = r.host;
  lastKey = '';
  await pollOnce();
 }finally{
  launching = false;
  if(btn) btn.disabled = false;
 }
}

async function backToStandby(){
 if(rkey){
  try{ await post('/api/remote_pair', {key: rkey, clear: true}); }catch(e){}
 }
 pin = '';
 host = '';
 S = {};
 lastKey = '';
 renderStandby();
}

function buildKeyText(){
 if(S.case || S.qtype === 'info') return '';
 const prefix = (S.host_correct != null && S.host_correct >= 0) ? (sh[S.host_correct] || '') : '';
 if(S.host_ans) return prefix + S.host_ans;
 if(S.qtype === 'text') return (S.answers_correct || [''])[0] || '';
 if(S.qtype === 'order') return (S.answers_correct || []).join(' → ');
 if(S.correct != null && S.correct >= 0) return (sh[S.correct] || '') + ((S.answers || [])[S.correct] || '');
 return '';
}

 const el = document.getElementById('rDiscSec');
 const sec = Math.max(5, Math.min(900, parseInt(el && el.value, 10) || S.discuss_default || 60));
 ctl('discuss', sec);
}
function setRemoteTimer(){

function setRemoteAuto(){

}
function remoteDiscussBar(lbl){
 const defSec = S.discuss_default || 60;

 return `<div class="disc-bar">
  <div id="rDiscuss" data-lbl="${esc(lbl||'Discussion Timer')}" style="width:100%;font-weight:800;color:#ffdf5d;text-align:left;font-size:.9em"></div>

 </div>`;

function buildResultsDetail(denom){
 const qt = S.qtype || 'mc';
 if(qt === 'poll'){
  const cnts = S.counts || [];
  const sum = cnts.reduce((a, b) => a + b, 0);
  const tot = Math.max(1, sum);
  const lenses = S.lenses || [];
  const bars = (S.answers || []).map((a, i) => {
   const c = cnts[i] || 0;
   const pct = sum ? Math.round(100 * c / tot) : 0;
   const lns = lenses[i] ? `<span class="lens-tag">${esc(lenses[i])}</span>` : '';
   return `<div class="poll-row"><div class="poll-fill" style="width:${pct}%"></div><div class="poll-content"><span>${sh[i]||''}${esc(a)}${lns}</span><b>${pct}% (${c})</b></div></div>`;
  }).join('');
  const defs = (S.defenders || []).length
   ? `<div class="defend-box">🎤 <b>Call on to defend:</b><br>${S.defenders.map(d => `${sh[d.side]||''}<b>${esc(d.name)}</b> <small style="opacity:.85">(${esc((S.answers||[])[d.side]||'')})</small>`).join('<br>')}</div>`
   : '';
  return `
   <div style="margin-top:8px">${bars}</div>
   ${defs}
   ${remoteDiscussBar('Discussion Timer')}`;
 }
 if(qt === 'rank'){
  const items = (S.rank_avg || []).map((r, idx) => `<div class="poll-row"><div class="poll-content"><span><b>#${idx+1}</b> ${esc(r.item)}</span><small style="color:var(--gold);font-weight:800">avg #${esc(r.avg)}</small></div></div>`).join('');
  return `<div style="margin-top:8px;text-align:left"><div style="font-size:.9em;font-weight:800;margin-bottom:4px">📊 Priority Ranking (${S.rank_n || 0} ranked)</div>${items || '<div class="sub">No rankings submitted</div>'}</div>${remoteDiscussBar('Debrief Timer')}`;
 }
 if(qt === 'open'){
  const rs = S.responses || [];
  const top = rs.slice(0, 5).map(r => `<div class="poll-row"><div class="poll-content"><span>“${esc(r.text)}”</span>${r.votes ? `<b style="color:var(--gold)">👍 ${r.votes}</b>` : ''}</div></div>`).join('');
  return `<div style="margin-top:8px;text-align:left"><div style="font-size:.9em;font-weight:800;margin-bottom:4px">✍️ ${rs.length} response${rs.length === 1 ? '' : 's'} submitted</div>${top}</div>${remoteDiscussBar('Debrief Timer')}`;
 }
 if(qt === 'info') return '';
 const kt = buildKeyText();
 const accPct = denom > 0 ? Math.round(100 * (S.n_correct || 0) / denom) : 0;
 return `<div class="key-box"><span>✅</span><div><b>${esc(kt)}</b><div style="font-size:.86em;opacity:.88;margin-top:2px">${S.n_correct || 0} of ${denom} correct (${accPct}%)</div></div></div>`;
}

function updTopBar(){
 const pw = document.getElementById('rProgWrap');
 const pf = document.getElementById('rProgFill');
 if(!pw || !pf) return;
 if(!pin || !host || S.phase !== 'question' || S.qtype === 'info'){
  pw.style.display = 'none';
  return;
 }
 pw.style.display = 'block';
 const elapsed = S.paused ? 0 : Math.max(0, (performance.now() - pollStamp) / 1000);
 const pv = S.preview_left || 0;
 if(pv > 0){
  const rem = Math.max(0, pv - elapsed);
  const tot = Math.max(1, S.preview_total || 5);
  pf.style.width = Math.min(100, (rem / tot) * 100) + '%';
  pf.className = 'rp-fill preview' + (S.paused ? ' paused' : '');
 } else {
  const rem = Math.max(0, (S.left || 0) - elapsed);
  const tot = Math.max(1, S.qtime || 15);
  pf.style.width = Math.min(100, (rem / tot) * 100) + '%';
  pf.className = 'rp-fill' + (S.paused ? ' paused' : (rem <= 5 ? ' urgent' : ''));
 }
}
setInterval(updTopBar, 140);

        <input id="rAutoSec" type="number" min="2" max="120" value="${S.auto_time || 7}" onkeydown="if(event.key==='Enter')setRemoteAuto()">
        <span>s</span>
        <button class="ctrl-btn" style="padding:7px 13px" onclick="setRemoteAuto()">Set</button>
       </div>
      </div>`
   : '';
  const toolsHtml = showTools ? `
   <div>
    <button type="button" class="tools-toggle" onclick="toggleTools()">
     <span>⚙️ Session &amp; Custom Timer Tools${!isCaseGame && S.auto ? ' · Auto ON' : ''}</span>
     <span id="toolsChev">${toolsOpen ? '▴' : '▾'}</span>
    </button>
    <div id="toolsDrawer" class="tools-drawer ${toolsOpen ? 'open' : ''}">
     ${timerSetRow}
     ${autoSetRow}
     <div class="ctrl-grid">
      ${!isCaseGame ? `<button class="ctrl-btn ${S.auto ? 'on' : ''}" onclick="ctl('toggle_auto')">⏭️ Auto: ${S.auto ? 'ON' : 'Off'}</button>` : ''}
      <button class="ctrl-btn" onclick="addBots(5)">🤖 +5 Bots</button>
     </div>
    </div>
   </div>` : '';

  const dockHtml = ph !== 'final' ? `
   <div class="thumb-dock">
    ${inPrev ? `<button class="skip-prev-btn" onclick="ctl('skip_preview')">⏭️ Open Answers Now (Skip Preview)</button>` : ''}
    ${ph === 'question' && S.qtype !== 'info' ? `
     <div class="quick-tbar">
      <button class="ctrl-btn" onclick="ctl('pause')">${S.paused ? '▶️ Resume' : '⏸️ Pause'}</button>
      <button class="ctrl-btn" onclick="ctl('add_time',-10)">-10s</button>
      <button class="ctrl-btn" onclick="ctl('add_time',10)">+10s</button>
      <button class="ctrl-btn" onclick="ctl('add_time',30)">+30s</button>
     </div>` : ''}
    <button class="big-btn" onclick="next()" ${startDisabled ? 'disabled' : ''}>${mainLbl}<span id="rAutoLeft"></span></button>
   </div>` : '';

  $.innerHTML = `
   <div class="stage-body">
    ${pendHtml}
    ${stageCard}
    ${noteHtml}
    ${toolsHtml}
   </div>
   ${dockHtml}
  `;
  setAwakeLabel();
 }
 updateLiveText();
}

let pollTimer = null, polling = false;
async function pollOnce(){
 if(polling) return;
 polling = true;
 try{
  if(!pin || !host){
   if(rkey){
    renderStandby();
    const r = await fetch('/api/remote_pair?key=' + encodeURIComponent(rkey));
    if(r.ok){
     const d = await r.json();
     if(d.paired && d.pin && d.host){
      pin = d.pin;
      host = d.host;
      lastKey = '';
      polling = false;
      return await pollOnce();
     }
    }
    return;
   }
   if(lastKey !== 'unpaired'){
    lastKey = 'unpaired';
    setHudStatus('unpaired');
    $.innerHTML = `<div class="stage-body"><div class="card" style="text-align:center;margin-top:16px"><div style="font-size:2.6em">📱</div><h2>Pair Your Phone Remote</h2><p class="sub">Click the <b>📱 Remote</b> button on your computer's Host screen and scan the QR code to pair this phone.</p></div></div>`;
   }
   return;
  }
  const url = '/api/state?pin=' + encodeURIComponent(pin) + '&host=' + encodeURIComponent(host) + (rkey ? '&key=' + encodeURIComponent(rkey) : '');
  const r = await fetch(url);
  if(!r.ok){
   let err = {};
   try{ err = await r.json(); }catch(e){}
   if(err.repaired && err.repaired.pin && err.repaired.host){
    pin = err.repaired.pin;
    host = err.repaired.host;
    lastKey = '';
    polling = false;
    return await pollOnce();
   }
   if(rkey){
    pin = '';
    host = '';
    S = {};
    lastKey = '';
    renderStandby();
    return;
   }
   if(lastKey !== 'ended'){
    lastKey = 'ended';
    setHudStatus('unpaired');
    $.innerHTML = `<div class="stage-body"><div class="card" style="text-align:center;margin-top:16px"><div style="font-size:2.4em">😴</div><h2>Session Ended</h2><p class="sub">This game has closed or is no longer active.</p></div></div>`;
   }
   return;
  }
  S = await r.json();
  pollStamp = performance.now();
  if(S.repaired && S.repaired.pin && S.repaired.pin !== pin){
   pin = S.repaired.pin;
   host = S.repaired.host;
   lastKey = '';
   polling = false;
   return await pollOnce();
  }
  if(S.phase === 'final' && rkey){
   try{
    const pr = await fetch('/api/remote_pair?key=' + encodeURIComponent(rkey));
    if(pr.ok){
     const pd = await pr.json();
     if(pd.paired && pd.pin && pd.pin !== pin){
      pin = pd.pin;
      host = pd.host;
      lastKey = '';
      polling = false;
      return await pollOnce();
     }
    }
   }catch(e){}
  }
  render();
 }catch(e){}
 finally{ polling = false; }
}

function scheduleNext(){
 clearTimeout(pollTimer);
 const delay = (!pin || !host) ? 900 : 700;
 pollTimer = setTimeout(async ()=>{ await pollOnce(); scheduleNext(); }, delay);
}
async function pollNow(){
 clearTimeout(pollTimer);
 await pollOnce();
 scheduleNext();
}
pollNow();

// ===== Keep screen awake (Screen Wake Lock API) =====
let wakeLock = null;
function setAwakeLabel(txt){
 const el = document.getElementById('awakeState'), b = document.getElementById('awakeBtn');
 const off = localStorage.getItem('brainrush_awake') === '0';
 if(el) el.textContent = txt || (off ? 'Off' : (wakeLock ? 'ON' : 'ON'));
 if(b) b.classList.toggle('on', !off);
}
async function acquireWake(){
 if(localStorage.getItem('brainrush_awake') === '0') return;
 if(!('wakeLock' in navigator)){ setAwakeLabel('N/A'); return; }
 if(wakeLock || document.visibilityState !== 'visible') return;
 try{
  wakeLock = await navigator.wakeLock.request('screen');
  wakeLock.addEventListener('release', ()=>{ wakeLock = null; setAwakeLabel(); });
  setAwakeLabel();
 }catch(e){ wakeLock = null; setAwakeLabel(); }
}
function toggleAwake(){
 const on = localStorage.getItem('brainrush_awake') !== '0';
 localStorage.setItem('brainrush_awake', on ? '0' : '1');
 if(on){ if(wakeLock){ wakeLock.release(); wakeLock = null; } } else acquireWake();
 setAwakeLabel();
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') acquireWake(); });
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev, ()=>{ if(!wakeLock) acquireWake(); }, {passive:true}));
acquireWake();
</script></body></html>
