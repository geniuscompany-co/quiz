<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brainrush! — Solo Practice</title>
<style>
:root{
  --bg1:#6827d6;
  --bg2:#46178f;
  --bg3:#23094d;
  --surface:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.20);
  --gold:#ffdf5d;
  --green:#26890c;
  --ink:#2b0d57;
  --radius:16px;
  --radius-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100vh;min-height:100dvh}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at 50% -12%,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%) fixed;
  color:#fff;
  text-align:center;
  display:flex;
  flex-direction:column;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
body.hc{background:#000!important}
body.hc .card-panel,body.hc .q-card{background:#111;border:2px solid #fff}

/* --- Sticky Top HUD --- */
#topHud{
  position:sticky;
  top:0;
  z-index:55;
  width:100%;
  background:rgba(22,7,50,.80);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.14);
}
.hud-inner{
  max-width:560px;
  margin:0 auto;
  padding:7px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:46px;
}
.hud-left,.hud-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hud-btn{
  padding:5px 10px;
  font-size:.82em;
  font-weight:800;
  border-radius:99px;
  border:1px solid rgba(255,255,255,.26);
  background:rgba(255,255,255,.12);
  color:#fff;
  cursor:pointer;
  line-height:1.2;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.hud-btn:active{transform:scale(.95)}
.hud-stats{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.16);
  border-radius:99px;
  padding:4px 11px;
  font-size:.82em;
  font-weight:800;
}
.hud-stats .hs-score{color:var(--gold)}
.hud-stats .hs-streak{color:#ffab40}

/* --- Timer Strip --- */
.timer-wrap{
  max-width:560px;
  width:100%;
  margin:0 auto;
  padding:0 12px 7px;
  display:flex;
  align-items:center;
  gap:8px;
}
.bar{
  flex:1;
  height:8px;
  background:rgba(255,255,255,.18);
  border-radius:99px;
  overflow:hidden;
  margin:0;
}
.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#69f0ae,#ffdf5d);
  border-radius:99px;
  transition:width .18s linear,background .2s ease;
}
.bar i.urgent{background:linear-gradient(90deg,#ff1744,#ff9100)}
.tlbl-pill{
  font-size:.78em;
  font-weight:900;
  color:var(--gold);
  min-width:56px;
  text-align:right;
  white-space:nowrap;
}
.tlbl-pill.urgent{color:#ff8a80}

/* --- Main Stage --- */
#app{
  flex:1;
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
}

.card-panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 16px;
  box-shadow:0 10px 28px rgba(0,0,0,.25);
  backdrop-filter:blur(6px);
}
.logo{
  max-width:190px;
  max-height:84px;
  width:auto;
  border-radius:14px;
  margin:0 auto 8px;
  display:block;
  box-shadow:0 6px 18px rgba(0,0,0,.32);
  object-fit:contain;
}
h1{font-size:1.48em;font-weight:900;margin:.15em 0;letter-spacing:-.01em}
.sub{font-size:.9em;opacity:.84;margin:2px 0 12px;line-height:1.4}

.field-lbl{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:.76em;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  opacity:.85;
  margin:8px 2px 4px;
}
select,input[type=text],input[type=number]{
  display:block;
  width:100%;
  box-sizing:border-box;
  font-size:1.1em;
  padding:12px 14px;
  margin:0 0 8px;
  border-radius:var(--radius-sm);
  border:2px solid transparent;
  text-align:center;
  color:var(--ink);
  font-weight:800;
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
  font-family:inherit;
}
select:focus,input:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,223,93,.35);
}
input::placeholder{font-weight:650;opacity:.54;font-size:.86em}

.timer-opt-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--radius-sm);
  padding:9px 12px;
  margin:4px 0 10px;
  font-weight:800;
  font-size:.92em;
  flex-wrap:wrap;
}
.timer-opt-row label{
  display:inline-flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  user-select:none;
}
.timer-opt-row input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:#26890c}
.timer-sec-box{display:inline-flex;align-items:center;gap:6px}
#pTime{
  display:inline-block;
  width:72px;
  padding:6px 8px;
  margin:0;
  font-size:.98em;
  border-radius:8px;
}

.err-banner{
  background:rgba(226,27,60,.24);
  border:1px solid rgba(255,138,128,.5);
  color:#ffcdd2;
  border-radius:10px;
  padding:8px 12px;
  font-weight:800;
  font-size:.9em;
  margin:4px 0 8px;
  display:none;
}

button.go{
  width:100%;
  font-size:1.22em;
  padding:14px 18px;
  border:0;
  border-radius:13px;
  background:linear-gradient(180deg,#2fa80f,#217a0a);
  color:#fff;
  font-weight:900;
  cursor:pointer;
  margin-top:6px;
  box-shadow:0 5px 0 #145205,0 8px 20px rgba(0,0,0,.28);
  transition:transform .08s,filter .15s;
}
button.go:hover{filter:brightness(1.05)}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #145205,0 4px 10px rgba(0,0,0,.24)}
button.go.blue{
  background:linear-gradient(180deg,#1e7ae8,#1158b0);
  box-shadow:0 5px 0 #0a3975,0 8px 18px rgba(0,0,0,.26);
}
button.sec{
  background:rgba(255,255,255,.14);
  color:#fff;
  border:1px solid rgba(255,255,255,.24);
  border-radius:11px;
  padding:10px 16px;
  font-size:.95em;
  font-weight:800;
  cursor:pointer;
  margin:6px 4px 0;
}
button.sec:active{transform:scale(.97)}

.plink{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:12px;
  padding:7px 14px;
  border-radius:99px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  text-decoration:none;
  font-size:.88em;
  font-weight:800;
}

/* --- Question Card & Tactile 2x2 Grid --- */
.q-card{
  background:rgba(20,6,46,.52);
  border:1px solid rgba(255,255,255,.18);
  border-radius:15px;
  padding:13px 14px;
  margin-bottom:10px;
  box-shadow:0 6px 20px rgba(0,0,0,.22);
}
.qnum{
  display:inline-block;
  background:#fff;
  color:#46178f;
  font-weight:900;
  font-size:.8em;
  padding:3px 12px;
  border-radius:99px;
  margin-bottom:6px;
}
.q{
  font-size:clamp(1.08rem,3.8vw,1.35rem);
  font-weight:850;
  line-height:1.32;
  margin:2px 0;
}
.q-img{
  max-height:190px;
  max-width:100%;
  border-radius:11px;
  margin:8px auto 2px;
  display:block;
  background:#fff;
  object-fit:contain;
  cursor:zoom-in;
  box-shadow:0 4px 12px rgba(0,0,0,.28);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:2px;
}
.grid button{
  min-height:124px;
  padding:12px 10px;
  border:0;
  border-radius:14px;
  color:#fff;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:850;
  font-size:1.05em;
  line-height:1.22;
  word-break:break-word;
  transition:transform .08s,opacity .2s,box-shadow .2s;
  text-shadow:0 1px 2px rgba(0,0,0,.28);
}
.grid button:active:not(:disabled){transform:translateY(3px)}
.grid button .sh{
  font-size:1.45em;
  line-height:1;
  background:rgba(0,0,0,.18);
  width:34px;
  height:34px;
  border-radius:9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.grid button img{max-height:84px;max-width:100%;border-radius:8px;background:#fff}

.c0{background:linear-gradient(180deg,#ef2346,#d01637);box-shadow:0 5px 0 #940d24,0 6px 14px rgba(0,0,0,.24)}
.c1{background:linear-gradient(180deg,#1b75e0,#115bb5);box-shadow:0 5px 0 #0a3c7a,0 6px 14px rgba(0,0,0,.24)}
.c2{background:linear-gradient(180deg,#e5a900,#c68f00);box-shadow:0 5px 0 #8c6400,0 6px 14px rgba(0,0,0,.24)}
.c3{background:linear-gradient(180deg,#2d9e0f,#217c09);box-shadow:0 5px 0 #145004,0 6px 14px rgba(0,0,0,.24)}

body.cb .c0{background:#D55E00;box-shadow:0 5px 0 #8f3e00}
body.cb .c1{background:#0072B2;box-shadow:0 5px 0 #004973}
body.cb .c2{background:#F0E442;color:#1b1b1b!important;text-shadow:none;box-shadow:0 5px 0 #a89e14}
body.cb .c2 .sh{background:rgba(0,0,0,.12)}
body.cb .c3{background:#009E73;box-shadow:0 5px 0 #00664a}
body.hc .grid button{border:3px solid #fff}

.grid button.right{
  outline:4px solid #fff;
  box-shadow:0 0 0 3px #69f0ae,0 0 24px rgba(105,240,174,.75)!important;
  transform:scale(1.02);
}
.grid button.picked:not(.right){
  outline:3px solid rgba(255,255,255,.8);
}
.grid button.dim{opacity:.28;filter:grayscale(.25)}

/* --- Order Slots --- */
.slot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.26);
  border-radius:10px;
  padding:9px 12px;
  margin:5px 0;
  font-weight:800;
  text-align:left;
  cursor:pointer;
}
.slot b{color:var(--gold);margin-right:6px}
.slot .rm{opacity:.7;font-size:.85em}

/* --- Feedback & Explanation --- */
.fb{
  margin-top:12px;
  padding:13px 15px;
  border-radius:13px;
  font-weight:850;
  font-size:1.14em;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.fb.ok{background:linear-gradient(135deg,#2e9e10,#1e7308);border:1px solid rgba(105,240,174,.5)}
.fb.no{background:linear-gradient(135deg,#d32f2f,#9a1b1b);border:1px solid rgba(255,138,128,.45)}
blockquote{
  background:#fff;
  color:var(--ink);
  border-left:5px solid var(--gold);
  border-radius:11px;
  padding:11px 14px;
  margin:10px 0 4px;
  font-style:italic;
  text-align:left;
  font-weight:600;
  line-height:1.4;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}

/* --- Finish Summary & Missed Review --- */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0;
}
.stat{
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  padding:10px 8px;
  font-weight:750;
  font-size:.84em;
}
.stat b{
  display:block;
  font-size:1.45em;
  font-weight:900;
  color:var(--gold);
  margin-bottom:2px;
}
.review-box{
  background:rgba(0,0,0,.26);
  border:1px solid rgba(255,255,255,.16);
  border-radius:13px;
  padding:12px 14px;
  margin:10px 0;
  text-align:left;
}
.review-box h3{margin:0 0 8px;font-size:1em;color:var(--gold)}
.missed{
  border-top:1px solid rgba(255,255,255,.14);
  padding:9px 0;
  font-size:.92em;
  line-height:1.38;
}
.missed:first-of-type{border-top:0;padding-top:2px}

/* --- Lightbox & Confetti --- */
#imgOv{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:90;
  align-items:center;
  justify-content:center;
  padding:16px;
}
#imgOv img{max-width:96vw;max-height:90vh;border-radius:12px;background:#fff}
#fx{position:fixed;inset:0;pointer-events:none;z-index:85}
</style></head><body>

<div id="topHud">
  <div class="hud-inner">
    <div class="hud-left">
      <button id="sfxBtn" class="hud-btn" onclick="toggleSfx()" title="Sound effects">🔊</button>
      <button id="a11y" class="hud-btn" onclick="cycleA11y()" title="Colorblind / High-contrast">👁️</button>
    </div>
    <div class="hud-right" id="hudStats">
      <span class="hud-stats">🧑‍🎓 Solo Practice</span>
    </div>
  </div>
  <div class="timer-wrap" id="hudTimer" style="display:none">
    <div class="bar"><i id="tb" style="width:100%"></i></div>
    <span class="tlbl-pill" id="tlbl">⏱️ 20s</span>
  </div>
</div>

<div id="app"></div>
<div id="imgOv" onclick="this.style.display='none'"><img id="imgBig" alt=""></div>
<canvas id="fx"></canvas>

<script>
const $ = document.getElementById('app'), sh = ["▲","◆","●","■"];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function qtype(q){return q.type||'mc'}
function zoomImg(src){ document.getElementById('imgBig').src = src; document.getElementById('imgOv').style.display = 'flex'; }

/* --- Accessibility & Sound --- */
function applyA11y(){
  let a = 'off';
  try{ a = localStorage.getItem('brainrush_a11y') || 'off'; }catch(e){}
  document.body.classList.toggle('cb', a === 'cb');
  document.body.classList.toggle('hc', a === 'hc');
  const b = document.getElementById('a11y');
  if(b) b.textContent = a === 'cb' ? '👁️ CB' : a === 'hc' ? '👁️ HC' : '👁️';
}
function cycleA11y(){
  const o = ['off','cb','hc'];
  let a = 'off';
  try{ a = localStorage.getItem('brainrush_a11y') || 'off'; }catch(e){}
  const nx = o[(o.indexOf(a) + 1) % 3];
  try{ localStorage.setItem('brainrush_a11y', nx); }catch(e){}
  applyA11y();
}
applyA11y();

let ac = null, sfxOn = true;
try{ sfxOn = localStorage.getItem('brainrush_sfx') !== '0'; }catch(e){}
function unlockAudio(){
  try{
    if(!ac){ const C = window.AudioContext || window.webkitAudioContext; if(C) ac = new C(); }
    if(ac && ac.state === 'suspended') ac.resume();
  }catch(e){}
}
window.addEventListener('pointerdown', unlockAudio, {passive:true});
function beep(f, d, type, v, delay){
  if(!sfxOn || !ac) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(v || .22, t + .015);
  g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
function sfxCorrect(){ [523.25,659.25,783.99].forEach((f,i)=>beep(f,.15,'triangle',.25,i*.08)); }
function sfxWrong(){ beep(196,.24,'sawtooth',.16,0); beep(147,.3,'sawtooth',.16,.11); }
function updSfx(){ const b = document.getElementById('sfxBtn'); if(b) b.textContent = sfxOn ? '🔊' : '🔇'; }
function toggleSfx(){
  sfxOn = !sfxOn;
  try{ localStorage.setItem('brainrush_sfx', sfxOn ? '1' : '0'); }catch(e){}
  updSfx();
  if(sfxOn){ unlockAudio(); sfxCorrect(); }
}
updSfx();

function confettiBurst(){
  const c = document.getElementById('fx'); c.width = innerWidth; c.height = innerHeight;
  const ctx = c.getContext('2d'), cols = ['#ff2e63','#08d9d6','#ffde7d','#7dff6b','#fff','#ff9800'];
  const ps = Array.from({length:75}, ()=>({x:innerWidth/2, y:innerHeight*.28, vx:(Math.random()-.5)*11, vy:-4-Math.random()*8, s:5+Math.random()*6, col:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, va:(Math.random()-.5)*.3}));
  const t0 = performance.now();
  (function loop(now){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.vy += .34; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
    if(now - t0 < 1700) requestAnimationFrame(loop); else ctx.clearRect(0,0,c.width,c.height);
  })(t0);
}

function syncHud(){
  const hs = document.getElementById('hudStats');
  const ht = document.getElementById('hudTimer');
  if(!run || run.i >= run.qs.length){
    if(hs) hs.innerHTML = `<span class="hud-stats">🧑‍🎓 Solo Practice</span>`;
    if(ht) ht.style.display = 'none';
    return;
  }
  if(hs){
    hs.innerHTML = `<span class="hud-stats"><span>Q ${run.i+1}/${run.qs.length}</span><span class="hs-score">⭐ ${run.score}</span>${run.streak >= 2 ? `<span class="hs-streak">🔥 ${run.streak}</span>` : ''}</span>`;
  }
  if(ht) ht.style.display = run.timed ? 'flex' : 'none';
}

let quizzes = [], run = null, lastFile = '';
async function setup(){
  stopTimer();
  run = null;
  syncHud();
  try{ quizzes = (await (await fetch('/api/quizzes')).json()).quizzes || []; }catch(e){}
  const qPool = quizzes.filter(q => !q.case);
  const list = qPool.length ? qPool : quizzes;
  $.innerHTML = `
    <div class="card-panel">
      <img class="logo" src="/logo.jpg" alt="" onerror="this.style.display='none'">
      <h1>🧑‍🎓 Solo Practice</h1>
      <p class="sub">Study at your own pace with instant explanations. Scores stay private on your device.</p>

      <div class="field-lbl"><span>Choose a Quiz</span></div>
      <select id="qs">
        <option value="">— Select a Quiz —</option>
        ${list.map(q => `<option value="${esc(q.file)}" data-n="${q.count}" ${q.file === lastFile ? 'selected' : ''}>${esc(q.title)} (${q.count} Qs)</option>`).join('')}
      </select>

      <div class="field-lbl"><span>Question Count</span><span style="opacity:.7;text-transform:none;letter-spacing:0">Optional</span></div>
      <input id="cnt" type="number" min="1" value="" placeholder="How many questions? (blank = all)">

      <div class="timer-opt-row">
        <label><input type="checkbox" id="timed"> ⏱️ Countdown timer</label>
        <span class="timer-sec-box">
          <input id="pTime" type="number" min="5" max="600" value="20">
          <span style="font-size:.88em;opacity:.85">sec</span>
        </span>
      </div>

      <div id="pErr" class="err-banner"></div>
      <button class="go" onclick="start()">▶️ Start Practice</button>
    </div>
    <div><a class="plink" href="/play">🎮 Back to Live Game</a></div>
  `;
  const sel = document.getElementById('qs');
  sel.onchange = () => {
    const opt = sel.selectedOptions[0];
    const n = opt && opt.dataset ? opt.dataset.n : '';
    const cEl = document.getElementById('cnt');
    if(n){
      cEl.max = n;
      cEl.placeholder = `How many questions? (1–${n}, blank = all)`;
    } else {
      cEl.removeAttribute('max');
      cEl.placeholder = 'How many questions? (blank = all)';
    }
  };
  sel.onchange();
}

async function start(customQs){
  let qs = customQs;
  let timed = run ? run.timed : false;
  let tMax = run ? run.tMax : 20;
  if(!qs){
    const sel = document.getElementById('qs');
    const file = sel ? sel.value : lastFile;
    const errEl = document.getElementById('pErr');
    if(!file){
      if(errEl){ errEl.textContent = 'Please select a quiz first.'; errEl.style.display = 'block'; }
      return;
    }
    lastFile = file;
    if(errEl) errEl.style.display = 'none';
    const cntEl = document.getElementById('cnt');
    const rawCnt = cntEl ? parseInt(cntEl.value, 10) : NaN;
    const tmEl = document.getElementById('timed');
    timed = tmEl ? tmEl.checked : timed;
    const ptEl = document.getElementById('pTime');
    tMax = Math.max(5, Math.min(600, parseInt(ptEl ? ptEl.value : tMax, 10) || 20));
    const r = await (await fetch('/api/quiz_data?file=' + encodeURIComponent(file))).json();
    qs = (r.questions || []).slice();
    for(let i = qs.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [qs[i], qs[j]] = [qs[j], qs[i]];
    }
    qs = qs.filter(q => !['poll','open','rank','info'].includes(q.type));
    if(!isNaN(rawCnt) && rawCnt > 0) qs = qs.slice(0, rawCnt);
  }
  if(!qs.length) return;
  run = {qs, i:0, score:0, streak:0, best:0, right:0, missed:[], missedQ:[], timed, tMax, t:tMax, timer:null, sel:[], perm:null, done:false};
  show();
}

function stopTimer(){ if(run && run.timer){ clearInterval(run.timer); run.timer = null; } }

function show(){
  stopTimer();
  if(run.i >= run.qs.length) return finish();
  const q = run.qs[run.i], t = qtype(q);
  run.done = false;
  run.sel = [];
  const qSec = (q.t_custom && q.t >= 5) ? q.t : run.tMax;
  syncHud();

  if(t === 'order'){
    const n = q.a.length;
    let p = [...Array(n).keys()];
    for(let k = 0; k < 12; k++){
      p.sort(() => Math.random() - .5);
      if(p.some((v, i) => v !== i)) break;
    }
    run.perm = p;
  }

  let body = '';
  if(t === 'text'){
    body = `<div class="card-panel" style="padding:14px"><input type="text" id="txt" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')submitText()"><button class="go" onclick="submitText()">Submit Answer</button></div>`;
  } else if(t === 'order'){
    body = `<div class="sub" style="margin:2px 0 8px;font-weight:750">Tap items in the correct order (tap a placed slot to remove):</div><div id="ord"></div>`;
  } else {
    body = `<div class="grid">${q.a.map((a,i)=>`<button class="c${i}" onclick="pick(${i})">${q.aimg && q.aimg[i] ? `<img src="${esc(q.aimg[i])}" alt="">` : ''}<span class="sh">${sh[i]}</span><span>${esc(a)}</span></button>`).join('')}</div>`;
  }

  $.innerHTML = `
    <div class="q-card">
      <div class="qnum">Question ${run.i+1} of ${run.qs.length}</div>
      <div class="q">${esc(q.q)}</div>
      ${q.img ? `<img class="q-img" src="${esc(q.img)}" alt="" onclick="zoomImg(this.src)">` : ''}
    </div>
    ${body}
    <div id="fb"></div>
  `;

  if(t === 'order') drawOrder();
  if(t === 'text'){ const e = document.getElementById('txt'); if(e) e.focus(); }
  if(run.timed){
    run.t = qSec;
    const b0 = document.getElementById('tb'), l0 = document.getElementById('tlbl');
    if(b0){ b0.style.width = '100%'; b0.className = ''; }
    if(l0){ l0.textContent = '⏱️ ' + qSec + 's'; l0.className = 'tlbl-pill'; }
    run.timer = setInterval(() => {
      run.t -= 0.2;
      const b = document.getElementById('tb'), l = document.getElementById('tlbl');
      const urg = run.t <= 5;
      if(b){
        b.style.width = Math.max(0, run.t / qSec * 100) + '%';
        b.className = urg ? 'urgent' : '';
      }
      if(l){
        l.textContent = '⏱️ ' + Math.max(0, Math.ceil(run.t)) + 's';
        l.className = 'tlbl-pill' + (urg ? ' urgent' : '');
      }
      if(run.t <= 0){ stopTimer(); grade(false, '(time ran out)'); }
    }, 200);
  }
}

function pick(i){ if(run.done) return; const q = run.qs[run.i]; grade(i === q.c, q.a[i], i); }
function submitText(){ if(run.done) return; const q = run.qs[run.i]; const v = document.getElementById('txt').value; if(!v.trim()) return; grade(q.a.some(a => norm(a) === norm(v)), v); }

function drawOrder(){
  const q = run.qs[run.i], el = document.getElementById('ord');
  if(!el) return;
  const disp = run.perm.map(k => q.a[k]);
  el.innerHTML =
    run.sel.map((j, n) => `<div class="slot" onclick="removeOrd(${n})"><span><b>#${n+1}</b> ${esc(disp[j])}</span><span class="rm">✕</span></div>`).join('') +
    `<div class="grid">${disp.map((a, j) => run.sel.includes(j) ? '' : `<button class="c${j%4}" style="min-height:74px" onclick="tapOrd(${j})"><span>${esc(a)}</span></button>`).join('')}</div>` +
    `<div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px">${run.sel.length ? `<button class="sec" style="margin:0" onclick="run.sel.pop();drawOrder()">↩ Undo</button>` : ''}${run.sel.length === disp.length ? `<button class="go" style="margin:0;flex:1" onclick="submitOrder()">✅ Submit Order</button>` : ''}</div>`;
}
function tapOrd(j){ if(run.done) return; run.sel.push(j); drawOrder(); }
function removeOrd(pos){ if(run.done) return; run.sel.splice(pos, 1); drawOrder(); }
function submitOrder(){
  const q = run.qs[run.i];
  const orig = run.sel.map(j => run.perm[j]);
  grade(orig.every((v, i) => v === i), orig.map(k => q.a[k]).join(' → '));
}

function ansText(q){
  const t = qtype(q);
  return t === 'order' ? q.a.join(' → ') : t === 'text' ? q.a.slice(0, 3).join(' / ') : q.a[q.c];
}

function grade(ok, given, idx){
  if(run.done) return;
  run.done = true;
  stopTimer();
  const q = run.qs[run.i];
  let pts = 0;
  if(ok){
    run.streak++;
    run.best = Math.max(run.best, run.streak);
    run.right++;
    pts = 100 + Math.min(100, (run.streak - 1) * 25);
    run.score += pts;
    sfxCorrect();
  } else {
    run.streak = 0;
    run.missed.push({q: q.q, your: given, ans: ansText(q)});
    run.missedQ.push(q);
    sfxWrong();
  }
  syncHud();

  document.querySelectorAll('.grid button').forEach((b, i) => {
    b.disabled = true;
    if(qtype(q) === 'mc' || qtype(q) === 'tf'){
      if(i === idx) b.classList.add('picked');
      if(i === q.c) b.classList.add('right');
      else b.classList.add('dim');
    }
  });

  const fb = document.getElementById('fb');
  fb.innerHTML = `
    <div class="fb ${ok ? 'ok' : 'no'}">
      ${ok ? `✅ Correct! +${pts} pts${run.streak > 1 ? ' · 🔥 ' + run.streak + ' streak' : ''}` : '❌ Not quite'}
      ${ok ? '' : `<div style="font-size:.86em;font-weight:750;margin-top:4px;opacity:.95">Correct answer: <b>${esc(ansText(q))}</b></div>`}
    </div>
    ${q.quote ? `<blockquote>“${esc(q.quote)}”</blockquote>` : ''}
    <button class="go" onclick="run.i++;show()">${run.i + 1 >= run.qs.length ? '🏆 See Final Results' : 'Next Question ➔'}</button>
  `;
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function retryMissed(){
  if(!run || !run.missedQ || !run.missedQ.length) return;
  start(run.missedQ.slice());
}

function finish(){
  syncHud();
  const pct = Math.round(100 * run.right / run.qs.length);
  if(pct >= 80) confettiBurst();
  $.innerHTML = `
    <div class="card-panel">
      <div style="font-size:3em;line-height:1">${pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : '💪'}</div>
      <h1>Practice Complete!</h1>
      <div class="stats-grid">
        <div class="stat"><b>${pct}%</b>${run.right}/${run.qs.length} Correct</div>
        <div class="stat"><b>⭐ ${run.score}</b>Points</div>
        <div class="stat"><b>🔥 ${run.best}</b>Best Streak</div>
      </div>
      ${run.missed.length
        ? `<div class="review-box"><h3>📝 Review Missed (${run.missed.length})</h3>${run.missed.map(m => `<div class="missed"><b>${esc(m.q)}</b><br><span style="color:#ff9b9b">You: ${esc(m.your)}</span> &middot; <span style="color:#7dff6b">✅ ${esc(m.ans)}</span></div>`).join('')}</div>`
        : `<p style="color:#7dff6b;font-weight:850;margin:12px 0">🌟 Flawless run! You nailed every single question.</p>`
      }
      ${run.missedQ.length ? `<button class="go blue" onclick="retryMissed()">🎯 Retry ${run.missedQ.length} Missed Question${run.missedQ.length === 1 ? '' : 's'}</button>` : ''}
      <button class="go" onclick="start()">🔁 Practice Full Quiz Again</button>
      <button class="sec" onclick="setup()">📚 Choose Another Quiz</button>
    </div>
  `;
}
setup();
</script></body></html>
