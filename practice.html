<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BrainRush — Solo Practice</title>
<style>
:root{
  --bg1:#2c1957;
  --bg2:#161224;
  --bg3:#0e0b18;
  --surface:rgba(27,22,43,.84);
  --border:rgba(255,255,255,.14);
  --gold:#ffdf5d;
  --green:#16a34a;
  --ink:#1e1b2e;
  --radius:16px;
  --radius-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100vh;min-height:100dvh}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(1100px 680px at 54% -12%,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%) fixed;
  color:#fff;
  text-align:center;
  display:flex;
  flex-direction:column;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
body.hc{background:#000!important}
body.hc .card-panel,body.hc .q-card{background:#111;border:2px solid #fff}

/* --- Sticky Top HUD --- */
#topHud{
  position:sticky;
  top:0;
  z-index:55;
  width:100%;
  background:rgba(15,12,26,.88);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.12);
}
.hud-brand{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-weight:900;
  font-size:.9em;
  letter-spacing:-.01em;
  color:#fff;
  text-decoration:none;
  margin-right:2px;
}
.hud-bolt{
  width:22px;height:22px;border-radius:6px;
  background:linear-gradient(135deg,#facc15,#f97316);
  color:#1e1b2e;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:.78em;font-weight:900;
  box-shadow:0 2px 8px rgba(250,204,21,.28);
  flex-shrink:0;
}
.studio-hero-pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:5px 13px 5px 7px;
  border-radius:99px;
  background:rgba(15,12,26,.65);
  border:1px solid rgba(255,255,255,.16);
  font-weight:900;
  font-size:.86em;
  letter-spacing:-.01em;
  margin:0 auto 10px;
}
.p-search{
  display:block;
  width:100%;
  padding:9px 12px!important;
  margin:0 0 8px!important;
  border-radius:10px!important;
  border:1px solid rgba(255,255,255,.16)!important;
  background:rgba(15,12,26,.6)!important;
  color:#fff!important;
  text-align:left!important;
  font-size:.9em!important;
  font-weight:700!important;
  box-shadow:none!important;
}
.p-deck-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:225px;
  overflow-y:auto;
  margin-bottom:10px;
}
.p-deck-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px 12px;
  border-radius:11px;
  border:1.5px solid rgba(255,255,255,.13);
  background:rgba(15,12,26,.55);
  color:#fff;
  font-weight:800;
  font-size:.92em;
  cursor:pointer;
  text-align:left;
  transition:border-color .14s,background .14s;
}
.p-deck-card.sel{
  border-color:var(--gold);
  background:rgba(255,223,93,.12);
  box-shadow:0 0 0 1px rgba(255,223,93,.22);
}
.p-deck-meta{
  font-size:.78em;
  font-weight:850;
  padding:2px 9px;
  border-radius:99px;
  background:rgba(255,255,255,.1);
  color:var(--gold);
  white-space:nowrap;
  flex-shrink:0;
}
.p-acc{
  border:1px solid rgba(255,255,255,.14);
  background:rgba(15,12,26,.52);
  border-radius:12px;
  margin:10px 0 12px;
  text-align:left;
  overflow:hidden;
}
.p-acc summary{
  list-style:none;
  cursor:pointer;
  padding:11px 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-weight:850;
  font-size:.9em;
  user-select:none;
}
.p-acc summary::-webkit-details-marker{display:none}
.p-acc summary .sum-left{display:inline-flex;align-items:center;gap:6px}
.p-acc summary .chev{font-size:.75em;opacity:.7;transition:transform .16s}
.p-acc[open] summary .chev{transform:rotate(90deg)}
.p-count-chips{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin:4px 0 12px;
}
.p-chip{
  padding:9px 6px;
  border-radius:10px;
  border:1.5px solid rgba(255,255,255,.16);
  background:rgba(15,12,26,.55);
  color:#fff;
  font-weight:850;
  font-size:.88em;
  cursor:pointer;
  transition:border-color .14s,background .14s,transform .08s;
}
.p-chip:active{transform:scale(.97)}
.p-chip.sel{
  border-color:var(--gold);
  background:rgba(255,223,93,.16);
  color:var(--gold);
  box-shadow:0 0 0 1px rgba(255,223,93,.22);
}
.p-acc-badge{
  font-size:.76em;
  font-weight:900;
  padding:3px 9px;
  border-radius:99px;
  background:rgba(255,255,255,.11);
  color:rgba(255,255,255,.88);
}
.p-acc-badge.hi{
  background:rgba(34,197,94,.22);
  color:#86efac;
  border:1px solid rgba(74,222,128,.4);
}
.p-acc-body{
  padding:6px 12px 10px;
  border-top:1px solid rgba(255,255,255,.09);
}
.hud-inner{
  max-width:560px;
  margin:0 auto;
  padding:7px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:46px;
}
.hud-left,.hud-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hud-btn{
  padding:5px 10px;
  font-size:.82em;
  font-weight:800;
  border-radius:99px;
  border:1px solid rgba(255,255,255,.26);
  background:rgba(255,255,255,.12);
  color:#fff;
  cursor:pointer;
  line-height:1.2;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.hud-btn:active{transform:scale(.95)}
.hud-stats{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.16);
  border-radius:99px;
  padding:4px 11px;
  font-size:.82em;
  font-weight:800;
}
.hud-stats .hs-score{color:var(--gold)}
.hud-stats .hs-streak{color:#ffab40}

/* --- Timer Strip --- */
.timer-wrap{
  max-width:560px;
  width:100%;
  margin:0 auto;
  padding:0 12px 7px;
  display:flex;
  align-items:center;
  gap:8px;
}
.bar{
  flex:1;
  height:8px;
  background:rgba(255,255,255,.18);
  border-radius:99px;
  overflow:hidden;
  margin:0;
}
.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#69f0ae,#ffdf5d);
  border-radius:99px;
  transition:width .18s linear,background .2s ease;
}
.bar i.urgent{background:linear-gradient(90deg,#ff1744,#ff9100)}
.tlbl-pill{
  font-size:.78em;
  font-weight:900;
  color:var(--gold);
  min-width:56px;
  text-align:right;
  white-space:nowrap;
}
.tlbl-pill.urgent{color:#ff8a80}

/* --- Main Stage --- */
#app{
  flex:1;
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
}

.card-panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 16px;
  box-shadow:0 10px 28px rgba(0,0,0,.25);
  backdrop-filter:blur(6px);
}
.logo{
  max-width:190px;
  max-height:84px;
  width:auto;
  border-radius:14px;
  margin:0 auto 8px;
  display:block;
  box-shadow:0 6px 18px rgba(0,0,0,.32);
  object-fit:contain;
}
h1{font-size:1.48em;font-weight:900;margin:.15em 0;letter-spacing:-.01em}
.sub{font-size:.9em;opacity:.84;margin:2px 0 12px;line-height:1.4}

.field-lbl{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:.76em;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  opacity:.85;
  margin:8px 2px 4px;
}
select,input[type=text],input[type=number]{
  display:block;
  width:100%;
  box-sizing:border-box;
  font-size:1.1em;
  padding:12px 14px;
  margin:0 0 8px;
  border-radius:var(--radius-sm);
  border:2px solid transparent;
  text-align:center;
  color:var(--ink);
  font-weight:800;
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
  font-family:inherit;
}
select:focus,input:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,223,93,.35);
}
input::placeholder{font-weight:650;opacity:.54;font-size:.86em}

.timer-opt-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--radius-sm);
  padding:9px 12px;
  margin:4px 0 10px;
  font-weight:800;
  font-size:.92em;
  flex-wrap:wrap;
}
.timer-opt-row label{
  display:inline-flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  user-select:none;
}
.timer-opt-row input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:#26890c}
.timer-sec-box{display:inline-flex;align-items:center;gap:6px}
#pTime{
  display:inline-block;
  width:72px;
  padding:6px 8px;
  margin:0;
  font-size:.98em;
  border-radius:8px;
}

.err-banner{
  background:rgba(226,27,60,.24);
  border:1px solid rgba(255,138,128,.5);
  color:#ffcdd2;
  border-radius:10px;
  padding:8px 12px;
  font-weight:800;
  font-size:.9em;
  margin:4px 0 8px;
  display:none;
}

button.go{
  width:100%;
  font-size:1.18em;
  padding:14px 18px;
  border:0;
  border-radius:13px;
  background:linear-gradient(180deg,#22c55e,#16a34a);
  color:#05210e;
  font-weight:900;
  cursor:pointer;
  margin-top:6px;
  box-shadow:0 4px 0 #0d5c2b,0 8px 20px rgba(0,0,0,.34);
  transition:transform .08s,filter .15s;
}
button.go:hover{filter:brightness(1.04)}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #0d5c2b,0 4px 10px rgba(0,0,0,.24)}
button.go.blue{
  background:linear-gradient(180deg,#2563eb,#1d4ed8);
  color:#fff;
  box-shadow:0 4px 0 #1e3a8a,0 8px 18px rgba(0,0,0,.28);
}
button.sec{
  background:rgba(255,255,255,.14);
  color:#fff;
  border:1px solid rgba(255,255,255,.24);
  border-radius:11px;
  padding:10px 16px;
  font-size:.95em;
  font-weight:800;
  cursor:pointer;
  margin:6px 4px 0;
}
button.sec:active{transform:scale(.97)}

.plink{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:12px;
  padding:7px 14px;
  border-radius:99px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  text-decoration:none;
  font-size:.88em;
  font-weight:800;
}

/* --- Question Card & Tactile 2x2 Grid --- */
.q-card{
  background:rgba(15,12,26,.78);
  border:1px solid rgba(255,255,255,.15);
  border-radius:15px;
  padding:13px 14px;
  margin-bottom:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.28);
}
.qnum{
  display:inline-block;
  background:#fff;
  color:var(--ink);
  font-weight:900;
  font-size:.8em;
  padding:3px 12px;
  border-radius:99px;
  margin-bottom:6px;
}
.q{
  font-size:clamp(1.08rem,3.8vw,1.35rem);
  font-weight:850;
  line-height:1.32;
  margin:2px 0;
}
.q-img{
  max-height:190px;
  max-width:100%;
  border-radius:11px;
  margin:8px auto 2px;
  display:block;
  background:#fff;
  object-fit:contain;
  cursor:zoom-in;
  box-shadow:0 4px 12px rgba(0,0,0,.28);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:2px;
}
.grid button{
  min-height:124px;
  padding:12px 10px;
  border:0;
  border-radius:14px;
  color:#fff;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:850;
  font-size:1.05em;
  line-height:1.22;
  word-break:break-word;
  transition:transform .08s,opacity .2s,box-shadow .2s;
  text-shadow:0 1px 2px rgba(0,0,0,.28);
}
.grid button:active:not(:disabled){transform:translateY(3px)}
.grid button .sh{
  font-size:1.45em;
  line-height:1;
  background:rgba(0,0,0,.18);
  width:34px;
  height:34px;
  border-radius:9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.grid button img{max-height:84px;max-width:100%;border-radius:8px;background:#fff}

.c0{background:linear-gradient(180deg,#ef2346,#d01637);box-shadow:0 5px 0 #940d24,0 6px 14px rgba(0,0,0,.24)}
.c1{background:linear-gradient(180deg,#1b75e0,#115bb5);box-shadow:0 5px 0 #0a3c7a,0 6px 14px rgba(0,0,0,.24)}
.c2{background:linear-gradient(180deg,#e5a900,#c68f00);box-shadow:0 5px 0 #8c6400,0 6px 14px rgba(0,0,0,.24)}
.c3{background:linear-gradient(180deg,#2d9e0f,#217c09);box-shadow:0 5px 0 #145004,0 6px 14px rgba(0,0,0,.24)}
.c4{background:linear-gradient(180deg,#8e24aa,#6a1b9a);box-shadow:0 5px 0 #4a148c,0 6px 14px rgba(0,0,0,.24)}
.c5{background:linear-gradient(180deg,#00897b,#00695c);box-shadow:0 5px 0 #004d40,0 6px 14px rgba(0,0,0,.24)}

body.cb .c0{background:#D55E00;box-shadow:0 5px 0 #8f3e00}
body.cb .c1{background:#0072B2;box-shadow:0 5px 0 #004973}
body.cb .c2{background:#F0E442;color:#1b1b1b!important;text-shadow:none;box-shadow:0 5px 0 #a89e14}
body.cb .c2 .sh{background:rgba(0,0,0,.12)}
body.cb .c3{background:#009E73;box-shadow:0 5px 0 #00664a}
body.cb .c4{background:#CC79A7;box-shadow:0 5px 0 #8a4b6e}
body.cb .c5{background:#56B4E9;color:#1b1b1b!important;text-shadow:none;box-shadow:0 5px 0 #2e7aa6}
body.hc .grid button{border:3px solid #fff}

.grid button.right{
  outline:4px solid #fff;
  box-shadow:0 0 0 3px #69f0ae,0 0 24px rgba(105,240,174,.75)!important;
  transform:scale(1.02);
}
.grid button.picked:not(.right){
  outline:3px solid rgba(255,255,255,.8);
}
.grid button.dim{opacity:.28;filter:grayscale(.25)}
.grid button.msel{outline:3.5px solid var(--gold);transform:translateY(-2px);box-shadow:0 0 16px rgba(255,223,93,.55)!important}

.q-top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.q-top-row .qnum{margin-bottom:0}
.tts-btn{
  padding:4px 11px;
  border-radius:99px;
  border:1px solid rgba(255,255,255,.32);
  background:rgba(255,255,255,.14);
  color:#fff;
  font-size:.78em;
  font-weight:850;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.tts-btn.on{background:var(--gold);color:var(--ink);border-color:#fff}
.q-img.zoom-go{animation:zoomrev 14s linear forwards}
@keyframes zoomrev{from{filter:blur(24px)}to{filter:blur(0)}}

/* --- Match Tap-to-Pair --- */
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px;text-align:left}
.match-col{display:flex;flex-direction:column;gap:7px}
.match-hdr{font-size:.75em;font-weight:900;text-transform:uppercase;letter-spacing:.06em;opacity:.82;text-align:center}
.m-item{
  padding:10px 11px;
  border-radius:11px;
  border:2px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.12);
  color:#fff;
  font-weight:800;
  font-size:.92em;
  line-height:1.25;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  text-align:left;
  word-break:break-word;
}
.m-item.active{border-color:var(--gold);background:rgba(255,223,93,.22);box-shadow:0 0 12px rgba(255,223,93,.4)}
.m-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:24px;padding:0 6px;border-radius:99px;
  font-size:.78em;font-weight:900;color:#fff;flex-shrink:0;
}
.pc0{background:#e21b3c}.pc1{background:#1368ce}.pc2{background:#d89e00}.pc3{background:#26890c}.pc4{background:#8e24aa}.pc5{background:#00897b}

/* --- Slider & Pin --- */
.slider-box{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:16px 14px;margin-bottom:8px}
.slider-val{font-size:2em;font-weight:900;color:var(--gold);margin-bottom:8px}
.slider-box input[type=range]{width:100%;accent-color:var(--gold);height:8px;cursor:pointer;margin:6px 0}
.slider-ends{display:flex;justify-content:space-between;font-size:.8em;opacity:.8;font-weight:800;margin-bottom:10px}
.slider-num{width:130px!important;display:inline-block!important;padding:8px 10px!important;font-size:1.05em!important;margin:0!important;border-radius:9px!important}

.pin-wrap{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px;margin-bottom:8px}
.pin-stage{position:relative;display:inline-block;max-width:100%;border-radius:10px;overflow:hidden;cursor:crosshair;line-height:0;background:#fff;touch-action:manipulation}
.pin-stage img{display:block;max-width:100%;max-height:290px;width:auto;height:auto;user-select:none;-webkit-user-drag:none}
.pin-marker{
  position:absolute;width:26px;height:26px;border-radius:50%;
  border:3px solid #fff;background:rgba(226,27,60,.9);
  box-shadow:0 0 0 2px #000,0 3px 10px rgba(0,0,0,.55);
  transform:translate(-50%,-50%);pointer-events:none;z-index:3;
}
.pin-marker::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
.pin-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* --- Order Slots --- */
.slot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.26);
  border-radius:10px;
  padding:8px 12px;
  margin:4px 0;
  font-weight:800;
  text-align:left;
  cursor:pointer;
}
.slot b{color:var(--gold);margin-right:6px}
.slot .rm{opacity:.7;font-size:.85em}

/* --- Feedback & Explanation --- */
.fb{
  margin-top:12px;
  padding:13px 15px;
  border-radius:13px;
  font-weight:850;
  font-size:1.14em;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.fb.ok{background:linear-gradient(135deg,#2e9e10,#1e7308);border:1px solid rgba(105,240,174,.5)}
.fb.partial{background:linear-gradient(135deg,#f57c00,#e65100);border:1px solid rgba(255,223,93,.6)}
.fb.no{background:linear-gradient(135deg,#d32f2f,#9a1b1b);border:1px solid rgba(255,138,128,.45)}
.grade-hero{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(0,0,0,.35);border:2px solid var(--gold);
  border-radius:99px;padding:6px 18px;margin:6px 0 4px;
  font-size:1.25em;font-weight:900;color:var(--gold);
}
blockquote{
  background:#fff;
  color:var(--ink);
  border-left:5px solid var(--gold);
  border-radius:11px;
  padding:11px 14px;
  margin:10px 0 4px;
  font-style:italic;
  text-align:left;
  font-weight:600;
  line-height:1.4;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}

/* --- Finish Summary & Missed Review --- */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0;
}
.stat{
  background:rgba(0,0,0,.3);

<div id="app"></div>

<script>
const $ = document.getElementById('app'), sh = ["▲","◆","●","■","★","⬟"];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function qtype(q){return q.type||'mc'}
function zoomImg(src){ document.getElementById('imgBig').src = src; document.getElementById('imgOv').style.display = 'flex'; }

/* --- Read-Aloud TTS --- */
let autoReadAloud = false;
try{ autoReadAloud = localStorage.getItem('brainrush_prac_tts') === '1'; }catch(e){}
function stopSpeak(){
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  const b = document.getElementById('ttsBtn');
  if(b){ b.classList.remove('on'); b.textContent = '🔊 Read Aloud'; }
}
function speakPractice(forceStart){
  if(!run || run.i >= run.qs.length) return;
  if(!('speechSynthesis' in window)) return;
  if(!forceStart && window.speechSynthesis.speaking){
    stopSpeak();
    return;
  }
  stopSpeak();
  const q = run.qs[run.i], t = qtype(q);
  const parts = [q.q || ''];
  if(!(run.previewLeft > 0)){
    if(['mc','tf','zoom','multi'].includes(t) && Array.isArray(q.a) && q.a.length){
      parts.push('Options: ' + q.a.map((a, i) => `${i + 1}: ${a}`).join('. '));
    } else if(t === 'order' && run.perm && Array.isArray(q.a)){
      parts.push('Items to order: ' + run.perm.map(k => q.a[k]).join(', '));
    } else if(t === 'match' && Array.isArray(q.pairs)){
      parts.push('Match: ' + q.pairs.map(p => p.l).join(', '));
    } else if(t === 'slider' && q.slider){
      parts.push(`Range from ${q.slider.min} to ${q.slider.max}${q.slider.unit ? ' ' + q.slider.unit : ''}.`);
    }
  }
  try{
    const u = new SpeechSynthesisUtterance(parts.join('. '));
    const b = document.getElementById('ttsBtn');
    if(b){ b.classList.add('on'); b.textContent = '⏹️ Stop Reading'; }
    u.onend = u.onerror = () => {
      const btn = document.getElementById('ttsBtn');
      if(btn){ btn.classList.remove('on'); btn.textContent = '🔊 Read Aloud'; }
    };
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* --- Sound --- */
try{ localStorage.removeItem('brainrush_a11y'); }catch(e){}
document.body.classList.remove('cb','hc');

let ac = null, sfxOn = true;
try{ sfxOn = localStorage.getItem('brainrush_sfx') !== '0'; }catch(e){}
function unlockAudio(){
  try{
    if(!ac){ const C = window.AudioContext || window.webkitAudioContext; if(C) ac = new C(); }
    if(ac && ac.state === 'suspended') ac.resume();
  }catch(e){}
}
window.addEventListener('pointerdown', unlockAudio, {passive:true});
function beep(f, d, type, v, delay){
  if(!sfxOn || !ac) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(v || .22, t + .015);
  g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
function sfxCorrect(){ [523.25,659.25,783.99].forEach((f,i)=>beep(f,.15,'triangle',.25,i*.08)); }
function sfxPartial(){ [440,554.37].forEach((f,i)=>beep(f,.14,'triangle',.2,i*.09)); }
function sfxWrong(){ beep(196,.24,'sawtooth',.16,0); beep(147,.3,'sawtooth',.16,.11); }
function updSfx(){ const b = document.getElementById('sfxBtn'); if(b) b.textContent = sfxOn ? '🔊' : '🔇'; }
function toggleSfx(){
  sfxOn = !sfxOn;
  try{ localStorage.setItem('brainrush_sfx', sfxOn ? '1' : '0'); }catch(e){}
  updSfx();
  if(sfxOn){ unlockAudio(); sfxCorrect(); }
}
updSfx();

function confettiBurst(){
  const c = document.getElementById('fx'); c.width = innerWidth; c.height = innerHeight;
  const ctx = c.getContext('2d'), cols = ['#ff2e63','#08d9d6','#ffde7d','#7dff6b','#fff','#ff9800'];
  const ps = Array.from({length:75}, ()=>({x:innerWidth/2, y:innerHeight*.28, vx:(Math.random()-.5)*11, vy:-4-Math.random()*8, s:5+Math.random()*6, col:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, va:(Math.random()-.5)*.3}));
  const t0 = performance.now();
  (function loop(now){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.vy += .34; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
    if(now - t0 < 1700) requestAnimationFrame(loop); else ctx.clearRect(0,0,c.width,c.height);
  })(t0);
}

function syncHud(){
  const hs = document.getElementById('hudStats');
  const ht = document.getElementById('hudTimer');
  if(!run || run.i >= run.qs.length){
    if(hs) hs.innerHTML = `<span class="hud-stats">🧑‍🎓 Solo Practice</span>`;
    if(ht) ht.style.display = 'none';
    return;
  }
  const doneN = run.done ? (run.i + 1) : run.i;
  const livePct = doneN > 0 ? Math.round(100 * run.creditSum / doneN) + '%' : '100%';
  if(hs){
    hs.innerHTML = `<span class="hud-stats"><span>Q ${run.i+1}/${run.qs.length}</span><span class="hs-score">📊 ${doneN > 0 ? livePct : '—%'} (${run.right}/${doneN})</span>${run.streak >= 2 ? `<span class="hs-streak">🔥 ${run.streak}</span>` : ''}</span>`;
  }
  const showMainTimer = run.timed && !(run.previewLeft > 0) && !(run.thinkLeft > 0);
  if(ht) ht.style.display = showMainTimer ? 'flex' : 'none';
}

let run = null, lockedQuiz = null;
const PRAC_PARAMS = new URLSearchParams(location.search);
const PRAC_KEY = (PRAC_PARAMS.get('k') || '').trim();
const PRAC_FILE = (PRAC_PARAMS.get('quiz') || PRAC_PARAMS.get('file') || '').trim();

function getActivePracticeDeck(){
  return (lockedQuiz && !lockedQuiz.error) ? lockedQuiz : null;
}

function syncCountChips(){
  const active = getActivePracticeDeck();
  const tfEl = document.getElementById('pracTopicFilter');
  const tfVal = tfEl ? tfEl.value : '';
  const pool = active ? (active.questions || []).filter(q => !tfVal || String((q && q.topic) || '').trim() === tfVal) : [];
  const maxN = pool.length;
  const cntEl = document.getElementById('cnt');
  const cur = cntEl ? parseInt(cntEl.value, 10) : maxN;
  document.querySelectorAll('.p-chip').forEach(btn => {
    const raw = btn.dataset.cnt;
    const v = raw === 'all' ? maxN : parseInt(raw, 10);
    if(raw === 'all'){
      btn.textContent = `All (${maxN})`;
      btn.style.display = '';
      btn.classList.toggle('sel', !cur || cur >= maxN);
    } else {
      btn.style.display = v < maxN ? '' : 'none';
      btn.classList.toggle('sel', cur === v);
    }
  });
}

function setPracCountChip(val){
  const active = getActivePracticeDeck();
  const tfEl = document.getElementById('pracTopicFilter');
  const tfVal = tfEl ? tfEl.value : '';
  const pool = active ? (active.questions || []).filter(q => !tfVal || String((q && q.topic) || '').trim() === tfVal) : [];
  const maxN = pool.length || 1;
  const cntEl = document.getElementById('cnt');
  if(cntEl){
    cntEl.max = maxN;
    cntEl.value = (val === 'all' || val >= maxN) ? maxN : val;
  }
  updatePracSummary();
}

function updatePracSummary(){
  const b = document.getElementById('pOptBadge');
  const active = getActivePracticeDeck();
  const tfEl = document.getElementById('pracTopicFilter');
  const tfVal = tfEl ? tfEl.value : '';
  const pool = active ? (active.questions || []).filter(q => !tfVal || String((q && q.topic) || '').trim() === tfVal) : [];
  const maxN = pool.length;
  const maxEl = document.getElementById('pMaxCnt');
  if(maxEl) maxEl.textContent = '/ ' + (maxN || '—');
  const cntEl = document.getElementById('cnt');
  if(cntEl && maxN > 0) cntEl.max = maxN;
  const cnt = parseInt((cntEl || {}).value, 10);
  const effCnt = (!isNaN(cnt) && cnt > 0 && (!maxN || cnt < maxN)) ? cnt : maxN;
  const startBtn = document.getElementById('startPracBtn');
  if(startBtn) startBtn.textContent = `▶️ Start Practice (${effCnt || 0} Q${effCnt === 1 ? '' : 's'})`;
  syncCountChips();
  if(!b) return;
  const tm = !!(document.getElementById('timed') || {}).checked;
  const sec = Math.max(5, Math.min(900, parseInt((document.getElementById('pTime') || {}).value, 10) || 15));
  const prev = Math.max(0, Math.min(120, parseFloat((document.getElementById('pPrevTime') || {}).value) || 0));
  const thk = Math.max(0, Math.min(120, parseFloat((document.getElementById('pThinkTime') || {}).value) || 0));
  const shuf = !!(document.getElementById('pracShuffle') || {}).checked;
  const saEl = document.getElementById('pracShuffleAns');
  const shufAns = saEl ? saEl.checked : true;
  const ttsEl = document.getElementById('pracReadAloud');
  const tts = ttsEl ? ttsEl.checked : autoReadAloud;
  if(ttsEl){
    autoReadAloud = tts;
    try{ localStorage.setItem('brainrush_prac_tts', tts ? '1' : '0'); }catch(e){}
  }
  const parts = [];
  parts.push(`${effCnt || maxN || 0} Qs`);
  if(tfVal) parts.push(tfVal.replace(/^Chapter\s+(\d+).*/i, 'Ch $1'));
  parts.push(tm ? `${sec}s timer` : 'Untimed');
  if(prev > 0) parts.push(`${prev}s preview`);
  if(thk > 0) parts.push(`${thk}s think`);
  if(shuf) parts.push('Shuffled');
  if(!shufAns) parts.push('Fixed A/B/C/D');
  if(tts) parts.push('🔊 Read-Aloud');
  b.textContent = parts.join(' · ');
  b.classList.toggle('hi', true);
}

function onPracTopicFilterChange(){
  const active = getActivePracticeDeck();
  const tfEl = document.getElementById('pracTopicFilter');
  const tfVal = tfEl ? tfEl.value : '';
  const pool = active ? (active.questions || []).filter(q => !tfVal || String((q && q.topic) || '').trim() === tfVal) : [];
  const cntEl = document.getElementById('cnt');
  if(cntEl){
    cntEl.max = pool.length || 1;
    cntEl.value = pool.length || '';
  }
  updatePracSummary();
}

async function fetchAssignedQuiz(forceRetry){
  if(lockedQuiz && !lockedQuiz.error && !forceRetry) return lockedQuiz;
  const targetFile = PRAC_FILE || 'quiz_entr101_master150.json';
  const qUrl = PRAC_KEY
    ? '/api/quiz_data?k=' + encodeURIComponent(PRAC_KEY)
    : '/api/quiz_data?file=' + encodeURIComponent(targetFile);
  try{
    const res = await fetch(qUrl, {cache: 'no-store'});
    const data = await res.json();
    if(!res.ok || data.error) return {error: data.error || 'Could not load practice quiz.'};
    const gradable = (data.questions || []).filter(q => !['poll','open','rank','info','scale','brainstorm'].includes(q.type));
    lockedQuiz = {
      id: 'assigned',
      file: data.file || targetFile,
      title: String(data.title || 'ENTR 101: Comprehensive Master Review (All 10 Chapters)').replace(/\s*\(\d+\s*(?:Qs|slides?)\)\s*$/i, ''),
      questions: gradable,
      count: gradable.length
    };
    return lockedQuiz;
  }catch(e){
    return {error: 'Could not load practice quiz.'};
  }
}

            <option value="">All ${deckTopics.length} Chapters (${n} Questions)</option>
            ${deckTopics.map(tp => {
              const c = (active.questions || []).filter(q => String((q && q.topic) || '').trim() === tp).length;

            <button type="button" class="p-chip sel" data-cnt="all" onclick="setPracCountChip('all')">All (${n})</button>
          </div>

        <div class="p-sec-box">

      </div>

      <div id="pErr" class="err-banner"></div>
      <button class="go" id="startPracBtn" onclick="start()">▶️ Start Practice (${n} Qs)</button>
    </div>
    <div><a class="plink" href="/play">🎮 Back to Live Game</a></div>
  `;
  const shufEl = document.getElementById('pracShuffle');
  if(shufEl) shufEl.checked = true;
  const saEl = document.getElementById('pracShuffleAns');
  if(saEl) saEl.checked = true;
  const raEl = document.getElementById('pracReadAloud');
  if(raEl) raEl.checked = !!autoReadAloud;
  updatePracSummary();
}

function shufflePracticeQuestionOptions(q){
  const out = Object.assign({}, q);
  const t = qtype(out);
  const ans = Array.isArray(out.a) ? out.a.slice() : [];
  if(!['mc','multi','zoom'].includes(t) || ans.length < 2) return out;
  const n = ans.length;
  const perm = [...Array(n).keys()];
  for(let k = 0; k < 8; k++){
    for(let i = n - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }
    if(perm.some((v, idx) => v !== idx)) break;
  }
  const inv = {};
  perm.forEach((oldIdx, newIdx) => { inv[oldIdx] = newIdx; });
  out.a = perm.map(i => ans[i]);
  if(Array.isArray(out.aimg) && out.aimg.length === n) out.aimg = perm.map(i => out.aimg[i]);
  if(Array.isArray(out.correct_multi) && out.correct_multi.length){
    const cm = out.correct_multi.filter(i => i in inv).map(i => inv[i]).sort((a,b) => a - b);
    out.correct_multi = cm;
    out.c = cm.length ? cm[0] : (inv[out.c || 0] || 0);
  } else {
    out.c = inv[out.c || 0] || 0;
  }
  return out;
}

async function start(customQs){
  stopSpeak();
  let qs = customQs;
  let timed = run ? run.timed : false;
  let tMax = run ? run.tMax : 15;
  let prevMax = run ? (run.prevMax || 0) : 0;
  let thinkMax = run ? (run.thinkMax || 0) : 0;
  let readAloud = run ? !!run.readAloud : autoReadAloud;
  let shuffle = run ? !!run.shuffle : false;
  let shuffleAns = run && run.shuffleAns !== undefined ? !!run.shuffleAns : true;
  let quizTitle = run && run.title ? run.title : 'Practice Quiz';
  if(!qs){
    const errEl = document.getElementById('pErr');
    await fetchAssignedQuiz();
    const active = getActivePracticeDeck();
    if(!active || !Array.isArray(active.questions) || !active.questions.length){
      if(errEl){ errEl.textContent = 'Please select or create a practice quiz first.'; errEl.style.display = 'block'; }
      return;
    }
    quizTitle = active.title || 'Practice Quiz';
    if(errEl) errEl.style.display = 'none';
    const cntEl = document.getElementById('cnt');
    const rawCnt = cntEl ? parseInt(cntEl.value, 10) : NaN;
    const tmEl = document.getElementById('timed');
    timed = tmEl ? tmEl.checked : timed;
    const raEl = document.getElementById('pracReadAloud');
    readAloud = raEl ? raEl.checked : readAloud;
    autoReadAloud = readAloud;
    try{ localStorage.setItem('brainrush_prac_tts', readAloud ? '1' : '0'); }catch(e){}
    const shufEl = document.getElementById('pracShuffle');
    shuffle = shufEl ? shufEl.checked : shuffle;
    const shufAnsEl = document.getElementById('pracShuffleAns');
    shuffleAns = shufAnsEl ? shufAnsEl.checked : shuffleAns;
    const ptEl = document.getElementById('pTime');
    tMax = Math.max(5, Math.min(900, parseInt(ptEl ? ptEl.value : tMax, 10) || 15));
    const pvEl = document.getElementById('pPrevTime');
    prevMax = Math.max(0, Math.min(120, parseFloat(pvEl && pvEl.value !== '' ? pvEl.value : prevMax) || 0));
    const thEl = document.getElementById('pThinkTime');
    thinkMax = Math.max(0, Math.min(120, parseFloat(thEl && thEl.value !== '' ? thEl.value : thinkMax) || 0));
    const tfEl = document.getElementById('pracTopicFilter');
    const tfVal = tfEl ? tfEl.value : '';
    qs = (active.questions || []).filter(q => !tfVal || String((q && q.topic) || '').trim() === tfVal);
    if(shuffle){
      for(let i = qs.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [qs[i], qs[j]] = [qs[j], qs[i]];
      }
    }
    if(!isNaN(rawCnt) && rawCnt > 0) qs = qs.slice(0, rawCnt);
    if(shuffleAns) qs = qs.map(shufflePracticeQuestionOptions);
    if(!qs.length){
      if(errEl){ errEl.textContent = 'This deck has no gradable practice questions.'; errEl.style.display = 'block'; }
      return;
    }
  } else if(shuffleAns){
    qs = qs.map(shufflePracticeQuestionOptions);
  }
  if(!qs.length) return;
  run = {
    title: quizTitle,
    qs, i:0, score:0, streak:0, best:0, right:0, creditSum:0,
    missed:[], missedQ:[], topics:{},
    timed, tMax, prevMax, thinkMax, readAloud, shuffle, shuffleAns,
    t:tMax, previewLeft:0, previewTotal:0, thinkLeft:0, thinkTotal:0, timer:null,
    sel:[], perm:null, matchPerm:null, matchPairs:[], matchLeft:0,
    sliderVal:0, pinXY:null, done:false
  };
  show();
}

function stopTimer(){ if(run && run.timer){ clearInterval(run.timer); run.timer = null; } }

function skipPreviewNow(){
  if(!run || run.done || !(run.previewLeft > 0)) return;
  run.previewLeft = 0;
  renderQuestionStage(true);
}
function skipThinkNow(){
  if(!run || run.done || !(run.thinkLeft > 0)) return;
  run.thinkLeft = 0;
  renderQuestionStage(true);
}

function show(){
  stopTimer();
  stopSpeak();
  if(run.i >= run.qs.length) return finish();
  const q = run.qs[run.i], t = qtype(q);
  run.done = false;
  run.sel = [];
  run.pinXY = null;
  const qSec = (q.t_custom && q.t >= 5) ? q.t : run.tMax;
  const qThink = (q.think && q.think > 0) ? Number(q.think) : run.thinkMax;
  run.qSec = qSec;
  run.t = qSec;
  run.previewTotal = Math.max(0, Number(run.prevMax) || 0);
  run.previewLeft = run.previewTotal;
  run.thinkTotal = Math.max(0, Number(qThink) || 0);
  run.thinkLeft = run.thinkTotal;

  if(t === 'order'){
    const n = (q.a || []).length;
    let p = [...Array(n).keys()];
    for(let k = 0; k < 12; k++){
      p.sort(() => Math.random() - .5);
      if(n <= 1 || p.some((v, i) => v !== i)) break;
    }
    run.perm = p;
  } else if(t === 'match'){
    const pairs = q.pairs || [];
    const n = pairs.length;
    let p = [...Array(n).keys()];
    for(let k = 0; k < 12; k++){
      p.sort(() => Math.random() - .5);
      if(n <= 1 || p.some((v, i) => v !== i)) break;
    }
    run.matchPerm = p;
    run.matchPairs = Array(n).fill(-1);
    run.matchLeft = 0;
  } else if(t === 'slider'){
    const sc = q.slider || {min:0, max:100, step:1, target:50, margin:0, unit:''};
    const rawMid = (Number(sc.min) + Number(sc.max)) / 2;
    const st = Number(sc.step) || 1;
    const snapped = Number(sc.min) + Math.round((rawMid - Number(sc.min)) / st) * st;
    run.sliderVal = Number(Math.min(Number(sc.max), Math.max(Number(sc.min), snapped)).toFixed(6));
  }

  renderQuestionStage(false);
  if(run.readAloud) setTimeout(() => speakPractice(true), 80);
  startQuestionLoop();
}

function renderQuestionStage(phaseTransition){
  if(!run || run.i >= run.qs.length) return;
  const q = run.qs[run.i], t = qtype(q);
  const inPrev = run.previewLeft > 0;
  const inThink = !inPrev && run.thinkLeft > 0;
  syncHud();

  let phaseBannerHtml = '';

    phaseBannerHtml = `<div class="phase-banner preview">
      <div style="flex:1;min-width:180px">
        <div>👀 Reading Preview (<span id="prevSecLbl">${Math.ceil(run.previewLeft)}</span>s) — Read the question first…</div>
        <div class="phase-bar"><div class="phase-fill" id="prevFillBar" style="width:${pct}%"></div></div>
      </div>
      <button type="button" class="sec" style="margin:0;padding:6px 12px;font-size:.84em" onclick="skipPreviewNow()">⏭️ Open Answers Now</button>

    const pct = Math.min(100, (run.thinkLeft / Math.max(1, run.thinkTotal)) * 100);
    phaseBannerHtml = `<div class="phase-banner">
      <div style="flex:1;min-width:180px">
        <div>🧠 Thinking Time (<span id="thkSecLbl">${Math.ceil(run.thinkLeft)}</span>s) — Choices shown, locked while you reason</div>
        <div class="phase-bar"><div class="phase-fill" id="thkFillBar" style="width:${pct}%"></div></div>
      </div>
      <button type="button" class="sec" style="margin:0;padding:6px 12px;font-size:.84em;background:#7c3aed;border-color:#c4b5fd" onclick="skipThinkNow()">⏭️ Unlock Answers Now</button>
    </div>`;
  }

  let body = '';
  if(inPrev){
    body = '';
  } else if(t === 'text'){
    body = `<div class="card-panel" style="padding:14px"><input type="text" id="txt" placeholder="${inThink ? '🧠 Thinking time — unlocks in a moment…' : 'Type your answer…'}" autocomplete="off" autocapitalize="off" ${inThink ? 'disabled' : ''} onkeydown="if(event.key==='Enter')submitText()"><button class="go" onclick="submitText()" ${inThink ? 'disabled' : ''}>Submit Answer</button></div>`;
  } else if(t === 'order'){
    body = `<div class="sub" style="margin:2px 0 8px;font-weight:750">Tap items in the correct order (1 → ${(q.a||[]).length}; tap a placed slot to remove):</div><div id="ord"></div>`;
  } else if(t === 'multi'){
    body = `
      <div class="sub" style="margin:2px 0 8px;font-weight:750">Select ALL correct options, then tap Submit:</div>
      <div class="grid">${(q.a||[]).map((a,i)=>`<button id="mb${i}" class="c${i%6}" onclick="toggleMulti(${i})" ${inThink ? 'disabled' : ''}>${q.aimg && q.aimg[i] ? `<img src="${esc(q.aimg[i])}" alt="">` : ''}<span class="sh">${sh[i%6]}</span><span>${esc(a)}</span></button>`).join('')}</div>
      <button class="go" id="multiSubBtn" style="margin-top:10px" onclick="submitMulti()" disabled>✅ Submit Selection (0)</button>
    `;
  } else if(t === 'match'){
    body = `<div class="sub" style="margin:2px 0 6px;font-weight:750">Tap a left item and its matching right partner (tap a paired item to unpair):</div><div id="matchBox"></div>`;
  } else if(t === 'slider'){
    const sc = q.slider || {min:0, max:100, step:1, unit:''};
    const u = sc.unit ? ' ' + esc(sc.unit) : '';
    body = `
      <div class="slider-box">
        <div class="slider-val" id="slReadout">${run.sliderVal}${u}</div>
        <input type="range" id="slRange" min="${sc.min}" max="${sc.max}" step="${sc.step}" value="${run.sliderVal}" ${inThink ? 'disabled' : ''} oninput="syncSlider(this.value)">
        <div class="slider-ends"><span>${sc.min}${u}</span><span>${sc.max}${u}</span></div>
        <div style="display:flex;align-items:center;justify-content:center;gap:8px">
          <input type="number" id="slNum" class="slider-num" min="${sc.min}" max="${sc.max}" step="${sc.step}" value="${run.sliderVal}" ${inThink ? 'disabled' : ''} oninput="syncSlider(this.value)">
          ${sc.unit ? `<span style="font-weight:850">${esc(sc.unit)}</span>` : ''}
        </div>
        <button class="go" id="slSubBtn" style="margin-top:12px" onclick="submitSlider()" ${inThink ? 'disabled' : ''}>🎯 Lock In Estimate</button>
      </div>
    `;
  } else if(t === 'pin'){
    body = `
      <div class="pin-wrap">
        <div class="sub" style="margin:0 0 8px;font-weight:750">Tap directly on the image to place your pin:</div>
        <div class="pin-stage" id="pinStage" onclick="if(!(run&&run.thinkLeft>0))placePin(event)">
          <img src="${esc(q.img || '')}" alt="Target image" draggable="false">
          <svg class="pin-svg" id="pinSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>

      <div class="q">${esc(q.q)}</div>

function startQuestionLoop(){
  stopTimer();
  const qSec = run.qSec || run.tMax;
  const b0 = document.getElementById('tb'), l0 = document.getElementById('tlbl');
  if(b0){ b0.style.width = '100%'; b0.className = ''; }
  if(l0){ l0.textContent = '⏱️ ' + qSec + 's'; l0.className = 'tlbl-pill'; }
  if(!(run.previewLeft > 0) && !(run.thinkLeft > 0) && !run.timed) return;
  run.timer = setInterval(() => {
    if(!run || run.done){ stopTimer(); return; }
    if(run.previewLeft > 0){
      run.previewLeft = Math.max(0, run.previewLeft - 0.2);
      const ps = document.getElementById('prevSecLbl'), pf = document.getElementById('prevFillBar');
      if(ps) ps.textContent = Math.ceil(run.previewLeft);
      if(pf) pf.style.width = Math.min(100, (run.previewLeft / Math.max(1, run.previewTotal)) * 100) + '%';
      if(run.previewLeft <= 0){
        renderQuestionStage(true);
        if(!(run.thinkLeft > 0) && !run.timed) stopTimer();
      }
      return;
    }
    if(run.thinkLeft > 0){
      run.thinkLeft = Math.max(0, run.thinkLeft - 0.2);
      const ts = document.getElementById('thkSecLbl'), tf = document.getElementById('thkFillBar');
      if(ts) ts.textContent = Math.ceil(run.thinkLeft);
      if(tf) tf.style.width = Math.min(100, (run.thinkLeft / Math.max(1, run.thinkTotal)) * 100) + '%';
      if(run.thinkLeft <= 0){
        renderQuestionStage(false);
        if(!run.timed) stopTimer();
      }
      return;
    }
    if(run.timed){
      run.t -= 0.2;
      const b = document.getElementById('tb'), l = document.getElementById('tlbl');
      const urg = run.t <= 5;
      if(b){
        b.style.width = Math.max(0, run.t / qSec * 100) + '%';
        b.className = urg ? 'urgent' : '';
      }
      if(l){
        l.textContent = '⏱️ ' + Math.max(0, Math.ceil(run.t)) + 's';
        l.className = 'tlbl-pill' + (urg ? ' urgent' : '');
      }
      if(run.t <= 0){ stopTimer(); grade(false, 0, '(time ran out)'); }
    } else {
      stopTimer();
    }
  }, 200);
}

function pick(i){
  if(run.done || run.previewLeft > 0 || run.thinkLeft > 0) return;
  const q = run.qs[run.i];
  const valid = (Array.isArray(q.correct_multi) && q.correct_multi.length) ? q.correct_multi : [q.c || 0];
  const ok = !!q.all_correct || valid.includes(i);
  grade(ok, ok ? 1 : 0, (q.a || [])[i] || '', {picked:[i], valid: q.all_correct ? (q.a||[]).map((_,k)=>k) : valid});
}

function toggleMulti(i){
  if(run.done || run.previewLeft > 0 || run.thinkLeft > 0) return;
  const pos = run.sel.indexOf(i);
  if(pos >= 0) run.sel.splice(pos, 1);
  else run.sel.push(i);
  run.sel.sort((a,b) => a - b);
  const btn = document.getElementById('mb' + i);
  if(btn) btn.classList.toggle('msel', run.sel.includes(i));
  const sub = document.getElementById('multiSubBtn');
  if(sub){
    sub.disabled = !run.sel.length;
    sub.textContent = `✅ Submit Selection (${run.sel.length})`;
  }
}

function submitMulti(){
  if(run.done || run.previewLeft > 0 || run.thinkLeft > 0 || !run.sel.length) return;
  const q = run.qs[run.i];
  const picked = run.sel.slice();
  const req = (Array.isArray(q.correct_multi) && q.correct_multi.length) ? q.correct_multi : [q.c || 0];
  const exact = !!q.all_correct || (picked.length === req.length && picked.every(x => req.includes(x)));
  let credit = 0;
  if(exact) credit = 1;
  else if(q.partial !== false){
    const hits = picked.filter(x => req.includes(x)).length;
    const wrongs = picked.filter(x => !req.includes(x)).length;
    credit = Math.max(0, (hits - wrongs) / Math.max(1, req.length));
  }
  const sub = document.getElementById('multiSubBtn');
  if(sub) sub.disabled = true;
  const given = picked.map(k => (q.a || [])[k]).join(' + ');
  grade(exact, credit, given, {picked, valid: q.all_correct ? (q.a||[]).map((_,k)=>k) : req});
}

function drawMatch(){
  const q = run.qs[run.i], el = document.getElementById('matchBox');
  if(!el) return;
  const locked = !!(run.done || run.previewLeft > 0 || run.thinkLeft > 0);
  const pairs = q.pairs || [];
  const n = pairs.length;
  const rightDisp = run.matchPerm.map(k => pairs[k].r);
  const allLinked = n > 0 && run.matchPairs.every(v => v >= 0);
  el.innerHTML = `
    <div class="match-cols">
      <div class="match-col">
        <div class="match-hdr">Prompts</div>
        ${pairs.map((p, li) => {
          const rj = run.matchPairs[li];
          const act = run.matchLeft === li && !locked;
          return `<button type="button" class="m-item${act ? ' active' : ''}" onclick="tapMatchLeft(${li})" ${locked ? 'disabled' : ''}><span>${esc(p.l)}</span>${rj >= 0 ? `<span class="m-badge pc${li%6}">#${li+1}</span>` : ''}</button>`;
        }).join('')}
      </div>
      <div class="match-col">
        <div class="match-hdr">Matches</div>
        ${rightDisp.map((rt, rj) => {
          const li = run.matchPairs.indexOf(rj);
          return `<button type="button" class="m-item" onclick="tapMatchRight(${rj})" ${locked ? 'disabled' : ''}><span>${esc(rt)}</span>${li >= 0 ? `<span class="m-badge pc${li%6}">#${li+1}</span>` : ''}</button>`;
        }).join('')}
      </div>
    </div>
    ${!run.done ? `<button class="go" onclick="submitMatch()" ${(allLinked && !locked) ? '' : 'disabled'}>🔗 Submit Pairs (${run.matchPairs.filter(v => v >= 0).length}/${n})</button>` : ''}
  `;
}

function tapMatchLeft(li){
  if(run.done || run.previewLeft > 0 || run.thinkLeft > 0) return;
  if(run.matchPairs[li] >= 0){
    run.matchPairs[li] = -1;
    run.matchLeft = li;
  } else {
    run.matchLeft = (run.matchLeft === li) ? null : li;
  }
  drawMatch();
}

function tapMatchRight(rj){
  if(run.done || run.previewLeft > 0 || run.thinkLeft > 0) return;
  const existingLi = run.matchPairs.indexOf(rj);
  let targetLi = run.matchLeft;
  if(targetLi === null || targetLi === undefined){
    if(existingLi >= 0){
      run.matchPairs[existingLi] = -1;
      run.matchLeft = existingLi;
      drawMatch();
      return;
    }
    targetLi = run.matchPairs.findIndex(v => v < 0);
  }
  if(targetLi === null || targetLi < 0) return;
  if(existingLi >= 0) run.matchPairs[existingLi] = -1;
  run.matchPairs[targetLi] = rj;
  const nextUnpaired = run.matchPairs.findIndex(v => v < 0);
  run.matchLeft = nextUnpaired >= 0 ? nextUnpaired : null;
  drawMatch();
}

function submitMatch(){
  if(run.done || run.previewLeft > 0 || run.thinkLeft > 0) return;
  const q = run.qs[run.i], pairs = q.pairs || [], n = pairs.length;
  if(run.matchPairs.some(v => v < 0)) return;
  let hits = 0;
  const parts = [];
  for(let li = 0; li < n; li++){
    const origIdx = run.matchPerm[run.matchPairs[li]];
    const chosenR = pairs[origIdx].r;
    if(origIdx === li || chosenR.trim().toLowerCase() === pairs[li].r.trim().toLowerCase()) hits++;
    parts.push(`${pairs[li].l} → ${chosenR}`);
  }
  const ok = !!q.all_correct || hits === n;
  const credit = ok ? 1 : (hits / Math.max(1, n));
  grade(ok, credit, parts.join(', '));
  drawMatch();
}

function syncSlider(v){
  if(run.done || run.previewLeft > 0 || run.thinkLeft > 0) return;
  const q = run.qs[run.i], sc = q.slider || {min:0, max:100, step:1, unit:''};
  const num = parseFloat(v);
  if(isNaN(num)) return;
  run.sliderVal = num;
  const rEl = document.getElementById('slRange');
  const nEl = document.getElementById('slNum');
  const rd = document.getElementById('slReadout');
  if(rEl && rEl.value !== String(num)) rEl.value = num;
  if(nEl && document.activeElement !== nEl) nEl.value = num;
  if(rd) rd.textContent = num + (sc.unit ? ' ' + sc.unit : '');
}

function submitSlider(){
  if(run.done || run.previewLeft > 0 || run.thinkLeft > 0) return;
  const q = run.qs[run.i], sc = q.slider || {min:0, max:100, step:1, target:50, margin:0, unit:''};
  const nEl = document.getElementById('slNum');
  let val = nEl ? parseFloat(nEl.value) : run.sliderVal;
  if(isNaN(val)) val = run.sliderVal;
  val = Math.max(Number(sc.min), Math.min(Number(sc.max), val));
  const diff = Math.abs(val - Number(sc.target));
  const mg = Number(sc.margin) || 0;
  let ok = false, credit = 0;
  if(q.all_correct || diff <= 1e-6){ ok = true; credit = 1; }
  else if(mg > 0 && diff <= mg + 1e-6){ ok = true; credit = Math.max(0.75, 1 - 0.25 * (diff / mg)); }
  const rEl = document.getElementById('slRange'), bEl = document.getElementById('slSubBtn');
  if(rEl) rEl.disabled = true;
  if(nEl) nEl.disabled = true;
  if(bEl) bEl.disabled = true;
  grade(ok, credit, `${val}${sc.unit ? ' ' + sc.unit : ''}`);
}

function placePin(ev){
  if(run.done || run.previewLeft > 0 || run.thinkLeft > 0) return;
  const st = document.getElementById('pinStage');
  if(!st) return;
  const rect = st.getBoundingClientRect();
  if(!rect.width || !rect.height) return;
  const x = Math.max(0, Math.min(100, ((ev.clientX - rect.left) / rect.width) * 100));
  const y = Math.max(0, Math.min(100, ((ev.clientY - rect.top) / rect.height) * 100));
  run.pinXY = [Number(x.toFixed(1)), Number(y.toFixed(1))];
  const mk = document.getElementById('pinMarker');
  if(mk){ mk.style.display = 'block'; mk.style.left = run.pinXY[0] + '%'; mk.style.top = run.pinXY[1] + '%'; }
  const cd = document.getElementById('pinCoord');
  if(cd) cd.textContent = `Pin placed at (${Math.round(run.pinXY[0])}%, ${Math.round(run.pinXY[1])}%) — tap again to adjust`;
  const btn = document.getElementById('pinSubBtn');
  if(btn) btn.disabled = false;
}

function submitPin(){
  if(run.done || run.previewLeft > 0 || run.thinkLeft > 0 || !run.pinXY) return;
  const q = run.qs[run.i], pn = q.pin || {x:50, y:50, r:12};
  const [px, py] = run.pinXY;
  const r = Math.max(1, Number(pn.r) || 12);
  const dist = Math.hypot(px - Number(pn.x), py - Number(pn.y));
  const ok = !!q.all_correct || dist <= r;
  const credit = ok ? Math.max(0.6, 1 - 0.4 * (dist / r)) : 0;
  const svg = document.getElementById('pinSvg');
  if(svg){
    svg.innerHTML = `<ellipse cx="${pn.x}" cy="${pn.y}" rx="${r}" ry="${r}" fill="rgba(46,204,113,0.32)" stroke="#69f0ae" stroke-width="1.2"/>`;
  }
  const btn = document.getElementById('pinSubBtn');
  if(btn) btn.disabled = true;
  grade(ok, credit, `(${Math.round(px)}%, ${Math.round(py)}%)`);
}

function submitText(){
  if(run.done || run.previewLeft > 0 || run.thinkLeft > 0) return;
  const q = run.qs[run.i];
  const el = document.getElementById('txt');
  const v = el ? el.value : '';
  if(!v.trim()) return;
  if(el) el.disabled = true;
  const ok = !!q.all_correct || (q.a || []).some(a => norm(a) === norm(v));
  grade(ok, ok ? 1 : 0, v);
}

function drawOrder(){
  const q = run.qs[run.i], el = document.getElementById('ord');
  if(!el) return;
  const locked = !!(run.done || run.previewLeft > 0 || run.thinkLeft > 0);
  const disp = run.perm.map(k => q.a[k]);
  el.innerHTML =
    run.sel.map((j, n) => `<div class="slot" onclick="removeOrd(${n})"><span><b>#${n+1}</b> ${esc(disp[j])}</span><span class="rm">✕</span></div>`).join('') +
    `<div class="grid">${disp.map((a, j) => run.sel.includes(j) ? '' : `<button class="c${j%6}" style="min-height:70px" onclick="tapOrd(${j})" ${locked ? 'disabled' : ''}><span>${esc(a)}</span></button>`).join('')}</div>` +
    `<div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px">${run.sel.length && !locked ? `<button class="sec" style="margin:0" onclick="run.sel.pop();drawOrder()">↩ Undo</button>` : ''}${run.sel.length === disp.length && !locked ? `<button class="go" style="margin:0;flex:1" onclick="submitOrder()">✅ Submit Order</button>` : ''}</div>`;
}
function tapOrd(j){ if(run.done || run.previewLeft > 0 || run.thinkLeft > 0) return; run.sel.push(j); drawOrder(); }
function removeOrd(pos){ if(run.done || run.previewLeft > 0 || run.thinkLeft > 0) return; run.sel.splice(pos, 1); drawOrder(); }
function submitOrder(){
  if(run.done || run.previewLeft > 0 || run.thinkLeft > 0) return;
  const q = run.qs[run.i];
  const orig = run.sel.map(j => run.perm[j]);
  const ok = !!q.all_correct || orig.every((v, i) => v === i);
  grade(ok, ok ? 1 : 0, orig.map(k => q.a[k]).join(' → '));
}

function ansText(q){
  if(q.all_correct) return 'Any option (all accepted)';
  const t = qtype(q);
  if(t === 'order') return (q.a || []).join(' → ');
  if(t === 'text') return (q.a || []).slice(0, 3).join(' / ');
  if(t === 'multi'){
    const cm = (Array.isArray(q.correct_multi) && q.correct_multi.length) ? q.correct_multi : [q.c || 0];
    return cm.map(k => (q.a || [])[k]).filter(Boolean).join(' + ');
  }
  if(t === 'match') return (q.pairs || []).map(p => `${p.l} → ${p.r}`).join(', ');
  if(t === 'slider'){
    const sl = q.slider || {};
    const u = sl.unit ? ' ' + sl.unit : '';
    return sl.margin ? `${sl.target}${u} (±${sl.margin})` : `${sl.target}${u}`;
  }
  if(t === 'pin'){
    const pn = q.pin || {};
    return `Target zone (${Math.round(pn.x ?? 50)}%, ${Math.round(pn.y ?? 50)}%)`;
  }
  if(Array.isArray(q.correct_multi) && q.correct_multi.length > 1){
    return q.correct_multi.map(k => (q.a || [])[k]).filter(Boolean).join(' OR ');
  }
  return (q.a || [])[q.c || 0] || '';
}

function grade(ok, credit, given, meta){
  if(run.done) return;
  run.done = true;
  stopTimer();
  stopSpeak();
  const q = run.qs[run.i], t = qtype(q);
  const zImg = document.getElementById('qStemImg');
  if(zImg) zImg.classList.remove('zoom-go');

  const cr = Math.max(0, Math.min(1, Number(credit) || 0));
  const partial = !ok && cr > 0;
  const ptsScale = (q.pts != null) ? (Number(q.pts) / 1000) : 1;
  let pts = 0;
  const earnedCr = ok ? 1 : cr;
  run.creditSum += earnedCr;

  const topKey = String(q.topic || '').trim();
  if(topKey){
    if(!run.topics[topKey]) run.topics[topKey] = {sum:0, exact:0, n:0};
    run.topics[topKey].sum += earnedCr;
    if(ok) run.topics[topKey].exact += 1;
    run.topics[topKey].n += 1;
  }

  if(ok){
    run.streak++;
    run.best = Math.max(run.best, run.streak);
    run.right++;
    pts = Math.round((100 + Math.min(100, (run.streak - 1) * 25)) * cr * ptsScale);
    run.score += pts;
    sfxCorrect();
  } else if(partial){
    run.streak = 0;
    pts = Math.round(100 * cr * ptsScale);
    run.score += pts;
    run.missed.push({index: run.i + 1, q: q.q, your: given, ans: ansText(q), quote: q.quote || '', src: q.src || '', topic: topKey, pct: Math.round(cr * 100)});
    run.missedQ.push(q);
    sfxPartial();
  } else {
    run.streak = 0;
    run.missed.push({index: run.i + 1, q: q.q, your: given, ans: ansText(q), quote: q.quote || '', src: q.src || '', topic: topKey, pct: 0});
    run.missedQ.push(q);
    sfxWrong();
  }
  syncHud();

  const picked = (meta && meta.picked) || [];
  const valid = (meta && meta.valid) || [];
  document.querySelectorAll('.grid button').forEach((b, i) => {
    b.disabled = true;
    b.classList.remove('msel');
    if(['mc','tf','zoom','multi'].includes(t)){
      if(picked.includes(i)) b.classList.add('picked');
      if(valid.includes(i)) b.classList.add('right');
      else b.classList.add('dim');
    }
  });

  const doneN = run.i + 1;
  const runPct = Math.round(100 * run.creditSum / Math.max(1, doneN));
  const fb = document.getElementById('fb');
  const cls = ok ? 'ok' : partial ? 'partial' : 'no';
  const headline = ok
    ? `✅ Correct! · 📊 ${runPct}% Grade (${run.right}/${doneN})${run.streak > 1 ? ' · 🔥 ' + run.streak + ' streak' : ''}`
    : partial
      ? `⚡ Partial Credit (${Math.round(cr * 100)}%) · 📊 ${runPct}% Grade`
      : `❌ Not quite · 📊 ${runPct}% Grade (${run.right}/${doneN})`;
  fb.innerHTML = `
    <div class="fb ${cls}">
      ${headline}
      ${ok ? '' : `<div style="font-size:.86em;font-weight:750;margin-top:4px;opacity:.95">Correct answer: <b>${esc(ansText(q))}</b></div>`}
    </div>
    ${q.quote ? `<blockquote>“${esc(q.quote)}”${q.src ? `<div style="font-size:.82em;font-style:normal;opacity:.75;margin-top:4px">— ${esc(q.src)}</div>` : ''}</blockquote>` : ''}
    <button class="go" onclick="run.i++;show()">${run.i + 1 >= run.qs.length ? '🏆 See Final Results' : 'Next Question ➔'}</button>
  `;
  if(run.readAloud){
    try{
      const msg = ok ? ('Correct! ' + (q.quote || '')) : ('Not quite. Correct answer: ' + ansText(q) + '. ' + (q.quote || ''));
      if(window.speechSynthesis && msg.trim()){
        const u = new SpeechSynthesisUtterance(msg);
        window.speechSynthesis.speak(u);
      }
    }catch(e){}
  }
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function retryMissed(){
  if(!run || !run.missedQ || !run.missedQ.length) return;
  start(run.missedQ.slice());
}

function practiceWeakTopics(){
  if(!run) return;
  const weakSet = new Set(buildTopicStatsList().filter(t => t.pct < 80).map(t => t.topic));
  if(!weakSet.size) return;
  const active = getActivePracticeDeck();
  const basePool = (active && Array.isArray(active.questions) && active.questions.length) ? active.questions : (run.qs || []);
  const subset = basePool.filter(q => weakSet.has(String((q && q.topic) || '').trim()));
  if(subset.length) start(subset.slice());
}

function practiceSingleTopic(topicName){
  const tp = String(topicName || '').trim();
  if(!tp) return;
  const active = getActivePracticeDeck();
  const basePool = (active && Array.isArray(active.questions) && active.questions.length) ? active.questions : ((run && run.qs) || []);
  const subset = basePool.filter(q => String((q && q.topic) || '').trim() === tp);
  if(subset.length) start(subset.slice());
}

function buildTopicStatsList(){
  if(!run || !run.topics) return [];
  return Object.entries(run.topics)
    .filter(([, d]) => d && d.n > 0)
    .map(([topic, d]) => ({
      topic,
      pct: Math.round(100 * d.sum / d.n),
      exact: d.exact,
      n: d.n
    }))
    .sort((a, b) => a.pct - b.pct || b.n - a.n);
}

function openPracticeStudyGuide(onlyMissed){
  if(!run) return;
  const pct = Math.round(100 * run.creditSum / Math.max(1, run.qs.length));
  const title = run.title || 'Solo Practice';
  const topics = buildTopicStatsList();
  const items = onlyMissed
    ? (run.missed || []).slice().sort((a,b) => (a.pct || 0) - (b.pct || 0) || a.index - b.index)
    : (run.qs || []).map((q, idx) => {
        const m = (run.missed || []).find(x => x.index === idx + 1);
        return {
          index: idx + 1,
          q: q.q,
          your: m ? m.your : ansText(q),
          ans: ansText(q),
          quote: q.quote || '',
          src: q.src || '',
          topic: q.topic || '',
          pct: m ? (m.pct || 0) : 100,
          missed: !!m
        };
      });

  const topicHtml = topics.length ? `<div class="item">
    <div class="pct">📊 Accuracy by Topic</div>
    ${topics.map(t => `<div style="margin:7px 0">
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:.94em"><span>🏷️ ${esc(t.topic)}</span><span>${t.pct}% (${t.exact}/${t.n})</span></div>
      <div style="height:8px;background:#e4e1f0;border-radius:99px;overflow:hidden;margin-top:3px"><div style="width:${t.pct}%;height:100%;background:${t.pct<60?'#ef4444':t.pct<80?'#f59e0b':'#16a34a'}"></div></div>
    </div>`).join('')}
  </div>` : '';

  const cardsHtml = items.length ? items.map(it => `<div class="item" style="border-left-color:${(it.pct||0)<100?'#ef4444':'#16a34a'}">
    <div class="pct">Q${it.index}${it.topic ? ' · 🏷️ ' + esc(it.topic) : ''} · ${(it.pct||0) < 100 ? (it.pct > 0 ? `⚡ Partial (${it.pct}%)` : '❌ Missed (0%)') : '✅ Correct (100%)'}</div>
    <h3>${esc(it.q)}</h3>
    ${(it.pct||0) < 100 ? `<div style="color:#b91c1c;font-weight:600;margin-bottom:3px">Your answer: <b>${esc(it.your || 'No answer')}</b></div>` : ''}
    <div class="ans">✅ Correct answer: <b>${esc(it.ans)}</b></div>
    ${it.quote ? `<div class="fact">💡 “${esc(it.quote)}”${it.src ? ' — ' + esc(it.src) : ''}</div>` : ''}
  </div>`).join('') : `<div class="item"><p style="margin:0;font-weight:700;color:#15803d">🌟 Perfect 100% score! You answered every question correctly.</p></div>`;

  const htmlDoc = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>📚 Study Guide — ${esc(title)} — BrainRush</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;max-width:780px;margin:0 auto;padding:28px 18px 48px;color:#1e1b2e;background:#f8f7fc;line-height:1.45}
    .br-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#161224;color:#fff;padding:14px 18px;border-radius:14px;margin-bottom:20px;box-shadow:0 8px 24px rgba(15,12,26,.16)}
    .br-brand{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:1.05em;letter-spacing:-.01em}
    .br-bolt{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#facc15,#f97316);color:#1e1b2e;display:inline-flex;align-items:center;justify-content:center;font-size:.85em}
    h1{color:#1e1b2e;margin:.2em 0 .25em;font-size:1.62em;letter-spacing:-.015em}
    .sub{color:#524c69;margin:0 0 18px;font-size:.96em}
    .item{background:#fff;border:1px solid #e4e1f0;border-left:5px solid #7c3aed;border-radius:12px;padding:13px 18px;margin:12px 0;box-shadow:0 2px 8px rgba(30,27,46,.04);page-break-inside:avoid}
    .pct{font-size:.78em;color:#6d28d9;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
    h3{margin:.32em 0;color:#1e1b2e}
    .ans{color:#15803d;font-weight:600}
    .fact{font-style:italic;color:#524c69;margin-top:6px}
    button{padding:9px 18px;font-size:.92em;border-radius:10px;border:0;background:linear-gradient(180deg,#22c55e,#16a34a);color:#05210e;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #0d5c2b}
    @media print{body{background:#fff;padding:0}.br-top button{display:none}.br-top{background:#fff;color:#1e1b2e;border:1px solid #ddd;box-shadow:none;padding:8px 12px}.item{box-shadow:none;border-color:#ccc}}
  </style></head><body>
    <div class="br-top">
      <span class="br-brand"><span class="br-bolt">⚡</span>BrainRush &middot; Solo Study Guide</span>
      <button onclick="window.print()">🖨️ Print / Save PDF</button>
    </div>
    <h1>📚 ${onlyMissed ? 'Missed Questions Study Guide' : 'Complete Quiz Study Guide'} — ${esc(title)}</h1>
    <p class="sub">Final Percentage Grade: <b>${pct}%</b> (${run.right} of ${run.qs.length} exact · ${run.missed.length} to review).</p>
    ${topicHtml}
    ${cardsHtml}
  </body></html>`;

  const blob = new Blob([htmlDoc], {type: 'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

function finish(){
  stopSpeak();
  syncHud();
  const pct = Math.round(100 * run.creditSum / Math.max(1, run.qs.length));
  if(pct >= 80) confettiBurst();
  const topics = buildTopicStatsList();
  const weakTopics = topics.filter(t => t.pct < 80);
  const topicBoxHtml = topics.length ? `<div class="review-box">
    <h3>📚 Chapters to Study More (Accuracy by Chapter)</h3>
    ${weakTopics.length
      ? `<div style="font-size:.86em;color:#ffdf5d;margin:-2px 0 8px;font-weight:800">🎯 Priority chapters to review: <b>${weakTopics.slice(0,3).map(t => esc(t.topic)).join(' · ')}</b></div>`
      : `<div style="font-size:.86em;color:#7dff6b;margin:-2px 0 8px;font-weight:800">🌟 Awesome! You scored 80%+ across every chapter tested.</div>`}
    ${topics.map(t => {
      const badge = t.pct < 60 ? '⚠️ Study More' : (t.pct < 80 ? '👍 Review' : '🌟 Mastered');
      return `<div class="missed">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:850;flex-wrap:wrap">
        <span>🏷️ ${esc(t.topic)}</span>
        <span style="display:inline-flex;align-items:center;gap:8px">
          <span style="color:${t.pct<60?'#ff9b9b':t.pct<80?'#ffdf5d':'#7dff6b'}">${t.pct}% <small style="opacity:.82">(${t.exact}/${t.n}) · ${badge}</small></span>
          <button type="button" class="hud-btn" style="padding:2px 8px;font-size:.75em" data-tp="${esc(t.topic)}" onclick="practiceSingleTopic(this.dataset.tp)">🎯 Drill Chapter</button>
        </span>
      </div>
      <div class="tbar"><i style="width:${t.pct}%;background:${t.pct<60?'#ff5252':t.pct<80?'#ffb300':'#69f0ae'}"></i></div>
    </div>`;
    }).join('')}
  </div>` : '';

  const toughList = (run.missed || []).slice().sort((a,b) => (a.pct || 0) - (b.pct || 0) || a.index - b.index);
  const toughHtml = toughList.length
    ? `<div class="review-box">
        <h3>🧠 Tough Ones Recap (Most Missed · ${toughList.length})</h3>
        ${toughList.map(m => `<div class="missed">
          <b>Q${m.index} (${m.pct || 0}% credit)${m.topic ? ` · <small style="color:var(--gold)">🏷️ ${esc(m.topic)}</small>` : ''}:</b> ${esc(m.q)}<br>
          <span style="color:#ff9b9b">You: ${esc(m.your)}</span> &middot; <span style="color:#7dff6b">✅ ${esc(m.ans)}</span>
          ${m.quote ? `<div style="font-size:.85em;opacity:.85;margin-top:4px;font-style:italic">💡 ${esc(m.quote)}</div>` : ''}
        </div>`).join('')}
      </div>`
    : `<p style="color:#7dff6b;font-weight:850;margin:12px 0">🌟 Flawless run! You nailed every single question (100%).</p>`;

  $.innerHTML = `
    <div class="card-panel">
      <div style="font-size:3em;line-height:1">${pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : '💪'}</div>
      <h1>Practice Complete!</h1>
      <div class="grade-hero">📊 Percentage Grade: ${pct}%</div>
      <div class="stats-grid">
        <div class="stat"><b>${pct}%</b>Percentage Score</div>
        <div class="stat"><b>${run.right}/${run.qs.length}</b>Questions Correct</div>
        <div class="stat"><b>🔥 ${run.best}</b>Best Streak</div>
      </div>
      ${topicBoxHtml}
      ${toughHtml}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        ${toughList.length ? `<button class="go" style="flex:1;margin:0;background:linear-gradient(180deg,#facc15,#eab308);color:#1e1b2e;box-shadow:0 4px 0 #a16207" onclick="openPracticeStudyGuide(true)">📄 Study Guide (Missed Questions)</button>` : ''}
        <button class="sec" style="flex:1;margin:0;padding:13px 14px" onclick="openPracticeStudyGuide(false)">📚 Full Quiz Study Guide</button>
      </div>
      ${run.missedQ.length ? `<button class="go blue" style="margin-top:10px" onclick="retryMissed()">🎯 Retry ${run.missedQ.length} Missed Question${run.missedQ.length === 1 ? '' : 's'}</button>` : ''}
      ${weakTopics.length ? `<button class="go" style="margin-top:8px;background:linear-gradient(180deg,#a855f7,#7c3aed);color:#fff;box-shadow:0 4px 0 #581c87" onclick="practiceWeakTopics()">📚 Practice Weak Chapters (&lt;80% · ${weakTopics.length} Chapter${weakTopics.length === 1 ? '' : 's'})</button>` : ''}
      <button class="go" onclick="start()">🔁 Practice Full Quiz Again</button>
      <button class="sec" onclick="setup()">⚙️ Change Practice Options</button>
    </div>
  `;
}

setup();
</script></body></html>
