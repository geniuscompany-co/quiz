<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brainrush! — Solo Practice</title>
<style>
:root{
  --bg1:#6827d6;
  --bg2:#46178f;
  --bg3:#23094d;
  --surface:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.20);
  --gold:#ffdf5d;
  --green:#26890c;
  --ink:#2b0d57;
  --radius:16px;
  --radius-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100vh;min-height:100dvh}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(circle at 50% -12%,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%) fixed;
  color:#fff;
  text-align:center;
  display:flex;
  flex-direction:column;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
body.hc{background:#000!important}
body.hc .card-panel,body.hc .q-card{background:#111;border:2px solid #fff}

/* --- Sticky Top HUD --- */
#topHud{
  position:sticky;
  top:0;
  z-index:55;
  width:100%;
  background:rgba(22,7,50,.80);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.14);
}
.hud-inner{
  max-width:560px;
  margin:0 auto;
  padding:7px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:46px;
}
.hud-left,.hud-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hud-btn{
  padding:5px 10px;
  font-size:.82em;
  font-weight:800;
  border-radius:99px;
  border:1px solid rgba(255,255,255,.26);
  background:rgba(255,255,255,.12);
  color:#fff;
  cursor:pointer;
  line-height:1.2;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.hud-btn:active{transform:scale(.95)}
.hud-stats{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.16);
  border-radius:99px;
  padding:4px 11px;
  font-size:.82em;
  font-weight:800;
}
.hud-stats .hs-score{color:var(--gold)}
.hud-stats .hs-streak{color:#ffab40}

/* --- Timer Strip --- */
.timer-wrap{
  max-width:560px;
  width:100%;
  margin:0 auto;
  padding:0 12px 7px;
  display:flex;
  align-items:center;
  gap:8px;
}
.bar{
  flex:1;
  height:8px;
  background:rgba(255,255,255,.18);
  border-radius:99px;
  overflow:hidden;
  margin:0;
}
.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#69f0ae,#ffdf5d);
  border-radius:99px;
  transition:width .18s linear,background .2s ease;
}
.bar i.urgent{background:linear-gradient(90deg,#ff1744,#ff9100)}
.tlbl-pill{
  font-size:.78em;
  font-weight:900;
  color:var(--gold);
  min-width:56px;
  text-align:right;
  white-space:nowrap;
}
.tlbl-pill.urgent{color:#ff8a80}

/* --- Main Stage --- */
#app{
  flex:1;
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
}

.card-panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 16px;
  box-shadow:0 10px 28px rgba(0,0,0,.25);
  backdrop-filter:blur(6px);
}
.logo{
  max-width:190px;
  max-height:84px;
  width:auto;
  border-radius:14px;
  margin:0 auto 8px;
  display:block;
  box-shadow:0 6px 18px rgba(0,0,0,.32);
  object-fit:contain;
}
h1{font-size:1.48em;font-weight:900;margin:.15em 0;letter-spacing:-.01em}
.sub{font-size:.9em;opacity:.84;margin:2px 0 12px;line-height:1.4}

.field-lbl{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:.76em;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.06em;
  opacity:.85;
  margin:8px 2px 4px;
}
select,input[type=text],input[type=number]{
  display:block;
  width:100%;
  box-sizing:border-box;
  font-size:1.1em;
  padding:12px 14px;
  margin:0 0 8px;
  border-radius:var(--radius-sm);
  border:2px solid transparent;
  text-align:center;
  color:var(--ink);
  font-weight:800;
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
  font-family:inherit;
}
select:focus,input:focus{
  outline:none;
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(255,223,93,.35);
}
input::placeholder{font-weight:650;opacity:.54;font-size:.86em}

.timer-opt-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.18);
  border-radius:var(--radius-sm);
  padding:9px 12px;
  margin:4px 0 10px;
  font-weight:800;
  font-size:.92em;
  flex-wrap:wrap;
}
.timer-opt-row label{
  display:inline-flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  user-select:none;
}
.timer-opt-row input[type=checkbox]{width:18px;height:18px;margin:0;accent-color:#26890c}
.timer-sec-box{display:inline-flex;align-items:center;gap:6px}
#pTime{
  display:inline-block;
  width:72px;
  padding:6px 8px;
  margin:0;
  font-size:.98em;
  border-radius:8px;
}

.err-banner{
  background:rgba(226,27,60,.24);
  border:1px solid rgba(255,138,128,.5);
  color:#ffcdd2;
  border-radius:10px;
  padding:8px 12px;
  font-weight:800;
  font-size:.9em;
  margin:4px 0 8px;
  display:none;
}

button.go{
  width:100%;
  font-size:1.22em;
  padding:14px 18px;
  border:0;
  border-radius:13px;
  background:linear-gradient(180deg,#2fa80f,#217a0a);
  color:#fff;
  font-weight:900;
  cursor:pointer;
  margin-top:6px;
  box-shadow:0 5px 0 #145205,0 8px 20px rgba(0,0,0,.28);
  transition:transform .08s,filter .15s;
}
button.go:hover{filter:brightness(1.05)}
button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #145205,0 4px 10px rgba(0,0,0,.24)}
button.go.blue{
  background:linear-gradient(180deg,#1e7ae8,#1158b0);
  box-shadow:0 5px 0 #0a3975,0 8px 18px rgba(0,0,0,.26);
}
button.sec{
  background:rgba(255,255,255,.14);
  color:#fff;
  border:1px solid rgba(255,255,255,.24);
  border-radius:11px;
  padding:10px 16px;
  font-size:.95em;
  font-weight:800;
  cursor:pointer;
  margin:6px 4px 0;
}
button.sec:active{transform:scale(.97)}

.plink{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:12px;
  padding:7px 14px;
  border-radius:99px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  text-decoration:none;
  font-size:.88em;
  font-weight:800;
}

/* --- Question Card & Tactile 2x2 Grid --- */
.q-card{
  background:rgba(20,6,46,.52);
  border:1px solid rgba(255,255,255,.18);
  border-radius:15px;
  padding:13px 14px;
  margin-bottom:10px;
  box-shadow:0 6px 20px rgba(0,0,0,.22);
}
.qnum{
  display:inline-block;
  background:#fff;
  color:#46178f;
  font-weight:900;
  font-size:.8em;
  padding:3px 12px;
  border-radius:99px;
  margin-bottom:6px;
}
.q{
  font-size:clamp(1.08rem,3.8vw,1.35rem);
  font-weight:850;
  line-height:1.32;
  margin:2px 0;
}
.q-img{
  max-height:190px;
  max-width:100%;
  border-radius:11px;
  margin:8px auto 2px;
  display:block;
  background:#fff;
  object-fit:contain;
  cursor:zoom-in;
  box-shadow:0 4px 12px rgba(0,0,0,.28);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:2px;
}
.grid button{
  min-height:124px;
  padding:12px 10px;
  border:0;
  border-radius:14px;
  color:#fff;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:850;
  font-size:1.05em;
  line-height:1.22;
  word-break:break-word;
  transition:transform .08s,opacity .2s,box-shadow .2s;
  text-shadow:0 1px 2px rgba(0,0,0,.28);
}
.grid button:active:not(:disabled){transform:translateY(3px)}
.grid button .sh{
  font-size:1.45em;
  line-height:1;
  background:rgba(0,0,0,.18);
  width:34px;
  height:34px;
  border-radius:9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.grid button img{max-height:84px;max-width:100%;border-radius:8px;background:#fff}

.c0{background:linear-gradient(180deg,#ef2346,#d01637);box-shadow:0 5px 0 #940d24,0 6px 14px rgba(0,0,0,.24)}
.c1{background:linear-gradient(180deg,#1b75e0,#115bb5);box-shadow:0 5px 0 #0a3c7a,0 6px 14px rgba(0,0,0,.24)}
.c2{background:linear-gradient(180deg,#e5a900,#c68f00);box-shadow:0 5px 0 #8c6400,0 6px 14px rgba(0,0,0,.24)}
.c3{background:linear-gradient(180deg,#2d9e0f,#217c09);box-shadow:0 5px 0 #145004,0 6px 14px rgba(0,0,0,.24)}
.c4{background:linear-gradient(180deg,#8e24aa,#6a1b9a);box-shadow:0 5px 0 #4a148c,0 6px 14px rgba(0,0,0,.24)}
.c5{background:linear-gradient(180deg,#00897b,#00695c);box-shadow:0 5px 0 #004d40,0 6px 14px rgba(0,0,0,.24)}

body.cb .c0{background:#D55E00;box-shadow:0 5px 0 #8f3e00}
body.cb .c1{background:#0072B2;box-shadow:0 5px 0 #004973}
body.cb .c2{background:#F0E442;color:#1b1b1b!important;text-shadow:none;box-shadow:0 5px 0 #a89e14}
body.cb .c2 .sh{background:rgba(0,0,0,.12)}
body.cb .c3{background:#009E73;box-shadow:0 5px 0 #00664a}
body.cb .c4{background:#CC79A7;box-shadow:0 5px 0 #8a4b6e}
body.cb .c5{background:#56B4E9;color:#1b1b1b!important;text-shadow:none;box-shadow:0 5px 0 #2e7aa6}
body.hc .grid button{border:3px solid #fff}

.grid button.right{
  outline:4px solid #fff;
  box-shadow:0 0 0 3px #69f0ae,0 0 24px rgba(105,240,174,.75)!important;
  transform:scale(1.02);
}
.grid button.picked:not(.right){
  outline:3px solid rgba(255,255,255,.8);
}
.grid button.dim{opacity:.28;filter:grayscale(.25)}
.grid button.msel{outline:3.5px solid var(--gold);transform:translateY(-2px);box-shadow:0 0 16px rgba(255,223,93,.55)!important}

.q-top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.q-top-row .qnum{margin-bottom:0}
.tts-btn{
  padding:4px 11px;
  border-radius:99px;
  border:1px solid rgba(255,255,255,.32);
  background:rgba(255,255,255,.14);
  color:#fff;
  font-size:.78em;
  font-weight:850;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.tts-btn.on{background:var(--gold);color:var(--ink);border-color:#fff}
.q-img.zoom-go{animation:zoomrev 14s linear forwards}
@keyframes zoomrev{from{filter:blur(24px)}to{filter:blur(0)}}

/* --- Match Tap-to-Pair --- */
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px;text-align:left}
.match-col{display:flex;flex-direction:column;gap:7px}
.match-hdr{font-size:.75em;font-weight:900;text-transform:uppercase;letter-spacing:.06em;opacity:.82;text-align:center}
.m-item{
  padding:10px 11px;
  border-radius:11px;
  border:2px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.12);
  color:#fff;
  font-weight:800;
  font-size:.92em;
  line-height:1.25;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  text-align:left;
  word-break:break-word;
}
.m-item.active{border-color:var(--gold);background:rgba(255,223,93,.22);box-shadow:0 0 12px rgba(255,223,93,.4)}
.m-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:24px;padding:0 6px;border-radius:99px;
  font-size:.78em;font-weight:900;color:#fff;flex-shrink:0;
}
.pc0{background:#e21b3c}.pc1{background:#1368ce}.pc2{background:#d89e00}.pc3{background:#26890c}.pc4{background:#8e24aa}.pc5{background:#00897b}

/* --- Slider & Pin --- */
.slider-box{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:16px 14px;margin-bottom:8px}
.slider-val{font-size:2em;font-weight:900;color:var(--gold);margin-bottom:8px}
.slider-box input[type=range]{width:100%;accent-color:var(--gold);height:8px;cursor:pointer;margin:6px 0}
.slider-ends{display:flex;justify-content:space-between;font-size:.8em;opacity:.8;font-weight:800;margin-bottom:10px}
.slider-num{width:130px!important;display:inline-block!important;padding:8px 10px!important;font-size:1.05em!important;margin:0!important;border-radius:9px!important}

.pin-wrap{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px;margin-bottom:8px}
.pin-stage{position:relative;display:inline-block;max-width:100%;border-radius:10px;overflow:hidden;cursor:crosshair;line-height:0;background:#fff;touch-action:manipulation}
.pin-stage img{display:block;max-width:100%;max-height:290px;width:auto;height:auto;user-select:none;-webkit-user-drag:none}
.pin-marker{
  position:absolute;width:26px;height:26px;border-radius:50%;
  border:3px solid #fff;background:rgba(226,27,60,.9);
  box-shadow:0 0 0 2px #000,0 3px 10px rgba(0,0,0,.55);
  transform:translate(-50%,-50%);pointer-events:none;z-index:3;
}
.pin-marker::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
.pin-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* --- Order Slots --- */
.slot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.26);
  border-radius:10px;
  padding:8px 12px;
  margin:4px 0;
  font-weight:800;
  text-align:left;
  cursor:pointer;
}
.slot b{color:var(--gold);margin-right:6px}
.slot .rm{opacity:.7;font-size:.85em}

/* --- Feedback & Explanation --- */
.fb{
  margin-top:12px;
  padding:13px 15px;
  border-radius:13px;
  font-weight:850;
  font-size:1.14em;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.fb.ok{background:linear-gradient(135deg,#2e9e10,#1e7308);border:1px solid rgba(105,240,174,.5)}
.fb.partial{background:linear-gradient(135deg,#f57c00,#e65100);border:1px solid rgba(255,223,93,.6)}
.fb.no{background:linear-gradient(135deg,#d32f2f,#9a1b1b);border:1px solid rgba(255,138,128,.45)}
.grade-hero{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(0,0,0,.35);border:2px solid var(--gold);
  border-radius:99px;padding:6px 18px;margin:6px 0 4px;
  font-size:1.25em;font-weight:900;color:var(--gold);
}
blockquote{
  background:#fff;
  color:var(--ink);
  border-left:5px solid var(--gold);
  border-radius:11px;
  padding:11px 14px;
  margin:10px 0 4px;
  font-style:italic;
  text-align:left;
  font-weight:600;
  line-height:1.4;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}

/* --- Finish Summary & Missed Review --- */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0;
}
.stat{
  background:rgba(0,0,0,.3);
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  padding:10px 8px;
  font-weight:750;
  font-size:.84em;
}
.stat b{
  display:block;
  font-size:1.45em;
  font-weight:900;
  color:var(--gold);
  margin-bottom:2px;
}
.review-box{
  background:rgba(0,0,0,.26);
  border:1px solid rgba(255,255,255,.16);
  border-radius:13px;
  padding:12px 14px;
  margin:10px 0;
  text-align:left;
}
.review-box h3{margin:0 0 8px;font-size:1em;color:var(--gold)}
.missed{
  border-top:1px solid rgba(255,255,255,.14);
  padding:9px 0;
  font-size:.92em;
  line-height:1.38;
}
.missed:first-of-type{border-top:0;padding-top:2px}

/* --- Lightbox & Confetti --- */
#imgOv{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:90;
  align-items:center;
  justify-content:center;
  padding:16px;
}
#imgOv img{max-width:96vw;max-height:90vh;border-radius:12px;background:#fff}
#fx{position:fixed;inset:0;pointer-events:none;z-index:85}
</style></head><body>

<div id="topHud">
  <div class="hud-inner">
    <div class="hud-left">
      <button id="sfxBtn" class="hud-btn" onclick="toggleSfx()" title="Sound effects">🔊</button>
      <button id="a11y" class="hud-btn" onclick="cycleA11y()" title="Colorblind / High-contrast">👁️</button>
    </div>
    <div class="hud-right" id="hudStats">
      <span class="hud-stats">🧑‍🎓 Solo Practice</span>
    </div>
  </div>
  <div class="timer-wrap" id="hudTimer" style="display:none">
    <div class="bar"><i id="tb" style="width:100%"></i></div>
    <span class="tlbl-pill" id="tlbl">⏱️ 20s</span>
  </div>
</div>

<div id="app"></div>
<div id="imgOv" onclick="this.style.display='none'"><img id="imgBig" alt=""></div>
<canvas id="fx"></canvas>

<script>
const $ = document.getElementById('app'), sh = ["▲","◆","●","■","★","⬟"];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function qtype(q){return q.type||'mc'}
function zoomImg(src){ document.getElementById('imgBig').src = src; document.getElementById('imgOv').style.display = 'flex'; }

/* --- Read-Aloud TTS --- */
function stopSpeak(){
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  const b = document.getElementById('ttsBtn');
  if(b){ b.classList.remove('on'); b.textContent = '🔊 Read Aloud'; }
}
function speakPractice(){
  if(!run || run.i >= run.qs.length) return;
  if(!('speechSynthesis' in window)) return;
  if(window.speechSynthesis.speaking){
    stopSpeak();
    return;
  }
  const q = run.qs[run.i], t = qtype(q);
  const parts = [q.q || ''];
  if(['mc','tf','zoom','multi'].includes(t) && Array.isArray(q.a) && q.a.length){
    parts.push('Options: ' + q.a.map((a, i) => `${i + 1}: ${a}`).join('. '));
  } else if(t === 'order' && run.perm && Array.isArray(q.a)){
    parts.push('Items to order: ' + run.perm.map(k => q.a[k]).join(', '));
  } else if(t === 'match' && Array.isArray(q.pairs)){
    parts.push('Match: ' + q.pairs.map(p => p.l).join(', '));
  } else if(t === 'slider' && q.slider){
    parts.push(`Range from ${q.slider.min} to ${q.slider.max}${q.slider.unit ? ' ' + q.slider.unit : ''}.`);
  }
  try{
    const u = new SpeechSynthesisUtterance(parts.join('. '));
    const b = document.getElementById('ttsBtn');
    if(b){ b.classList.add('on'); b.textContent = '⏹️ Stop Reading'; }
    u.onend = u.onerror = () => {
      const btn = document.getElementById('ttsBtn');
      if(btn){ btn.classList.remove('on'); btn.textContent = '🔊 Read Aloud'; }
    };
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* --- Accessibility & Sound --- */
function applyA11y(){
  let a = 'off';
  try{ a = localStorage.getItem('brainrush_a11y') || 'off'; }catch(e){}
  document.body.classList.toggle('cb', a === 'cb');
  document.body.classList.toggle('hc', a === 'hc');

let ac = null, sfxOn = true;

function unlockAudio(){
  try{
    if(!ac){ const C = window.AudioContext || window.webkitAudioContext; if(C) ac = new C(); }
    if(ac && ac.state === 'suspended') ac.resume();
  }catch(e){}
}
window.addEventListener('pointerdown', unlockAudio, {passive:true});
function beep(f, d, type, v, delay){
  if(!sfxOn || !ac) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'triangle';
  o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(v || .22, t + .015);
  g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
function sfxCorrect(){ [523.25,659.25,783.99].forEach((f,i)=>beep(f,.15,'triangle',.25,i*.08)); }
function sfxPartial(){ [440,554.37].forEach((f,i)=>beep(f,.14,'triangle',.2,i*.09)); }
function sfxWrong(){ beep(196,.24,'sawtooth',.16,0); beep(147,.3,'sawtooth',.16,.11); }

function confettiBurst(){
  const c = document.getElementById('fx'); c.width = innerWidth; c.height = innerHeight;
  const ctx = c.getContext('2d'), cols = ['#ff2e63','#08d9d6','#ffde7d','#7dff6b','#fff','#ff9800'];
  const ps = Array.from({length:75}, ()=>({x:innerWidth/2, y:innerHeight*.28, vx:(Math.random()-.5)*11, vy:-4-Math.random()*8, s:5+Math.random()*6, col:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, va:(Math.random()-.5)*.3}));
  const t0 = performance.now();
  (function loop(now){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{ p.vy += .34; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.col; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
    if(now - t0 < 1700) requestAnimationFrame(loop); else ctx.clearRect(0,0,c.width,c.height);
  })(t0);
}

function syncHud(){

async function start(customQs){
  stopSpeak();
  let qs = customQs;
  let timed = run ? run.timed : false;
  let tMax = run ? run.tMax : 20;
  let shuffle = run ? !!run.shuffle : false;
  if(!qs){
    const sel = document.getElementById('qs');
    const file = sel ? sel.value : lastFile;
    const errEl = document.getElementById('pErr');
    if(!file){
      if(errEl){ errEl.textContent = 'Please select a quiz first.'; errEl.style.display = 'block'; }
      return;
    }
    lastFile = file;
    if(errEl) errEl.style.display = 'none';
    const cntEl = document.getElementById('cnt');
    const rawCnt = cntEl ? parseInt(cntEl.value, 10) : NaN;
    const tmEl = document.getElementById('timed');
    timed = tmEl ? tmEl.checked : timed;
    const shufEl = document.getElementById('pracShuffle');

    qs = (r.questions || []).filter(q => !['poll','open','rank','info','scale','brainstorm'].includes(q.type));
    if(shuffle){
      for(let i = qs.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [qs[i], qs[j]] = [qs[j], qs[i]];
      }
    }
    if(!isNaN(rawCnt) && rawCnt > 0) qs = qs.slice(0, rawCnt);
    if(!qs.length){
      if(errEl){ errEl.textContent = 'This deck has no gradable practice questions.'; errEl.style.display = 'block'; }
      return;
    }
  }
  if(!qs.length) return;

    qs, i:0, score:0, streak:0, best:0, right:0, creditSum:0,
    missed:[], missedQ:[], timed, tMax, shuffle, t:tMax, timer:null,
    sel:[], perm:null, matchPerm:null, matchPairs:[], matchLeft:0,
    sliderVal:0, pinXY:null, done:false

  show();
}

function stopTimer(){ if(run && run.timer){ clearInterval(run.timer); run.timer = null; } }

  } else if(t === 'match'){

  } else if(t === 'slider'){

        <button class="go" id="pinSubBtn" style="margin-top:10px" onclick="submitPin()" disabled>📍 Lock In Pin</button>
      </div>

  } else {

  $.innerHTML = `

      </div>

    if(l0){ l0.textContent = '⏱️ ' + qSec + 's'; l0.className = 'tlbl-pill'; }

function pick(i){
  if(run.done) return;
  const q = run.qs[run.i];
  const valid = (Array.isArray(q.correct_multi) && q.correct_multi.length) ? q.correct_multi : [q.c || 0];
  const ok = !!q.all_correct || valid.includes(i);
  grade(ok, ok ? 1 : 0, (q.a || [])[i] || '', {picked:[i], valid: q.all_correct ? (q.a||[]).map((_,k)=>k) : valid});
}

function toggleMulti(i){
  if(run.done) return;
  const pos = run.sel.indexOf(i);
  if(pos >= 0) run.sel.splice(pos, 1);
  else run.sel.push(i);
  run.sel.sort((a,b) => a - b);
  const btn = document.getElementById('mb' + i);
  if(btn) btn.classList.toggle('msel', run.sel.includes(i));
  const sub = document.getElementById('multiSubBtn');
  if(sub){
    sub.disabled = !run.sel.length;
    sub.textContent = `✅ Submit Selection (${run.sel.length})`;
  }
}

function submitMulti(){
  if(run.done || !run.sel.length) return;
  const q = run.qs[run.i];
  const picked = run.sel.slice();
  const req = (Array.isArray(q.correct_multi) && q.correct_multi.length) ? q.correct_multi : [q.c || 0];
  const exact = !!q.all_correct || (picked.length === req.length && picked.every(x => req.includes(x)));
  let credit = 0;
  if(exact) credit = 1;
  else if(q.partial !== false){
    const hits = picked.filter(x => req.includes(x)).length;
    const wrongs = picked.filter(x => !req.includes(x)).length;
    credit = Math.max(0, (hits - wrongs) / Math.max(1, req.length));
  }
  const sub = document.getElementById('multiSubBtn');
  if(sub) sub.disabled = true;
  const given = picked.map(k => (q.a || [])[k]).join(' + ');
  grade(exact, credit, given, {picked, valid: q.all_correct ? (q.a||[]).map((_,k)=>k) : req});
}

function drawMatch(){
  const q = run.qs[run.i], el = document.getElementById('matchBox');
  if(!el) return;
  const pairs = q.pairs || [];
  const n = pairs.length;
  const rightDisp = run.matchPerm.map(k => pairs[k].r);
  const allLinked = n > 0 && run.matchPairs.every(v => v >= 0);
  el.innerHTML = `
    <div class="match-cols">
      <div class="match-col">
        <div class="match-hdr">Prompts</div>
        ${pairs.map((p, li) => {
          const rj = run.matchPairs[li];
          const act = run.matchLeft === li && !run.done;
          return `<button type="button" class="m-item${act ? ' active' : ''}" onclick="tapMatchLeft(${li})" ${run.done ? 'disabled' : ''}><span>${esc(p.l)}</span>${rj >= 0 ? `<span class="m-badge pc${li%6}">#${li+1}</span>` : ''}</button>`;
        }).join('')}
      </div>
      <div class="match-col">
        <div class="match-hdr">Matches</div>
        ${rightDisp.map((rt, rj) => {
          const li = run.matchPairs.indexOf(rj);
          return `<button type="button" class="m-item" onclick="tapMatchRight(${rj})" ${run.done ? 'disabled' : ''}><span>${esc(rt)}</span>${li >= 0 ? `<span class="m-badge pc${li%6}">#${li+1}</span>` : ''}</button>`;
        }).join('')}
      </div>
    </div>
    ${!run.done ? `<button class="go" onclick="submitMatch()" ${allLinked ? '' : 'disabled'}>🔗 Submit Pairs (${run.matchPairs.filter(v => v >= 0).length}/${n})</button>` : ''}
  `;
}

function tapMatchLeft(li){
  if(run.done) return;
  if(run.matchPairs[li] >= 0){
    run.matchPairs[li] = -1;
    run.matchLeft = li;
  } else {
    run.matchLeft = (run.matchLeft === li) ? null : li;
  }
  drawMatch();
}

function tapMatchRight(rj){
  if(run.done) return;
  const existingLi = run.matchPairs.indexOf(rj);
  let targetLi = run.matchLeft;
  if(targetLi === null || targetLi === undefined){
    if(existingLi >= 0){
      run.matchPairs[existingLi] = -1;
      run.matchLeft = existingLi;
      drawMatch();
      return;
    }
    targetLi = run.matchPairs.findIndex(v => v < 0);
  }
  if(targetLi === null || targetLi < 0) return;
  if(existingLi >= 0) run.matchPairs[existingLi] = -1;
  run.matchPairs[targetLi] = rj;
  const nextUnpaired = run.matchPairs.findIndex(v => v < 0);
  run.matchLeft = nextUnpaired >= 0 ? nextUnpaired : null;
  drawMatch();
}

function submitMatch(){
  if(run.done) return;
  const q = run.qs[run.i], pairs = q.pairs || [], n = pairs.length;
  if(run.matchPairs.some(v => v < 0)) return;
  let hits = 0;
  const parts = [];
  for(let li = 0; li < n; li++){
    const origIdx = run.matchPerm[run.matchPairs[li]];
    const chosenR = pairs[origIdx].r;
    if(origIdx === li || chosenR.trim().toLowerCase() === pairs[li].r.trim().toLowerCase()) hits++;
    parts.push(`${pairs[li].l} → ${chosenR}`);
  }
  const ok = !!q.all_correct || hits === n;
  const credit = ok ? 1 : (hits / Math.max(1, n));
  grade(ok, credit, parts.join(', '));
  drawMatch();
}

function syncSlider(v){
  if(run.done) return;
  const q = run.qs[run.i], sc = q.slider || {min:0, max:100, step:1, unit:''};
  const num = parseFloat(v);
  if(isNaN(num)) return;
  run.sliderVal = num;
  const rEl = document.getElementById('slRange');
  const nEl = document.getElementById('slNum');
  const rd = document.getElementById('slReadout');
  if(rEl && rEl.value !== String(num)) rEl.value = num;
  if(nEl && document.activeElement !== nEl) nEl.value = num;
  if(rd) rd.textContent = num + (sc.unit ? ' ' + sc.unit : '');
}

function submitSlider(){
  if(run.done) return;
  const q = run.qs[run.i], sc = q.slider || {min:0, max:100, step:1, target:50, margin:0, unit:''};
  const nEl = document.getElementById('slNum');
  let val = nEl ? parseFloat(nEl.value) : run.sliderVal;
  if(isNaN(val)) val = run.sliderVal;
  val = Math.max(Number(sc.min), Math.min(Number(sc.max), val));
  const diff = Math.abs(val - Number(sc.target));
  const mg = Number(sc.margin) || 0;
  let ok = false, credit = 0;
  if(q.all_correct || diff <= 1e-6){ ok = true; credit = 1; }
  else if(mg > 0 && diff <= mg + 1e-6){ ok = true; credit = Math.max(0.75, 1 - 0.25 * (diff / mg)); }
  const rEl = document.getElementById('slRange'), bEl = document.getElementById('slSubBtn');
  if(rEl) rEl.disabled = true;
  if(nEl) nEl.disabled = true;
  if(bEl) bEl.disabled = true;
  grade(ok, credit, `${val}${sc.unit ? ' ' + sc.unit : ''}`);
}

function placePin(ev){
  if(run.done) return;
  const st = document.getElementById('pinStage');
  if(!st) return;
  const rect = st.getBoundingClientRect();
  if(!rect.width || !rect.height) return;
  const x = Math.max(0, Math.min(100, ((ev.clientX - rect.left) / rect.width) * 100));
  const y = Math.max(0, Math.min(100, ((ev.clientY - rect.top) / rect.height) * 100));
  run.pinXY = [Number(x.toFixed(1)), Number(y.toFixed(1))];
  const mk = document.getElementById('pinMarker');
  if(mk){ mk.style.display = 'block'; mk.style.left = run.pinXY[0] + '%'; mk.style.top = run.pinXY[1] + '%'; }
  const cd = document.getElementById('pinCoord');
  if(cd) cd.textContent = `Pin placed at (${Math.round(run.pinXY[0])}%, ${Math.round(run.pinXY[1])}%) — tap again to adjust`;
  const btn = document.getElementById('pinSubBtn');
  if(btn) btn.disabled = false;
}

function submitPin(){
  if(run.done || !run.pinXY) return;
  const q = run.qs[run.i], pn = q.pin || {x:50, y:50, r:12};
  const [px, py] = run.pinXY;
  const r = Math.max(1, Number(pn.r) || 12);
  const dist = Math.hypot(px - Number(pn.x), py - Number(pn.y));
  const ok = !!q.all_correct || dist <= r;
  const credit = ok ? Math.max(0.6, 1 - 0.4 * (dist / r)) : 0;
  const svg = document.getElementById('pinSvg');
  if(svg){
    svg.innerHTML = `<ellipse cx="${pn.x}" cy="${pn.y}" rx="${r}" ry="${r}" fill="rgba(46,204,113,0.32)" stroke="#69f0ae" stroke-width="1.2"/>`;
  }
  const btn = document.getElementById('pinSubBtn');
  if(btn) btn.disabled = true;
  grade(ok, credit, `(${Math.round(px)}%, ${Math.round(py)}%)`);
}

function submitText(){
  if(run.done) return;
  const q = run.qs[run.i];
  const el = document.getElementById('txt');
  const v = el ? el.value : '';
  if(!v.trim()) return;
  if(el) el.disabled = true;
  const ok = !!q.all_correct || (q.a || []).some(a => norm(a) === norm(v));
  grade(ok, ok ? 1 : 0, v);
}

function drawOrder(){
  const q = run.qs[run.i], el = document.getElementById('ord');
  if(!el) return;
  const disp = run.perm.map(k => q.a[k]);
  el.innerHTML =
    run.sel.map((j, n) => `<div class="slot" onclick="removeOrd(${n})"><span><b>#${n+1}</b> ${esc(disp[j])}</span><span class="rm">✕</span></div>`).join('') +
    `<div class="grid">${disp.map((a, j) => run.sel.includes(j) ? '' : `<button class="c${j%6}" style="min-height:70px" onclick="tapOrd(${j})"><span>${esc(a)}</span></button>`).join('')}</div>` +
    `<div style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px">${run.sel.length && !run.done ? `<button class="sec" style="margin:0" onclick="run.sel.pop();drawOrder()">↩ Undo</button>` : ''}${run.sel.length === disp.length && !run.done ? `<button class="go" style="margin:0;flex:1" onclick="submitOrder()">✅ Submit Order</button>` : ''}</div>`;
}
function tapOrd(j){ if(run.done) return; run.sel.push(j); drawOrder(); }
function removeOrd(pos){ if(run.done) return; run.sel.splice(pos, 1); drawOrder(); }
function submitOrder(){
  const q = run.qs[run.i];
  const orig = run.sel.map(j => run.perm[j]);
  const ok = !!q.all_correct || orig.every((v, i) => v === i);
  grade(ok, ok ? 1 : 0, orig.map(k => q.a[k]).join(' → '));
}

function ansText(q){
  if(q.all_correct) return 'Any option (all accepted)';
  const t = qtype(q);
  if(t === 'order') return (q.a || []).join(' → ');
  if(t === 'text') return (q.a || []).slice(0, 3).join(' / ');
  if(t === 'multi'){
    const cm = (Array.isArray(q.correct_multi) && q.correct_multi.length) ? q.correct_multi : [q.c || 0];
    return cm.map(k => (q.a || [])[k]).filter(Boolean).join(' + ');
  }
  if(t === 'match') return (q.pairs || []).map(p => `${p.l} → ${p.r}`).join(', ');
  if(t === 'slider'){
    const sl = q.slider || {};
    const u = sl.unit ? ' ' + sl.unit : '';
    return sl.margin ? `${sl.target}${u} (±${sl.margin})` : `${sl.target}${u}`;
  }
  if(t === 'pin'){
    const pn = q.pin || {};
    return `Target zone (${Math.round(pn.x ?? 50)}%, ${Math.round(pn.y ?? 50)}%)`;
  }
  if(Array.isArray(q.correct_multi) && q.correct_multi.length > 1){
    return q.correct_multi.map(k => (q.a || [])[k]).filter(Boolean).join(' OR ');
  }
  return (q.a || [])[q.c || 0] || '';
}

function grade(ok, credit, given, meta){
  if(run.done) return;
  run.done = true;
  stopTimer();
  stopSpeak();
  const q = run.qs[run.i], t = qtype(q);
  const zImg = document.getElementById('qStemImg');
  if(zImg) zImg.classList.remove('zoom-go');

  const cr = Math.max(0, Math.min(1, Number(credit) || 0));
  const partial = !ok && cr > 0;
  const ptsScale = (q.pts != null) ? (Number(q.pts) / 1000) : 1;
  let pts = 0;
  run.creditSum += ok ? 1 : cr;

  if(ok){
    run.streak++;
    run.best = Math.max(run.best, run.streak);
    run.right++;
    pts = Math.round((100 + Math.min(100, (run.streak - 1) * 25)) * cr * ptsScale);
    run.score += pts;
    sfxCorrect();
  } else if(partial){
    run.streak = 0;
    pts = Math.round(100 * cr * ptsScale);
    run.score += pts;
    run.missed.push({q: q.q, your: given, ans: ansText(q)});
    run.missedQ.push(q);
    sfxPartial();
  } else {
    run.streak = 0;
    run.missed.push({q: q.q, your: given, ans: ansText(q)});
    run.missedQ.push(q);
    sfxWrong();
  }
  syncHud();

  const picked = (meta && meta.picked) || [];
  const valid = (meta && meta.valid) || [];
  document.querySelectorAll('.grid button').forEach((b, i) => {
    b.disabled = true;
    b.classList.remove('msel');
    if(['mc','tf','zoom','multi'].includes(t)){
      if(picked.includes(i)) b.classList.add('picked');
      if(valid.includes(i)) b.classList.add('right');
      else b.classList.add('dim');
    }
  });

  const fb = document.getElementById('fb');
  const cls = ok ? 'ok' : partial ? 'partial' : 'no';
  const headline = ok
    ? `✅ Correct! +${pts} pts${run.streak > 1 ? ' · 🔥 ' + run.streak + ' streak' : ''}`
    : partial
      ? `⚡ Partial Credit! +${pts} pts (${Math.round(cr * 100)}%)`
      : '❌ Not quite';
  fb.innerHTML = `
    <div class="fb ${cls}">
      ${headline}
      ${ok ? '' : `<div style="font-size:.86em;font-weight:750;margin-top:4px;opacity:.95">Correct answer: <b>${esc(ansText(q))}</b></div>`}
    </div>
    ${q.quote ? `<blockquote>“${esc(q.quote)}”${q.src ? `<div style="font-size:.82em;font-style:normal;opacity:.75;margin-top:4px">— ${esc(q.src)}</div>` : ''}</blockquote>` : ''}
    <button class="go" onclick="run.i++;show()">${run.i + 1 >= run.qs.length ? '🏆 See Final Results' : 'Next Question ➔'}</button>
  `;
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function retryMissed(){
  if(!run || !run.missedQ || !run.missedQ.length) return;
  start(run.missedQ.slice());
}

function finish(){
  stopSpeak();
  syncHud();
  const pct = Math.round(100 * run.creditSum / Math.max(1, run.qs.length));
  if(pct >= 80) confettiBurst();
  $.innerHTML = `
    <div class="card-panel">
      <div style="font-size:3em;line-height:1">${pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : '💪'}</div>
      <h1>Practice Complete!</h1>
      <div class="grade-hero">📊 Percentage Grade: ${pct}%</div>
      <div class="stats-grid">
        <div class="stat"><b>${pct}%</b>${run.right}/${run.qs.length} Exact</div>
        <div class="stat"><b>⭐ ${run.score}</b>Points</div>
        <div class="stat"><b>🔥 ${run.best}</b>Best Streak</div>
      </div>
      ${run.missed.length
        ? `<div class="review-box"><h3>📝 Review Missed (${run.missed.length})</h3>${run.missed.map(m => `<div class="missed"><b>${esc(m.q)}</b><br><span style="color:#ff9b9b">You: ${esc(m.your)}</span> &middot; <span style="color:#7dff6b">✅ ${esc(m.ans)}</span></div>`).join('')}</div>`
        : `<p style="color:#7dff6b;font-weight:850;margin:12px 0">🌟 Flawless run! You nailed every single question.</p>`
      }
      ${run.missedQ.length ? `<button class="go blue" onclick="retryMissed()">🎯 Retry ${run.missedQ.length} Missed Question${run.missedQ.length === 1 ? '' : 's'}</button>` : ''}
      <button class="go" onclick="start()">🔁 Practice Full Quiz Again</button>
      <button class="sec" onclick="setup()">📚 Choose Another Quiz</button>
    </div>
  `;
}
setup();
</script></body></html>
